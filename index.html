// SOS短音（モールス信号風の短いビープ）
function playSosSE() {
  try {
    const ac = getAC();
    const now = ac.currentTime;
    // S・O・S（短・短・短 / 長・長・長 / 短・短・短）を小さく1回分だけ
    const pattern = [0.07, 0.07, 0.07]; // 「S」の3短音だけ
    pattern.forEach((dur, i) => {
      const t = now + i * 0.14;
      const osc = ac.createOscillator();
      const g = ac.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.04, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(g); g.connect(ac.destination);
      osc.start(t); osc.stop(t + dur + 0.02);
    });
  } catch(e) {}
}

function drawAstronaut(a){
  if(!a.alive) return;

  ctx.save();
  ctx.globalAlpha = a.captureAlpha !== undefined ? a.captureAlpha : 1;
  ctx.shadowBlur = 15;
  ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';

  ctx.translate(a.x, a.y);
  const sc = (a.captureScale !== undefined && a.captureScale < 1) ? a.captureScale : 1;
  if(sc < 1) ctx.scale(sc, sc);

  // SOSメッセージ（捕獲中は非表示）
  if(a.mode !== 'being_pulled'){
    const blink = Math.sin(Date.now() * 0.004) > 0;
    if(blink){
      ctx.save();
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#ff0';
      ctx.fillStyle = '#fff9ba';
      ctx.font = "bold 14px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
      ctx.textAlign = 'center';
      ctx.fillText('SOS', 0, -45);
      ctx.restore();
    }
  }

  ctx.rotate(a.rot);

  const drawSize = 65;
  if(astronautImg.complete && astronautImg.naturalWidth > 0){
    ctx.drawImage(astronautImg, -drawSize/2, -drawSize/2, drawSize, drawSize);
  } else {
    const s = 2.4;
    ctx.fillStyle = '#f0faff';
    ctx.beginPath(); ctx.arc(0, -8*s, 6*s, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(-5*s, -3*s, 10*s, 12*s);
  }
  ctx.restore();
}

function updateAstronauts(dt){
  if(!dt) return;
  // 宇宙飛行士はミッション３から出現
  if(st().id >= 3){
    astronautSpawnTimer -= dt;
    if(astronautSpawnTimer <= 0){
      spawnAstronaut();
      astronautSpawnTimer = 35 + Math.random() * 20;
    }
  }

  for(const a of astronauts){
    if(!a.alive) continue;

    a.timer += dt;
    a.rot += a.rotV;

    // 衝突速度を位置に反映・減衰
    if(a.vx || a.vy){
      a.x += a.vx * dt * 60;
      a.y += a.vy * dt * 60;
      a.vx *= Math.pow(0.85, dt * 60);
      a.vy *= Math.pow(0.85, dt * 60);
      if(Math.abs(a.vx) < 0.01) a.vx = 0;
      if(Math.abs(a.vy) < 0.01) a.vy = 0;
    }

    if(a.mode === 'enter'){
      a.x += (a.targetX - a.x) * dt * 0.5;
      a.y += (a.targetY - a.y) * dt * 0.5;
      if(Math.abs(a.x - a.targetX) < 5) a.mode = 'drift';
    }
    else if(a.mode === 'drift'){
      a.x += Math.sin(a.timer * 0.5 + a.driftOffset) * 0.3;
      a.y += Math.cos(a.timer * 0.8 + a.driftOffset) * 0.2;

      // SOS音：約2.5秒ごとに1回鳴らす
      if(!a.sosTimer) a.sosTimer = 1.0 + Math.random(); // 初回は少しずらす
      a.sosTimer -= dt;
      if(a.sosTimer <= 0){
        playSosSE();
        a.sosTimer = 2.5 + Math.random() * 0.5;
      }

      // 捕獲タイマーが来たらUFO召喚
      if(!a.beingCaptured && a.timer > a.captureTimer){
        a.beingCaptured = true;
        spawnCaptureUfo(a);
      }
    }
    // being_pulled: UFOに向かって縮みながら吸い込まれる
    else if(a.mode === 'being_pulled'){
      const ufo = a.captureUfoRef;
      const targetX = ufo ? ufo.x : a.x;
      const targetY = ufo ? ufo.y + 10 : a.y - 60;
      // UFOの位置に向かって引き寄せる
      a.x += (targetX - a.x) * dt * 1.5;
      a.y += (targetY - a.y) * dt * 1.5;
      a.captureAlpha = Math.max(0, a.captureAlpha - dt * 0.4);
      a.captureScale = Math.max(0, (a.captureScale || 1) - dt * 0.55);
      a.rot += 0.06;
      if(a.captureScale <= 0.05) {
        a.alive = false;
        // UFOにビームを消させて立ち去らせる
        if(ufo){ ufo.beamActive = false; ufo.mode = 'depart'; }
      }
    }
  }

  astronauts = astronauts.filter(a => a.alive);
}

function checkAstronautRescue(){
  const rx = rocketX;
  const ry = H - 90;
  for(const a of astronauts){
    if(!a.alive) continue;
    const dx = a.x - rx;
    const dy = a.y - ry;
    if(dx*dx + dy*dy < 60 * 60){ // 大きなサイズに合わせた当たり判定
      a.alive = false;
      energy = Math.min(ENERGY_MAX, energy + ENERGY_RESCUE_GAIN);
      life = Math.round(energy/ENERGY_MAX*LIFE_MAX);
      pickupFlash = 0.5;
      playRescueSE();
    }
  }
}

// --- Journey Progress Map (shown during stage_clear overlay) ---
const PLANET_LABELS = ['地球','月','火星','木星','土星','天王星','海王星','心臓星'];
const PLANET_GETTERS = [
  ()=>earthCanvas, ()=>moonCanvas, ()=>marsCanvas, ()=>jupiterCanvas,
  ()=>saturnCanvas, ()=>uranusCanvas, ()=>neptuneCanvas, ()=>goalCanvas
];
// 元画像（マップアイコン高解像度描画用）
const PLANET_IMGS = [
  ()=>earthImg, ()=>moonImg, ()=>marsImg, ()=>jupiterImg,
  ()=>saturnImg, ()=>uranusImg, ()=>neptuneImg, ()=>goalImg
];
const PLANET_COLORS = ['#3a8fd4','#b0b0b0','#c1440e','#e3bb76','#dfd193','#ace5ee','#4b70dd','#ffffff'];

// 航路マップのホバー中の星インデックス
let mapHoveredStar = -1;

// スタート画面での航路マップY位置オフセット（免責スペース確保のため上にずらす）
const START_MAP_OFFSET = 30;

function drawProgressMap(completedMissions, yOffset){
  // completedMissions: 0-7, number of missions done (stageIdx after completion)
  // yOffset: スタート画面では START_MAP_OFFSET 分上にずらす
  const _off = yOffset || 0;
  const mapH = 82;
  const mapY = H - mapH - 4 - _off;
  
  ctx.save();
  ctx.fillStyle = 'rgba(0,10,30,0.85)';
  ctx.beginPath(); ctx.roundRect(6, mapY, W - 12, mapH, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(100,160,255,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(6, mapY, W - 12, mapH, 8); ctx.stroke();

  ctx.fillStyle = 'rgba(180,220,255,0.7)';
  ctx.font = "bold 8px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  ctx.textAlign = 'center';
  ctx.fillText('航路マップ', W/2, mapY + 11);

  const N = 8;
  const PAD = 18;
  const slotW = (W - 12 - PAD * 2) / (N - 1);
  const lineY = mapY + 38;
  const iconR = 10;

  // Draw connecting line (completed part)
  for(let i = 0; i < N - 1; i++){
    const x1 = 6 + PAD + i * slotW;
    const x2 = 6 + PAD + (i + 1) * slotW;
    ctx.beginPath();
    ctx.lineWidth = 2;
    if(i < completedMissions){
      // completed segment
      const g = ctx.createLinearGradient(x1, 0, x2, 0);
      g.addColorStop(0, PLANET_COLORS[i]);
      g.addColorStop(1, PLANET_COLORS[i+1]);
      ctx.strokeStyle = g;
    } else {
      ctx.strokeStyle = 'rgba(100,140,200,0.2)';
    }
    ctx.moveTo(x1, lineY); ctx.lineTo(x2, lineY); ctx.stroke();
  }

  // Draw planets
  for(let i = 0; i < N; i++){
    const x = 6 + PAD + i * slotW;
    const isGoal = (i === N - 1);
    // 地球(i=0)は常に明瞭。それ以外はクリア済みの場合のみ明瞭
    // isDone: i==0(地球)は常にtrue、それ以外は i <= completedMissions
    const isDone = (i === 0) || (i <= completedMissions);
    // isVisible: 明瞭に表示するか（クリック可能かにも連動）
    const isVisible = isDone;
    const img = PLANET_IMGS[i]();
    const isSaturn = (i === 4); // 土星はリング付き横長（index=4）

    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    if(!isVisible){
      ctx.globalAlpha = 0.18;
    }

    if(img && img.complete && img.naturalWidth){
      if(isSaturn){
        // 土星：本体はiconRと同じサイズ、リングは少しだけはみ出す
        const asp = img.naturalWidth / Math.max(img.naturalHeight, 1);
        const dh = iconR * 2;
        const dw = dh * asp;
        ctx.drawImage(img, x - dw/2, lineY - dh/2, dw, dh);
      } else {
        // 正方形画像：円形クリップして描画
        const iw = img.naturalWidth, ih = img.naturalHeight;
        const sq = Math.min(iw, ih);
        const sx = (iw - sq) / 2, sy = (ih - sq) / 2;
        ctx.beginPath(); ctx.arc(x, lineY, iconR, 0, Math.PI * 2); ctx.clip();
        ctx.drawImage(img, sx, sy, sq, sq, x - iconR, lineY - iconR, iconR * 2, iconR * 2);
      }
    } else {
      ctx.fillStyle = PLANET_COLORS[i];
      ctx.beginPath(); ctx.arc(x, lineY, iconR, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    // Completed checkmark ring
    if(isDone && !isGoal){
      ctx.save();
      ctx.strokeStyle = 'rgba(100,255,180,0.85)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, lineY, iconR + 2, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    // 心臓星：全クリア時に緑リング（脈打つグロー付き）
    if(isGoal && completedMissions >= N - 1){
      const pulse = 0.7 + 0.3 * Math.abs(Math.sin(_uiTime * 2.2));
      ctx.save();
      ctx.shadowColor = `rgba(100,255,180,${0.7 * pulse})`;
      ctx.shadowBlur = 6 * pulse;
      ctx.strokeStyle = `rgba(100,255,180,${0.85 * pulse})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, lineY, iconR + 2, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    // Hover highlight ring
    if(i === mapHoveredStar && (state==='start'||state==='stage_clear'||state==='all_clear'||state==='over')){
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,180,0.95)';
      ctx.lineWidth = 2;
      ctx.shadowColor = 'rgba(255,255,100,0.9)';
      ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(x, lineY, iconR + 4, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    // Label
    ctx.save();
    ctx.fillStyle = isVisible ? 'rgba(180,220,255,0.9)' : 'rgba(100,130,180,0.3)';
    ctx.font = `${isGoal ? 'bold ' : ''}7px sans-serif`;
    ctx.textAlign = 'center';
    ctx.globalAlpha = 1;
    ctx.fillText(PLANET_LABELS[i], x, lineY + iconR + 10);
    ctx.restore();
  }

  ctx.textAlign = 'left';
  ctx.restore();
}
// ロケットの当たり判定用ポイント（ローカル座標、rocketTilt込みで変換して使う）
// 機体形状：先端・胴体上部・胴体下・左翼・右翼
function getRocketHitPoints(cx, cy, tilt){
  const cos = Math.cos(tilt), sin = Math.sin(tilt);
  const local = [
    [0, -60],   // 先端
    [-10, -30], // 胴体左上
    [ 10, -30], // 胴体右上
    [-13,  10], // 胴体左中
    [ 13,  10], // 胴体右中
    [-22,  28], // 左翼先端
    [ 22,  28], // 右翼先端
    [  0,  30], // 底中央
  ];
  return local.map(([lx,ly])=>[
    cx + lx*cos - ly*sin,
    cy + lx*sin + ly*cos
  ]);
}

function checkCollisions(){
  const rx=rocketX, ry=H-90;
  const hitPoints = getRocketHitPoints(rx, ry, rocketTilt);
  for(const d of debris){
    if(!d.alive) continue;
    // いずれかの判定点が隕石円内に入ったら衝突
    const r2 = (d.r + 2) * (d.r + 2);
    let hit = false;
    for(const [px,py] of hitPoints){
      const dx=d.x-px, dy=d.y-py;
      if(dx*dx+dy*dy < r2){ hit=true; break; }
    }
    if(hit){
      d.alive=false; energy=Math.max(0,energy-ENERGY_HIT_COST); life=Math.round(energy/ENERGY_MAX*LIFE_MAX); hitFlash=0.5;
      addMeteorDebris(d.x, d.y, d.r);
      playMeteorHitSE();
      shakeX=(Math.random()-0.5)*12; shakeY=(Math.random()-0.5)*8;
      setTimeout(()=>{shakeX=0;shakeY=0;},200);
    }
  }
  for(const it of items){
    if(!it.alive) continue;
    // ハートの実描画半径（base=38の約半分）に合わせた厳密な判定
    const heartR = 16;
    const heartR2 = heartR * heartR;
    // ロケットのhitPointsのいずれかがハート円内に入ったら接触
    let hit = false;
    for(const [px,py] of hitPoints){
      const dx=it.x-px, dy=it.y-py;
      if(dx*dx+dy*dy < heartR2){ hit=true; break; }
    }
    if(hit){
      it.alive=false;
      if(it.isHeart){
        stopBgm(); // ハート取得時にBGM即停止
        if(it.isCorrect){ energy=Math.min(ENERGY_MAX,energy+ENERGY_HEART_GAIN); life=Math.round(energy/ENERGY_MAX*LIFE_MAX); pickupFlash=0.5; playCorrectSE(); hintDismissed=true; }
        else            { energy=Math.max(0,energy-ENERGY_WRONG_COST); life=Math.round(energy/ENERGY_MAX*LIFE_MAX); hitFlash=0.4; playWrongSE(); }
      } else {
        pickupFlash=0.3;
      }
    }
  }
}
function checkMissedHearts(){
  for(const it of items){
    if(!it.alive) continue;
    if(it.y > H+30){
      it.alive=false;
      // 正解ハートを逃したらエネルギー減、不正解は何もしない
      if(it.isHeart && it.isCorrect){ energy=Math.max(0,energy-ENERGY_MISS_COST); life=Math.round(energy/ENERGY_MAX*LIFE_MAX); hitFlash=0.3; playMissSE(); lastMissedAnswer = it.label; }
      else if(!it.isHeart)          { energy=Math.max(0,energy-ENERGY_MISS_COST); life=Math.round(energy/ENERGY_MAX*LIFE_MAX); hitFlash=0.3; playMissSE(); }
    }
  }
}

// 隕石がハート・宇宙飛行士に当たると弾く（隕石はそのまま）
function checkDebrisHitsObjects(){
  for(const d of debris){
    if(!d.alive) continue;

    // ハートは隕石と干渉しない（軌跡変化なし）

    // 宇宙飛行士を弾く
    for(const a of astronauts){
      if(!a.alive) continue;
      const dx=a.x-d.x, dy=a.y-d.y;
      const distSq=dx*dx+dy*dy;
      const minD=d.r+a.r;
      if(distSq<minD*minD){
        const dist=Math.sqrt(distSq)||1;
        const nx=dx/dist, ny=dy/dist;
        const force=3.5+d.r*0.12;
        // 速度として加える（スムーズな移動）
        a.vx += nx * force;
        a.vy += ny * force;
        // 浮遊パターンと目標もずらす
        a.driftOffset+=(Math.random()-0.5)*1.5;
        if(a.mode!=='being_pulled'){
          a.targetX = Math.max(20, Math.min(W-20, a.x + nx * 25));
          a.targetY = Math.max(50, Math.min(H-120, a.y + ny * 20));
        }
      }
    }
  }
}

function loop(ts){
  const dt=Math.min((ts-lastTime)/1000,0.05);
  lastTime=ts;

  if(state==='launch_anim'){
    if(launchT === 0 && dt > 0) playLaunchSound();
    launchT=Math.min(1,launchT+dt/LAUNCH_DUR);
    starScroll+=dt*30;
    for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.life-=dt/p.maxLife;}
    particles=particles.filter(p=>p.life>0);
    drawStars(); drawLaunchAnim(); drawParticles();
    if(launchT>=1) state='playing';
    requestAnimationFrame(loop); return;
  }

  // ===== 大破アニメーション =====
  if(state === 'exploding'){
    explosionT += dt;
    _uiTime += dt;

    // 効果音は最初の1フレームで再生
    if(!explosionPlayed && explosionT > 0){
      playExplosionSE();
      explosionPlayed = true;
    }

    // 背景を描画
    drawStars();

    // ── パーティクル物理更新 ──
    for(const p of explosionParticles){
      if(p.delay && explosionT < p.delay) continue;
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.grav || 0;
      p.vx *= p.drag || 1;
      p.vy *= p.drag || 1;
      p.life -= dt / p.maxLife;
      if(p.rot !== undefined) p.rot += p.rotV;
      // 破片・火の粉のトレイル蓄積
      if((p.isDebris || p.isEmber) && p.trail !== undefined){
        p.trail.push({x: p.x, y: p.y});
        if(p.trail.length > 6) p.trail.shift();
      }
    }

    // ── 爆発コア光球（白→橙→消滅） ──
    if(explosionT < 0.55){
      const ct = explosionT / 0.55;
      const coreR = (1 - ct) * 62 + ct * 12;
      const coreA = Math.max(0, 1 - ct * 1.1);
      ctx.save();
      const cg = ctx.createRadialGradient(explosionX, explosionY, 0, explosionX, explosionY, coreR);
      cg.addColorStop(0,   `rgba(255,255,240,${coreA})`);
      cg.addColorStop(0.2, `rgba(255,240,140,${coreA * 0.9})`);
      cg.addColorStop(0.5, `rgba(255,120,20,${coreA * 0.7})`);
      cg.addColorStop(1,   `rgba(180,30,0,0)`);
      ctx.fillStyle = cg;
      ctx.beginPath(); ctx.arc(explosionX, explosionY, coreR, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    // ── 衝撃波リング（2重・速度差あり） ──
    for(const [delay, maxR, col] of [[0, W*0.7, 'rgba(255,200,100,'], [0.06, W*0.5, 'rgba(255,255,220,']]) {
      const rt = Math.min(1, Math.max(0, (explosionT - delay) / 0.45));
      if(rt > 0 && rt < 1){
        const rr = rt * maxR;
        const ra = (1 - rt) * 0.75;
        ctx.save();
        ctx.beginPath(); ctx.arc(explosionX, explosionY, rr, 0, Math.PI*2);
        ctx.strokeStyle = `${col}${ra})`;
        ctx.lineWidth = Math.max(1, (1 - rt) * 10);
        ctx.stroke();
        ctx.restore();
      }
    }

    // ── パーティクル描画 ──
    for(const p of explosionParticles){
      if(p.delay && explosionT < p.delay) continue;
      if(p.life <= 0) continue;
      const alpha = Math.max(0, p.life);
      ctx.save();
      ctx.globalAlpha = alpha;

      if(p.isSmokePuff){
        // 膨張する煙雲
        const growR = p.r * (1 + (1 - p.life) * 1.8);
        const sg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, growR);
        sg.addColorStop(0,   p.color);
        sg.addColorStop(0.5, p.color.replace('0.55', `${0.35 * p.life}`));
        sg.addColorStop(1,   'rgba(0,0,0,0)');
        ctx.fillStyle = sg;
        ctx.beginPath(); ctx.arc(p.x, p.y, growR, 0, Math.PI*2); ctx.fill();
      } else if(p.isSmoke){
        // 中速煙
        const growR = p.r * (1 + (1 - p.life) * 0.9);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, growR, 0, Math.PI*2); ctx.fill();
      } else if(p.isFireball){
        // 炎球（発光グラデ）
        ctx.shadowColor = p.color;
        ctx.shadowBlur = p.r * 3;
        const fg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 2.2 * p.life);
        fg.addColorStop(0,   '#ffffff');
        fg.addColorStop(0.25, p.color);
        fg.addColorStop(1,   'rgba(255,60,0,0)');
        ctx.fillStyle = fg;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 2.2 * p.life, 0, Math.PI*2); ctx.fill();
      } else if(p.isDebris){
        // 金属破片（軌跡＋回転四角）
        if(p.trail && p.trail.length > 1){
          ctx.globalAlpha = alpha * 0.35;
          ctx.strokeStyle = p.color;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(p.trail[0].x, p.trail[0].y);
          for(const tp of p.trail) ctx.lineTo(tp.x, tp.y);
          ctx.stroke();
          ctx.globalAlpha = alpha;
        }
        ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0);
        ctx.fillStyle = p.color;
        ctx.shadowColor = 'rgba(255,180,80,0.5)';
        ctx.shadowBlur = 4;
        ctx.fillRect(-p.r*0.6, -p.r*0.35, p.r*1.2, p.r*0.7);
      } else if(p.isEmber){
        // 火の粉（軌跡＋先端グロー）
        if(p.trail && p.trail.length > 1){
          ctx.globalAlpha = alpha * 0.5;
          ctx.strokeStyle = p.color;
          ctx.lineWidth = p.r * 1.2;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(p.trail[0].x, p.trail[0].y);
          for(const tp of p.trail) ctx.lineTo(tp.x, tp.y);
          ctx.stroke();
          ctx.globalAlpha = alpha;
        }
        ctx.shadowColor = p.color;
        ctx.shadowBlur = p.r * 4;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }
    explosionParticles = explosionParticles.filter(p => p.life > 0);

    // ── ロケット残骸：3つに分解して飛散 ──
    if(explosionT < 1.8){
      const frags = [
        { ox:-18, oy:-30, rot: explosionT * 5,   vx:-1.8, vy:-2.2, sc: Math.max(0.05, 0.7 - explosionT*0.38) },
        { ox: 14, oy:-10, rot:-explosionT * 6.5,  vx: 2.2, vy:-1.5, sc: Math.max(0.05, 0.6 - explosionT*0.32) },
        { ox:  0, oy: 20, rot: explosionT * 4,   vx: 0.4, vy: 2.5, sc: Math.max(0.05, 0.5 - explosionT*0.27) },
      ];
      for(const f of frags){
        const alpha = Math.max(0, 1 - explosionT * 0.65);
        if(alpha <= 0) continue;
        ctx.save();
        ctx.globalAlpha = alpha;
        const fx = explosionX + f.ox + f.vx * explosionT * 60;
        const fy = explosionY + f.oy + f.vy * explosionT * 60 + 0.5 * 0.09 * (explosionT*60)**2 * 0.01;
        ctx.translate(fx, fy);
        ctx.rotate(f.rot);
        ctx.scale(f.sc, f.sc);
        if(rocketImg && rocketImg.complete && rocketImg.naturalWidth > 0){
          if(astronautImg.complete && astronautImg.naturalWidth > 0){
            ctx.drawImage(astronautImg, -22, -22, 44, 44);
          }
        }
        ctx.restore();
      }
    }

    // ── 画面全体フラッシュ（冒頭の白フラッシュ） ──
    if(explosionT < 0.12){
      const fa = (1 - explosionT / 0.12) * 0.92;
      ctx.fillStyle = `rgba(255,240,200,${fa})`;
      ctx.fillRect(0, 0, W, H);
    }

    // ── 赤みパルス（0.1〜1.2秒） ──
    if(explosionT > 0.1 && explosionT < 1.2){
      const pulse = Math.max(0, Math.sin(explosionT * 22) * 0.5);
      ctx.fillStyle = `rgba(255,40,0,${pulse * 0.22})`;
      ctx.fillRect(0, 0, W, H);
    }

    // ── 暗転ベール（後半・煙の余韻） ──
    if(explosionT > 1.2){
      const darkA = Math.min(0.55, (explosionT - 1.2) * 0.38);
      ctx.fillStyle = `rgba(8,4,2,${darkA})`;
      ctx.fillRect(0, 0, W, H);
    }

    // 大破演出終了 → game over 画面へ
    if(explosionT >= EXPLOSION_DUR){
      state = 'over';
      _uiTime = 0;
      launchT = 0;
      arriveT = 0;
    }

    requestAnimationFrame(loop); return;
  }

  if(state==='arrive_anim'){
    if(arriveT === 0 && dt > 0){ playArriveSound(); stopUfoLoopSound(); stopBlackholeLoopSound(); }
    arriveT=Math.min(1,arriveT+dt/ARRIVE_DUR);
    starScroll+=dt*20;
    for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.life-=dt/p.maxLife;}
    particles=particles.filter(p=>p.life>0);
    updateUfos(dt);
    drawStars(); drawArriveAnim(); drawParticles();
    if(arriveT>=1){
      state=(stageIdx+1<STAGES.length)?'stage_clear':'all_clear';
      _uiTime = 0;
      // クリア済みミッション数を更新・保存
      completedCount = Math.max(completedCount, stageIdx + 1);
      saveCompletedCount();
      // isAnim()がtrueを返し続けないようにリセット
      arriveT = 0;
      launchT = 0;
    }
    requestAnimationFrame(loop); return;
  }

  if(state==='playing'){
    const s=st();
    speed=FIXED_SPEED;
    dist+=speed*dt*60;
    starScroll+=speed*dt*120;



    // 進捗バー：ハート出現ごとに目標値を更新し、一定速度で近づく
    { const maxHearts = s.heartCount || 6;
      const done = heartSpawnCount >= maxHearts && !heartSetActive && heartSetClearTimer <= 0;
      if (done) hudTarget = 1.0;
      // 一定速度（1セット分を約4秒で移動）でtargetに近づく
      const step = (1.0 / maxHearts) / 4.0;
      if (hudProgress < hudTarget) {
        hudProgress = Math.min(hudTarget, hudProgress + step * dt);
      }
    }

    const thrust=320+speed*100;
    const left=keys['ArrowLeft']||keys['a']||keys['A'];
    const right=keys['ArrowRight']||keys['d']||keys['D'];
    if(left)  rocketVX-=thrust*dt;
    if(right) rocketVX+=thrust*dt;
    // 左右移動時のエネルギー消費
    if(left||right) energy=Math.max(0, energy-ENERGY_MOVE_COST*dt);

    // ブラックホールが近くにある場合は減衰を弱める（rocketVXへの寄与を残すため）
    let bhNearFactor = 0;
    for(const bh of blackholes){
      if(!bh.alive) continue;
      const _dx = bh.x - rocketX, _dy = bh.y - (H - 90);
      const _d2 = _dx*_dx + _dy*_dy;
      if(_d2 < bh.pullR * bh.pullR){
        const _d = Math.sqrt(_d2) || 1;
        const proximity = 1 - _d / bh.pullR;
        if(proximity > bhNearFactor) bhNearFactor = proximity;
      }
    }
    const dampBase = (left||right) ? 0.78 : 0.72;
    const dampBH   = (left||right) ? 0.92 : 0.94;
    const damp = dampBase + (dampBH - dampBase) * bhNearFactor;
    rocketVX *= damp;
    rocketVX=Math.max(-260,Math.min(260,rocketVX));
    rocketX=Math.max(22,Math.min(W-22,rocketX+rocketVX*dt));

    // 傾き強化：最大±35度、追従速度アップ
    const targetTilt=(rocketVX/260)*0.62;
    rocketTilt+=(targetTilt-rocketTilt)*Math.min(1,dt*9);

    // スラスター炎パーティクル
    if(left&&Math.random()<0.65)  addThrusterFlame(rocketX,H-90, 1);
    if(right&&Math.random()<0.65) addThrusterFlame(rocketX,H-90,-1);

    if(hitFlash>0)    hitFlash-=dt;
    if(pickupFlash>0) pickupFlash-=dt;

    addExhaust(rocketX,H-90+8);
    for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.life-=dt/p.maxLife;}
    particles=particles.filter(p=>p.life>0);

    for(const d of debris){d.x+=d.vx;d.y+=d.vy;d.rot+=d.rotV;}
    debris=debris.filter(d=>d.y<H+40&&d.x<W+40&&d.alive);

    // 隕石同士の衝突
    for(let i=0;i<debris.length;i++){
      const a=debris[i]; if(!a.alive) continue;
      for(let j=i+1;j<debris.length;j++){
        const b=debris[j]; if(!b.alive) continue;
        const dx=b.x-a.x, dy=b.y-a.y;
        const dist2=dx*dx+dy*dy;
        const minD=a.r+b.r;
        if(dist2<minD*minD&&dist2>0){
          const d=Math.sqrt(dist2);
          const nx=dx/d, ny=dy/d;
          // 重なり解消
          const overlap=(minD-d)*0.5;
          a.x-=nx*overlap; a.y-=ny*overlap;
          b.x+=nx*overlap; b.y+=ny*overlap;
          // 速度交換（弾性衝突）
          const dvx=a.vx-b.vx, dvy=a.vy-b.vy;
          const dot=dvx*nx+dvy*ny;
          if(dot>0){
            const impulse=dot*0.85;
            a.vx-=nx*impulse; a.vy-=ny*impulse;
            b.vx+=nx*impulse; b.vy+=ny*impulse;
          }
        }
      }
    }

    for(const it of items){
      it.x+=it.vx; it.y+=it.vy;
      // 弾かれた後、元の軌跡に徐々に戻す
      if(it.bumped){
        it.bumpT=(it.bumpT||0)+0.04;
        const resume=Math.min(1,it.bumpT);
        it.vx+=(it.origVx-it.vx)*0.08;
        it.vy+=(it.origVy-it.vy)*0.08;
        if(resume>=1&&Math.abs(it.vx-it.origVx)<0.05&&Math.abs(it.vy-it.origVy)<0.05){
          it.vx=it.origVx; it.vy=it.origVy; it.bumped=false;
        }
      } else {
        it.vx*=0.96;
      }
    }

    // ハート同士の衝突（軽く軌道変化）
    const HEART_R=19;
    for(let i=0;i<items.length;i++){
      const a=items[i]; if(!a.alive) continue;
      for(let j=i+1;j<items.length;j++){
        const b=items[j]; if(!b.alive) continue;
        const dx=b.x-a.x, dy=b.y-a.y;
        const dist2=dx*dx+dy*dy;
        const minD=HEART_R*2;
        if(dist2<minD*minD&&dist2>0){
          const d=Math.sqrt(dist2);
          const nx=dx/d, ny=dy/d;
          const overlap=(minD-d)*0.5;
          a.x-=nx*overlap; a.y-=ny*overlap;
          b.x+=nx*overlap; b.y+=ny*overlap;
          const dvx=a.vx-b.vx, dvy=a.vy-b.vy;
          const dot=dvx*nx+dvy*ny;
          if(dot>0){
            const impulse=dot*0.5;
            a.vx-=nx*impulse; a.vy-=ny*impulse;
            b.vx+=nx*impulse; b.vy+=ny*impulse;
          }
          a.bumped=true; a.bumpT=0;
          b.bumped=true; b.bumpT=0;
        }
      }
    }

    spawnTimer-=dt;
    if(spawnTimer<=0){
      const interval=Math.max(0.8,2.2-dist/3000);
      if(!heartSetActive && heartSetClearTimer <= 0){
        const maxHearts = st().heartCount || 6;
        if(heartSpawnCount < maxHearts){ spawnHeartSets(); }
      }
      else if(Math.random()<0.45) spawnDebris();
      spawnTimer=interval*(0.6+Math.random()*0.8);
    }
    checkCollisions();
    checkMissedHearts();
    updateHeartSet(dt);
    if(!heartSetActive && heartSetClearTimer>0) heartSetClearTimer-=dt;
    checkDebrisHitsObjects();
    checkAstronautHeartCollision();
    checkBlackholeCollisions(dt);
    items=items.filter(it=>it.y<H+60&&it.alive);
    updateUfos(dt);
    updateAstronauts(dt);
    updateBlackholes(dt);
    checkAstronautRescue();

    if(energy<=0){
      // 大破演出を先に再生してから 'over' へ遷移
      if(state === 'playing'){
        state = 'exploding';
        _uiTime = 0;
        explosionT = 0;
        explosionX = rocketX;
        explosionY = H - 90;
        explosionPlayed = false;
        stopBgm();
        stopUfoLoopSound();
        stopBlackholeLoopSound();
        spawnExplosionParticles(explosionX, explosionY);
      }
    }
    { const maxHearts = s.heartCount || 6;
      if(heartSpawnCount >= maxHearts && !heartSetActive && heartSetClearTimer <= 0){
        state='arrive_anim'; arriveT=0; stopBgm(); stopUfoLoopSound(); stopBlackholeLoopSound();
      }
    }
  }

  drawStars();
  if(state==='playing'){ drawBgDest(); }
  for(const bh of blackholes) if(bh.alive) drawBlackhole(bh);
  for(const d of debris) if(d.alive) drawMeteor(d);
  drawSuckingObjects();
  for(const a of astronauts) if(a.alive) drawAstronaut(a);
  for(const u of ufos) drawUfo(u);
  for(const it of items) if(it.alive) drawHeartItem(it);
  if(state==='playing'){
    // Rocket wobble during playing
    rocketShakeT += 0.18;
    const playShakeX = Math.sin(rocketShakeT * 2.3) * 0.7 + Math.sin(rocketShakeT * 5.1) * 0.3;
    const playShakeY = Math.sin(rocketShakeT * 3.7) * 0.4;
    drawRocketAt(rocketX + shakeX + playShakeX, H - 90 + shakeY + playShakeY, false, rocketTilt);
  }
  drawParticles();
  drawHitFlash();
  if(state==='playing') drawHUD();

  // --- オーバーレイ表示（状態に応じたメッセージ）の書き換え ---
  if (state === 'start') {
    _uiTime += dt;
    drawStartScreen();
  } 
  else if (state === 'over') {
    _uiTime += dt;
    drawGameOverScreen();
  } 
  else if (state === 'stage_clear') {
    _uiTime += dt;
    drawStageClearScreen(stageIdx);
  } 

  updateBtn();
  requestAnimationFrame(loop);
}

function startStage(idx){
  stageIdx=idx;
  stopBgm();
  stopUfoLoopSound();
  stopBlackholeLoopSound();
  currentBlock = null;
  _uiTime = 0;
  rocketX=W/2; rocketVX=0; rocketTilt=0; speed=FIXED_SPEED; dist=0;

// =========================
// 共通：星クリック判定関数
// =========================
function getClickedStage(mx, my){
  const mapH = 82;
  const _off = (state === 'start') ? START_MAP_OFFSET : 0;
  const mapY = H - mapH - 4 - _off;
  const N = 8;
  const PAD = 18;
  const slotW = (W - 12 - PAD * 2) / (N - 1);
  const lineY = mapY + 38;
  const iconR = 16;

  for(let i = 0; i < N; i++){
    const sx = 6 + PAD + i * slotW;
    const dx = mx - sx;
    const dy = my - lineY;

    if(dx*dx + dy*dy < iconR*iconR){
      // 地球(i=0)は常にクリック可能、それ以外はクリア済みのみ
      const isUnlocked = (i === 0) || (i <= completedCount);
      if(!isUnlocked) return -1;
      // インデックス7（N-1）は心臓星（ゴール）なので、そのまま7を返す
      return i;
    }
  }

  return -1;
}

  // UI非表示

}

cv.addEventListener('touchstart',e=>{
  e.preventDefault();
  unlockAudio(); // iOS Audio アンロック（毎回resume）

  const t = e.touches[0];
  if(!t) return;

  const rect = cv.getBoundingClientRect();
  const mx = (t.clientX - rect.left) * (W / rect.width);
  const my = (t.clientY - rect.top) * (H / rect.height);

  // playing中はタッチ位置で左右移動を即開始
  if(state === 'playing'){
    keys['ArrowLeft']  = mx < W / 2;
    keys['ArrowRight'] = mx >= W / 2;
    return;
  }

  const stage = getClickedStage(mx, my);

  if(stage >= 0){
    // インデックス7（N-1）は心臓星 → お祝いアニメーションを表示
    if(stage === 7){
      showCelebration();
      return;
    }
    startFromMap(stage);
    return;
  }

  // スタート画面・ミッションクリア画面・全クリア画面・ゲームオーバー画面では星以外のタッチを無視
  // ゲームオーバー時は「再挑戦する」ボタンのみ有効
  if(state === 'start' || state === 'stage_clear' || state === 'all_clear' || state === 'over') return;

  handleStart();
},{passive:false});

  const rect = cv.getBoundingClientRect();

  const stage = getClickedStage(mx, my);

  if (state === 'start') return;

  if (state === 'stage_clear' || state === 'all_clear') return;

// 旅の回想ベルトを構築
function buildJourneyTrail() {
  const trail = document.getElementById('journeyTrail');
  trail.innerHTML = '';

  JOURNEY_DATA.forEach((d, i) => {
    // 惑星アイコン（canvas経由で円形に）
    const oc = document.createElement('canvas');
    if(d.isSaturn){
      oc.width = 46; oc.height = 28;
      oc.className = 'journey-saturn';
      oc.style.cssText = 'width:46px;height:28px;flex-shrink:0;';
      const c = oc.getContext('2d');
      c.imageSmoothingEnabled = true;
      c.imageSmoothingQuality = 'high';
      if(d.img.complete && d.img.naturalWidth){
        c.drawImage(d.img, 0, 0, 46, 28);
      }
    } else {
      oc.width = 28; oc.height = 28;
      oc.style.cssText = `width:28px;height:28px;flex-shrink:0;border-radius:50%;${i===7?'box-shadow:0 0 8px rgba(255,200,100,0.9);':''}`;
      const c = oc.getContext('2d');
      c.imageSmoothingEnabled = true;
      c.imageSmoothingQuality = 'high';
      c.beginPath(); c.arc(14,14,14,0,Math.PI*2); c.clip();
      if(d.img.complete && d.img.naturalWidth){
        const iw=d.img.naturalWidth,ih=d.img.naturalHeight;
        const sq=Math.min(iw,ih);
        c.drawImage(d.img,(iw-sq)/2,(ih-sq)/2,sq,sq,0,0,28,28);
      } else {
        c.fillStyle = d.color;
        c.fillRect(0,0,28,28);
      }
    }
    trail.appendChild(oc);

    // 最後の惑星の後はラインなし
    if(i < JOURNEY_DATA.length - 1){
      const line = document.createElement('div');
      line.className = 'journey-line';
      line.style.cssText = `width:14px;height:2px;flex-shrink:0;background:linear-gradient(90deg,${d.color},${JOURNEY_DATA[i+1].color});opacity:0.55;`;

}

// 豪華ファンファーレ（Web Audio API）
function playFanfare() {
  try {
    const ac = getAC();
    if (ac.state === 'suspended') { ac.resume().catch(() => {}); }

    // メロディー：壮大な到達感
    const melody = [
      {f:261.63,t:0.0, d:0.12,v:0.15},
      {f:329.63,t:0.12,d:0.12,v:0.15},
      {f:392.00,t:0.24,d:0.12,v:0.15},
      {f:523.25,t:0.36,d:0.25,v:0.20},
      {f:659.25,t:0.62,d:0.20,v:0.22},
      {f:783.99,t:0.82,d:0.20,v:0.22},
      {f:1046.5,t:1.02,d:0.55,v:0.28},
      {f:783.99,t:1.02,d:0.55,v:0.18},
      {f:1174.7,t:1.58,d:0.18,v:0.22},
      {f:1318.5,t:1.76,d:0.90,v:0.30},
      {f:1046.5,t:1.76,d:0.90,v:0.20},
    ];
    melody.forEach(({f,t,d,v})=>{
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.connect(gain); gain.connect(ac.destination);
      osc.type = 'triangle';
      osc.frequency.value = f;
      gain.gain.setValueAtTime(0, ac.currentTime+t);
      gain.gain.linearRampToValueAtTime(v, ac.currentTime+t+0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+t+d);
      osc.start(ac.currentTime+t);
      osc.stop(ac.currentTime+t+d+0.05);
    });

    // ベース和音
    [[130.81,261.63],[164.81,329.63],[196.00,392.00]].forEach(([f1,f2],i)=>{
      [f1,f2].forEach(f=>{
        const osc=ac.createOscillator(), gain=ac.createGain();
        osc.connect(gain); gain.connect(ac.destination);
        osc.type='sine'; osc.frequency.value=f;
        gain.gain.setValueAtTime(0.06,ac.currentTime+1.02);
        gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+2.8);
        osc.start(ac.currentTime+1.02);
        osc.stop(ac.currentTime+2.85);
      });
    });

    // 到着フラッシュ時の衝撃音（2.8秒後）
    const boom = ac.createOscillator();
    const boomGain = ac.createGain();
    boom.connect(boomGain); boomGain.connect(ac.destination);
    boom.type = 'sine'; boom.frequency.value = 80;
    boomGain.gain.setValueAtTime(0.35, ac.currentTime+2.8);
    boomGain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+3.3);
    boom.start(ac.currentTime+2.8); boom.stop(ac.currentTime+3.35);

  } catch(e){}
}

// 背景：流れ星＋星空をcanvasに描画
let celebAnimId = null;
function startCelebBgCanvas() {
  const canvas = document.getElementById('celebBgCanvas');
  const c = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W2 = canvas.offsetWidth || 320;
  const H2 = canvas.offsetHeight || 520;
  canvas.width = W2 * dpr; canvas.height = H2 * dpr;
  canvas.style.width = W2 + 'px'; canvas.style.height = H2 + 'px';
  c.scale(dpr, dpr);

  // 背景星
  const stars = Array.from({length:160},()=>({
    x:Math.random()*W2, y:Math.random()*H2,
    r:Math.random()*1.3+0.2,
    a:Math.random(), speed:0.3+Math.random()*0.7,
  }));
  // 流れ星
  const meteors = [];
  function addMeteor(){
    meteors.push({
      x:Math.random()*W2, y:-10,
      vx:1.5+Math.random()*2, vy:3+Math.random()*4,
      len:40+Math.random()*60, life:1, alpha:0.9
    });
  }
  let meteorTimer=0;

  function drawBg(ts){
    c.clearRect(0,0,W2,H2);
    // 星
    stars.forEach(s=>{
      s.a = 0.4+0.6*Math.abs(Math.sin(ts*0.001*s.speed+s.x));
      c.beginPath();
      c.arc(s.x,s.y,s.r,0,Math.PI*2);
      c.fillStyle=`rgba(255,255,255,${s.a})`;
      c.fill();
    });
    // 流れ星
    meteorTimer+=16;
    if(meteorTimer>700){ meteorTimer=0; addMeteor(); }
    for(let i=meteors.length-1;i>=0;i--){
      const m=meteors[i];
      m.x+=m.vx; m.y+=m.vy; m.life-=0.018;
      if(m.life<=0){ meteors.splice(i,1); continue; }
      const grd=c.createLinearGradient(m.x,m.y,m.x-m.vx/m.vy*m.len,m.y-m.len);
      grd.addColorStop(0,`rgba(255,255,220,${m.life*0.9})`);
      grd.addColorStop(1,'rgba(255,255,200,0)');
      c.strokeStyle=grd; c.lineWidth=1.5;
      c.beginPath(); c.moveTo(m.x,m.y);
      c.lineTo(m.x-m.vx/m.vy*m.len, m.y-m.len);
      c.stroke();
    }
    celebAnimId = requestAnimationFrame(drawBg);
  }
  if(celebAnimId) cancelAnimationFrame(celebAnimId);
  celebAnimId = requestAnimationFrame(drawBg);
}

function stopCelebBgCanvas(){
  if(celebAnimId){ cancelAnimationFrame(celebAnimId); celebAnimId=null; }
}

// arrive_anim が終わって all_clear になる瞬間をフック
const _origLoop_allclear = loop;
// arrive_animの完了検出：arriveT>=1かつstageIdx==6(最終)の時にお祝い
// loop内のarriveT>=1処理の後でstate='all_clear'になるので、
// updateBtn()で検出するのが確実
let _prevState = state;
const _origUpdateBtn = updateBtn;
updateBtn = function() {
  _origUpdateBtn();
  if(state === 'all_clear' && _prevState !== 'all_clear') {
    // 即座にお祝いオーバーレイを表示
    showCelebration();
  }
  _prevState = state;
};


// ===== 裏タブ時の音声停止／復帰 =====
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    // HTMLAudio BGMを一時停止（Android/PC）
    if (currentBgm && !currentBgm.paused) {
      currentBgm.pause();
    }
    // Web Audio API をサスペンド（iOS BGM・SE・ループ音）
    if (_audioCtx && _audioCtx.state === 'running') {
      _audioCtx.suspend().catch(() => {});
    }
  } else {
    // HTMLAudio BGMを再開（Android/PC）
    if (!_isIOS && currentBgm && currentBgm.paused && currentBgmFile) {
      currentBgm.play().catch(() => {});
    }
    // Web Audio API を再開（iOS）
    if (_audioCtx && _audioCtx.state === 'suspended') {
      _audioCtx.resume().then(() => {
        if (_isIOS && currentBgmFile && !_bgmSourceNode) {
          _playBgmWebAudio(currentBgmFile);
        }
      }).catch(() => {});
    }
  }
});

lastTime=performance.now();
requestAnimationFrame(loop);
</script>
