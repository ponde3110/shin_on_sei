<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>心音の旅　心臓星を目指して</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  background: #000008;
  overflow: hidden;
  font-family: var(--font-sans, -apple-system, sans-serif);
  -webkit-touch-callout: none;
}

/* ゲーム全体のラッパー：画面中央に縦長キャンバスを配置 */
#rw {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  /* PCではmax-widthで横が広がりすぎないようにする */
}

#rwrap {
  position: relative;
  display: inline-block;
  /* JS側で width/height をセット */
}

#rc {
  display: block;
}

#rctrl { display: none; }

#startBtn {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: 33%;
  z-index: 10;

  white-space: nowrap;
  min-width: 140px;

  padding: 12px 28px;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 2px;
  line-height: 1;

  color: #ffffff;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 999px;
  cursor: pointer;
  overflow: visible;

  background:
    radial-gradient(circle at 50% 35%,
      rgba(180,240,255,0.9) 0%,
      rgba(0,200,255,0.95) 35%,
      rgba(0,110,255,0.95) 70%,
      rgba(0,60,180,0.95) 100%
    );

  box-shadow:
    0 0 12px rgba(0,220,255,0.55),
    0 0 30px rgba(0,220,255,0.35),
    0 10px 24px rgba(0,0,0,0.45);

  text-shadow: 0 0 8px rgba(255,255,255,0.45);

  transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
  animation: cosmicLaunch 2.5s infinite ease-in-out;
}

#heartPlanetWrap {
  position: absolute;
  top: 30%;
  left: 50%;
  transform: translateX(-50%);
  width: 160px;
  height: 160px;
  z-index: 5;
}

/* 中央の心臓星 */
#heartPlanet {
  position: absolute;
  width: 110px;
  height: 110px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 3;
}

/* 公転軌道 */
#orbitPath {
  position: absolute;
  inset: 0;
  animation: orbitAround 8s linear infinite;
  transform-origin: center center;
}

/* 聴診器本体 */
#orbitStethoscope {
  position: absolute;
  width: 70px;
  height: auto;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) translateY(-65px) rotate(133deg);
  z-index: 6;
  opacity: 1;
  filter:
    drop-shadow(0 0 4px rgba(255,255,255,0.9))
    drop-shadow(0 0 10px rgba(200,220,255,0.6))
    drop-shadow(0 0 20px rgba(150,180,255,0.35));
}

/* 軌跡リング */
#orbitPath::before {
  content: "";
  position: absolute;
  width: 130px;
  height: 130px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 0 8px rgba(255,255,255,0.05), 0 0 14px rgba(0,220,255,0.06);
}

@keyframes orbitAround {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

@keyframes stethoFaceCenter {
  from { transform: translate(-50%, -50%) translateY(-54px) rotate(180deg); }
  to   { transform: translate(-50%, -50%) translateY(-54px) rotate(-180deg); }
}

#startBtn::before {
  content: "";
  position: absolute;
  inset: -6px;
  border-radius: 999px;
  background: radial-gradient(ellipse, rgba(0,220,255,0.22) 0%, rgba(0,220,255,0.08) 60%, transparent 80%);
  z-index: -1;
}

#startBtn:hover {
  transform: translateX(-50%) scale(1.05);
  filter: brightness(1.08);
  box-shadow: 0 0 18px rgba(0,240,255,0.75), 0 0 36px rgba(0,240,255,0.45), 0 12px 28px rgba(0,0,0,0.5);
}

#startBtn:active {
  transform: translateX(-50%) scale(0.97);
}

@keyframes cosmicLaunch {
  0%, 100% {
    box-shadow: 0 0 12px rgba(0,220,255,0.5), 0 0 28px rgba(0,220,255,0.3), 0 10px 24px rgba(0,0,0,0.45);
  }
  50% {
    box-shadow: 0 0 24px rgba(120,240,255,0.9), 0 0 42px rgba(0,220,255,0.45), 0 10px 24px rgba(0,0,0,0.45);
  }
}

#startBtn.hidden { display: none; }

/* ===== お祝いオーバーレイ ===== */
#celebrationOverlay {
  display: none;
  position: absolute;
  inset: 0;
  z-index: 100;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 40%, #0d0030 0%, #000818 60%, #000005 100%);
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#celebrationOverlay.active { display: flex; }

#celebBgCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#journeyReplay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  opacity: 0;
  animation: journeyFadeOut 1.0s ease 2.8s forwards;
}
@keyframes journeyFadeOut {
  0%   { opacity:1; }
  100% { opacity:0; }
}
#journeyTrail {
  display: flex;
  align-items: center;
  gap: 0;
  position: absolute;
  white-space: nowrap;
  animation: journeySweep 2.6s cubic-bezier(0.25,0.1,0.25,1) forwards;
}
@keyframes journeySweep {
  0%   { transform: translateX(420px); opacity:0; }
  12%  { opacity:1; }
  80%  { opacity:1; }
  100% { transform: translateX(-420px); opacity:0; }
}
.journey-planet { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; image-rendering: high-quality; }
.journey-saturn { width: 46px; height: 28px; border-radius: 0; flex-shrink: 0; }
.journey-line   { width: 18px; height: 2px; flex-shrink: 0; opacity: 0.5; }
.journey-rocket { font-size: 18px; margin: 0 6px; display: inline-block; animation: rocketBob 0.5s ease-in-out infinite alternate; }
@keyframes rocketBob {
  from { transform: translateY(-2px); }
  to   { transform: translateY(2px); }
}

#arrivalFlash {
  position: absolute;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
  animation: flashBurst 0.5s ease-out 2.8s forwards;
}
@keyframes flashBurst {
  0%   { opacity: 0.9; }
  100% { opacity: 0; }
}

#mergeArea {
  position: relative;
  width: 220px;
  height: 220px;
  flex-shrink: 0;
  opacity: 0;
  animation: mergeAreaAppear 0.8s ease 0.2s forwards;
}
@keyframes mergeAreaAppear {
  from { opacity:0; }
  to   { opacity:1; }
}

.glow-ring {
  position: absolute;
  left: 50%; top: 50%;
  border-radius: 50%;
  transform: translate(-50%,-50%);
  border: 1.5px solid;
  pointer-events: none;
  opacity: 0;
}
#ring1 { width: 130px; height: 130px; border-color: rgba(255,200,100,0.6); animation: ringPulse 2.0s ease-out 3.8s infinite; }
#ring2 { width: 160px; height: 160px; border-color: rgba(255,120,180,0.4); animation: ringPulse 2.0s ease-out 4.05s infinite; }
#ring3 { width: 195px; height: 195px; border-color: rgba(120,180,255,0.25); animation: ringPulse 2.0s ease-out 4.3s infinite; }
@keyframes ringPulse {
  0%   { transform: translate(-50%,-50%) scale(0.9); opacity:0.8; }
  60%  { opacity:0.5; }
  100% { transform: translate(-50%,-50%) scale(1.25); opacity:0; }
}

#celebHeart {
  position: absolute;
  left: 50%; top: 50%;
  width: 120px;
  height: 120px;
  transform: translate(-50%, -50%) scale(0);
  opacity: 0;
  animation: heartGrandEntrance 1.1s cubic-bezier(0.34,1.56,0.64,1) 3.0s forwards;
  filter:
    drop-shadow(0 0 22px rgba(255,100,160,1))
    drop-shadow(0 0 50px rgba(255,60,120,0.7))
    drop-shadow(0 0 80px rgba(200,40,100,0.4));
}
@keyframes heartGrandEntrance {
  0%   { transform: translate(-50%,-50%) scale(0) rotate(-15deg); opacity:0; }
  50%  { transform: translate(-50%,-50%) scale(1.25) rotate(5deg);  opacity:1; }
  70%  { transform: translate(-50%,-50%) scale(0.92) rotate(-2deg); opacity:1; }
  85%  { transform: translate(-50%,-50%) scale(1.08) rotate(1deg);  opacity:1; }
  100% { transform: translate(-50%,-50%) scale(1.0)  rotate(0deg);  opacity:1; }
}

#celebStetho {
  position: absolute;
  left: 50%; top: 50%;
  width: 130px;
  height: auto;
  transform-origin: center center;
  animation:
    stethoOrbit  3.0s linear 0s forwards,
    stethoSettle 0.9s cubic-bezier(0.34,1.46,0.64,1) 3.0s forwards;
  opacity: 1;
  filter:
    drop-shadow(0 0 5px rgba(255,255,255,1))
    drop-shadow(0 0 14px rgba(200,230,255,0.8))
    drop-shadow(0 0 28px rgba(150,190,255,0.5));
}
@keyframes stethoOrbit {
  0%   { transform:translate(-50%,-50%) translateY(-82px) rotate(0deg)   scale(1.0); opacity:1; }
  25%  { transform:translate(-50%,-50%) translateY(-82px) rotate(90deg)  scale(1.0); opacity:1; }
  50%  { transform:translate(-50%,-50%) translateY(-82px) rotate(180deg) scale(1.0); opacity:1; }
  75%  { transform:translate(-50%,-50%) translateY(-82px) rotate(270deg) scale(1.0); opacity:1; }
  100% { transform:translate(-50%,-50%) translateY(-82px) rotate(360deg) scale(1.0); opacity:1; }
}
@keyframes stethoSettle {
  0%   { transform:translate(-50%,-50%) translateY(-82px) rotate(360deg) scale(1.0); opacity:1; }
  60%  { transform:translate(-50%,-50%) translate(52px, 42px) rotate(390deg) scale(1.1); opacity:1; }
  100% { transform:translate(-50%,-50%) translate(48px, 40px) rotate(385deg) scale(1.0); opacity:1; }
}

#mergeFlash {
  position: absolute; left: 50%; top: 50%;
  width: 0; height: 0; border-radius: 50%;
  transform: translate(-50%,-50%);
  background: transparent;
  border: 6px solid rgba(255,240,120,0);
  animation: mergeFlashAnim 0.7s ease-out 3.7s forwards;
  pointer-events: none;
}
@keyframes mergeFlashAnim {
  0%   { width:0;     height:0;     border-color:rgba(255,240,120,1);   border-width:8px; }
  100% { width:260px; height:260px; border-color:rgba(255,240,120,0);   border-width:1px; }
}
#mergeFlash2 {
  position: absolute; left: 50%; top: 50%;
  width: 0; height: 0; border-radius: 50%;
  transform: translate(-50%,-50%);
  background: transparent;
  border: 4px solid rgba(255,160,220,0);
  animation: mergeFlashAnim2 0.9s ease-out 3.85s forwards;
  pointer-events: none;
}
@keyframes mergeFlashAnim2 {
  0%   { width:0;     height:0;     border-color:rgba(255,160,220,0.9); border-width:5px; }
  100% { width:300px; height:300px; border-color:rgba(255,160,220,0);   border-width:1px; }
}

#celebTitle {
  margin-top: 14px;
  font-size: 20px; font-weight: 900; color: #fff;
  text-align: center; letter-spacing: 3px; line-height: 1.3;
  text-shadow: 0 0 16px rgba(255,220,80,1), 0 0 36px rgba(255,160,40,0.8), 0 0 60px rgba(255,80,20,0.4);
  animation: titleBlast 0.8s cubic-bezier(0.34,1.56,0.64,1) 4.0s both;
}
@keyframes titleBlast {
  from { opacity:0; transform: scale(0.6) translateY(20px); letter-spacing:8px; }
  to   { opacity:1; transform: scale(1)   translateY(0);    letter-spacing:3px; }
}

#celebSub {
  margin-top: 8px;
  font-size: 12px; color: rgba(200,230,255,0.95);
  text-align: center; letter-spacing: 1px; line-height: 1.7;
  animation: fadeSlideUp 0.7s ease 4.5s both;
}

#celebClose {
  margin-top: 18px; padding: 11px 36px;
  font-size: 14px; font-weight: 800; color: #fff;
  background: linear-gradient(135deg, #ff5599 0%, #cc2277 50%, #880055 100%);
  border: 1px solid rgba(255,180,220,0.5); border-radius: 999px;
  cursor: pointer; letter-spacing: 1.5px;
  box-shadow: 0 0 18px rgba(255,80,150,0.7), 0 0 40px rgba(255,40,120,0.35), 0 4px 16px rgba(0,0,0,0.5);
  animation: fadeSlideUp 0.7s ease 4.8s both;
  transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
}
#celebClose:hover {
  transform: scale(1.06); filter: brightness(1.15);
  box-shadow: 0 0 28px rgba(255,120,180,0.9), 0 0 55px rgba(255,60,140,0.5);
}

@keyframes fadeSlideUp {
  from { opacity:0; transform: translateY(14px); }
  to   { opacity:1; transform: translateY(0); }
}

.confetti {
  position: absolute; border-radius: 2px;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  0%   { transform: translateY(-20px) rotate(0deg) scaleX(1);    opacity:1; }
  50%  { transform: translateY(260px) rotate(360deg) scaleX(0.6); opacity:0.9; }
  100% { transform: translateY(540px) rotate(720deg) scaleX(1);   opacity:0; }
}

.sparkle {
  position: absolute; pointer-events: none;
  animation: sparklePop linear forwards;
  font-size: 16px; line-height: 1;
}
@keyframes sparklePop {
  0%   { transform: scale(0) rotate(0deg);    opacity:1; }
  40%  { transform: scale(1.4) rotate(90deg); opacity:1; }
  100% { transform: scale(0) rotate(180deg);  opacity:0; }
}

</style>
<div id="rw">
<div id="rwrap">
<canvas id="rc"></canvas>
<div id="heartPlanetWrap">
  <img id="heartPlanet" src="goal.png" alt="goal">

  <div id="orbitPath">
    <img id="orbitStethoscope" src="stethoscope.png" alt="stethoscope">
  </div>
</div>
<button id="startBtn">START MISSION</button>

<!-- お祝いオーバーレイ -->
<div id="celebrationOverlay">
  <canvas id="celebBgCanvas"></canvas>

  <!-- フェーズ1：旅の回想ベルト -->
  <div id="journeyReplay">
    <div id="journeyTrail"></div>
  </div>

  <!-- 到着フラッシュ -->
  <div id="arrivalFlash"></div>

  <!-- フェーズ2：中央ゴール演出 -->
  <div id="mergeArea">
    <div class="glow-ring" id="ring1"></div>
    <div class="glow-ring" id="ring2"></div>
    <div class="glow-ring" id="ring3"></div>
    <img id="celebHeart" src="goal.png" alt="心臓星">
    <img id="celebStetho" src="stethoscope.png" alt="聴診器">
    <div id="mergeFlash"></div>
    <div id="mergeFlash2"></div>
  </div>

  <div id="celebTitle">🌟 心臓星 到達！ 🌟<br><span style="font-size:13px;letter-spacing:1px;font-weight:700;opacity:0.85">全ミッション完全制覇</span></div>
  <div id="celebSub">地球から遥かな航路を越えて——<br>あなたは心音のエキスパートだ！</div>
  <button id="celebClose">もう一度プレイ</button>
</div>

<script>
const cv=document.getElementById('rc');
const ctx=cv.getContext('2d');
const W=320,H=520;

// デバイスピクセル比（Retina/iPad対応）
const DPR = Math.min(window.devicePixelRatio || 1, 3);

// canvasの物理解像度をDPRに合わせてスケールアップ
cv.width  = W * DPR;
cv.height = H * DPR;
ctx.scale(DPR, DPR); // 以降の描画はすべて論理座標(W×H)で行う

// レスポンシブ：スマホ縦画面にフィット、PCでは中央に縦長表示
function resizeCanvas(){
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const scale = Math.min(vw / W, vh / H);
  const dw = Math.round(W * scale);
  const dh = Math.round(H * scale);
  cv.style.width  = dw + 'px';
  cv.style.height = dh + 'px';
  const rwrap = document.getElementById('rwrap');
  rwrap.style.width  = dw + 'px';
  rwrap.style.height = dh + 'px';
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ボタン管理
const startBtn=document.getElementById('startBtn');
function updateBtn(){
  if(state==='start'){
    startBtn.textContent='スタート！';
    startBtn.classList.remove('hidden');
  }
  else{
    // nothing extra
  }

  if(state==='over'){
    startBtn.textContent='再挑戦する';
    startBtn.classList.remove('hidden');
  }
  else if(state==='stage_clear'){
    const nextIdx=stageIdx+1;
    const nextLabel=STAGES[nextIdx]?STAGES[nextIdx].label.split('：')[0]:'';
    startBtn.textContent=(nextLabel?nextLabel:'次のミッション')+'へ出発！';
    startBtn.classList.remove('hidden');
  }
  else if(state==='all_clear'){
    // お祝いオーバーレイ側で「もう一度プレイ」を提供するため、ここではボタンを表示しない
    startBtn.classList.add('hidden');
  }
  else if(state!=='start'){
    startBtn.classList.add('hidden');
  }
}

// --- 画像ロード ---
const rocketImg    = new Image(); rocketImg.src = 'rocket.png';
const moonImg      = new Image(); moonImg.src   = 'moon.png';
const earthImg     = new Image(); earthImg.src  = 'earth.png';
const marsImg      = new Image(); marsImg.src   = 'mars.png';
const jupiterImg   = new Image(); jupiterImg.src = 'jupiter.png';
const saturnImg    = new Image(); saturnImg.src  = 'saturn.png';
const uranusImg    = new Image(); uranusImg.src  = 'uranus.png';
const neptuneImg   = new Image(); neptuneImg.src = 'neptune.png';
const goalImg      = new Image(); goalImg.src    = 'goal.png';
const meteoriteImg = new Image(); meteoriteImg.src = 'meteorite.png';
const heartImg     = new Image(); heartImg.src = 'heart.png';
const ufoImg       = new Image(); ufoImg.src   = 'ufo.png';
const astronautImg = new Image(); astronautImg.src = 'astronaut.png';
const blackholeImg = new Image(); blackholeImg.src = 'blackhole.png';

// 円形に切り抜いたオフスクリーンCanvas（通常惑星用）
function makeRoundImg(img, diameter) {
  const oc = document.createElement('canvas');
  oc.width = oc.height = diameter;
  const c = oc.getContext('2d');
  c.imageSmoothingEnabled = true; 
  c.imageSmoothingQuality = 'high';
  c.beginPath(); 
  c.arc(diameter / 2, diameter / 2, diameter / 2, 0, Math.PI * 2); 
  c.clip();
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const sq = Math.min(iw, ih);
  c.drawImage(img, (iw - sq) / 2, (ih - sq) / 2, sq, sq, 0, 0, diameter, diameter);
  return oc;
}

// 土星専用：リングを含む横長画像をそのままキャッシュ（クリップなし）
// isSaturnLike=true の惑星は drawPlanet で特別扱い
function makeSaturnImg(img, diameter) {
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const aspect = iw / Math.max(ih, 1);
  // リングを含む横幅に合わせてキャンバスを横長に確保
  const cw = Math.round(diameter * Math.max(aspect, 1.8));
  const ch = Math.round(cw / aspect);
  const oc = document.createElement('canvas');
  oc.width = cw; oc.height = ch;
  oc._isSaturn = true; // 特別フラグ
  oc._planetR = diameter / 2; // 惑星本体の半径（リング除く）
  const c = oc.getContext('2d');
  c.imageSmoothingEnabled = true;
  c.imageSmoothingQuality = 'high';
  c.drawImage(img, 0, 0, cw, ch);
  return oc;
}

// 各惑星のCanvasを管理する変数
let earthCanvas=null, moonCanvas=null, marsCanvas=null, jupiterCanvas=null, 
    saturnCanvas=null, uranusCanvas=null, neptuneCanvas=null, goalCanvas=null;

// HUD専用の高解像度アイコンキャッシュ（直径80px：DPR=3でも十分な品質）
const HUD_ICON_D = 80;
let hudEarthCanvas=null, hudMoonCanvas=null, hudMarsCanvas=null, hudJupiterCanvas=null,
    hudSaturnCanvas=null, hudUranusCanvas=null, hudNeptuneCanvas=null, hudGoalCanvas=null;

// 画像が読み込まれたらCanvasを生成
earthImg.onload   = () => { earthCanvas   = makeRoundImg(earthImg, 400);   hudEarthCanvas   = makeRoundImg(earthImg, HUD_ICON_D); };
moonImg.onload    = () => { moonCanvas    = makeRoundImg(moonImg, 400);     hudMoonCanvas    = makeRoundImg(moonImg, HUD_ICON_D); };
marsImg.onload    = () => { marsCanvas    = makeRoundImg(marsImg, 400);     hudMarsCanvas    = makeRoundImg(marsImg, HUD_ICON_D); };
jupiterImg.onload = () => { jupiterCanvas = makeRoundImg(jupiterImg, 400);  hudJupiterCanvas = makeRoundImg(jupiterImg, HUD_ICON_D); };
saturnImg.onload  = () => { saturnCanvas  = makeSaturnImg(saturnImg, 400);  hudSaturnCanvas  = makeSaturnImg(saturnImg, HUD_ICON_D); };
uranusImg.onload  = () => { uranusCanvas  = makeRoundImg(uranusImg, 400);   hudUranusCanvas  = makeRoundImg(uranusImg, HUD_ICON_D); };
neptuneImg.onload = () => { neptuneCanvas = makeRoundImg(neptuneImg, 400);  hudNeptuneCanvas = makeRoundImg(neptuneImg, HUD_ICON_D); };
goalImg.onload    = () => { goalCanvas    = makeRoundImg(goalImg, 400);     hudGoalCanvas    = makeRoundImg(goalImg, HUD_ICON_D); };

// すでにキャッシュ済みで onload が発火しない場合の保険

// ===== iOS Audio アンロック =====
// iOSではユーザー操作のタイミングでAudioContextをresumeしないと音が出ない
let _audioUnlocked = false;
function unlockAudio() {
  // iOSではユーザー操作のたびにresumeが必要なので、フラグで止めない
  const ac = getAC();
  if (ac.state === 'suspended') {
    ac.resume().catch(() => {});
  }
  if (_audioUnlocked) return;
  _audioUnlocked = true;
  // iOS Safari用：無音バッファを1度再生してAudioContextをアクティブ化
  try {
    const buf = ac.createBuffer(1, 1, 22050);
    const src = ac.createBufferSource();
    src.buffer = buf;
    src.connect(ac.destination);
    src.start(0);
  } catch(e) {}
  // HTMLAudioの再生制限を解除するため、無音Audioを再生
  const silentAudio = new Audio();
  silentAudio.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';
  silentAudio.volume = 0;
  silentAudio.play().catch(() => {});
  // 心音BGMが止まっていたら再開
  if (currentBgmFile) {
    if (_isIOS && !_bgmSourceNode) {
      _playBgmWebAudio(currentBgmFile);
    } else if (!_isIOS && currentBgm && currentBgm.paused) {
      currentBgm.play().catch(() => {});
    }
  }
}

// ===== BGM / 心音管理（HTMLAudio主体 + WebAudio iOS フォールバック）=====
let currentBgm = null;          // 再生中の HTMLAudioElement（Android/PC）
let currentBgmFile = null;      // 再生中のファイル名
let heartSoundAudio = null;     // 後方互換ダミー

// Web Audio API経由のBGM（iOS Safari 用フォールバック）
let _bgmSourceNode = null;
let _bgmGainNode   = null;
let _bgmBufferCache = {};

// iOSかどうかを判定
const _isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

// ステージ番号(1-7)に対応するmissionのブロックをランダム取得
function getBlockForStage(stageId) {
  let pool;
  if (stageId === 7) {
    pool = BLOCK_TYPES.filter(b => b.mission >= 1 && b.mission <= 6);
  } else {
    pool = BLOCK_TYPES.filter(b => b.mission === stageId);
  }
  if (pool.length === 0) return BLOCK_TYPES[0];
  return pool[Math.floor(Math.random() * pool.length)];
}

// ── iOS用: Web Audio API でBGMを再生 ──
function _playBgmWebAudio(soundFile) {
  // 既に同じファイルが再生中なら何もしない
  if (currentBgmFile === soundFile && _bgmSourceNode) return;
  _stopBgmWebAudio();
  currentBgmFile = soundFile;

  const ac = getAC();
  const doLoad = () => {
    if (_bgmBufferCache[soundFile]) {
      _startBgmNode(_bgmBufferCache[soundFile], soundFile);
      return;
    }
    fetch('sound/' + soundFile)
      .then(r => r.arrayBuffer())
      .then(ab => {
        // decodeAudioData: コールバック形式とPromise形式の両方に対応
        const onSuccess = (buf) => {
          _bgmBufferCache[soundFile] = buf;
          _startBgmNode(buf, soundFile);
        };
        const result = ac.decodeAudioData(ab, onSuccess, () => {});
        // Promise形式もサポートする環境ではthenを使う
        if (result && typeof result.then === 'function') {
          result.then(onSuccess).catch(() => {});
        }
      })
      .catch(() => {});
  };

  if (ac.state === 'suspended') {
    ac.resume().then(doLoad).catch(doLoad);
  } else {
    doLoad();
  }
}

function _startBgmNode(buf, soundFile) {
  if (currentBgmFile !== soundFile) return; // 途中でstop済み
  _stopBgmWebAudio();
  const ac = getAC();
  _bgmGainNode = ac.createGain();
  _bgmGainNode.gain.value = 0.55;
  _bgmGainNode.connect(ac.destination);
  _bgmSourceNode = ac.createBufferSource();
  _bgmSourceNode.buffer = buf;
  _bgmSourceNode.loop = true;
  _bgmSourceNode.connect(_bgmGainNode);
  _bgmSourceNode.start(0);
}

function _stopBgmWebAudio() {
  if (_bgmSourceNode) {
    try { _bgmSourceNode.stop(); } catch(e) {}
    try { _bgmSourceNode.disconnect(); } catch(e) {}
    _bgmSourceNode = null;
  }
  if (_bgmGainNode) {
    try { _bgmGainNode.disconnect(); } catch(e) {}
    _bgmGainNode = null;
  }
}

// ── メイン: BGM再生（Android/PCはHTMLAudio、iOSはWebAudio）──
function playBgm(soundFile) {
  if (_isIOS) {
    _playBgmWebAudio(soundFile);
    return;
  }
  // Android / PC: HTMLAudio
  if (currentBgmFile === soundFile && currentBgm && !currentBgm.paused) return;
  stopBgm();
  currentBgmFile = soundFile;
  currentBgm = new Audio('sound/' + soundFile);
  currentBgm.loop = true;
  currentBgm.volume = 0.55;
  const ac = getAC();
  const doPlay = () => currentBgm.play().catch(() => {});
  if (ac.state === 'suspended') {
    ac.resume().then(doPlay).catch(doPlay);
  } else {
    doPlay();
  }
}

function stopBgm() {
  // HTMLAudio停止
  if (currentBgm) {
    currentBgm.pause();
    currentBgm.currentTime = 0;
    currentBgm = null;
  }
  // WebAudio停止
  _stopBgmWebAudio();
  currentBgmFile = null;
}

// ===== Web Audio SE =====
let _audioCtx = null;
function getAC() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (_audioCtx.state === 'suspended') _audioCtx.resume();
  return _audioCtx;
}

// 出発：ロケット噴射音（低周波ノイズ＋轟音ロール）
let _launchSoundNode = null;
function playLaunchSound() {
  stopLaunchSound();
  try {
    const ac = getAC();
    const gain = ac.createGain();
    gain.gain.setValueAtTime(0, ac.currentTime);
    gain.gain.linearRampToValueAtTime(0.04, ac.currentTime + 0.4);
    gain.gain.setValueAtTime(0.04, ac.currentTime + 3.5);
    gain.gain.linearRampToValueAtTime(0, ac.currentTime + 5.0);
    gain.connect(ac.destination);
    const bufLen = ac.sampleRate * 5.5;
    const buf = ac.createBuffer(1, bufLen, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufLen; i++) data[i] = Math.random() * 2 - 1;
    const noise = ac.createBufferSource();
    noise.buffer = buf;
    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(220, ac.currentTime);
    lp.frequency.linearRampToValueAtTime(480, ac.currentTime + 5.0);
    lp.Q.value = 1.5;
    noise.connect(lp); lp.connect(gain);
    noise.start();
    _launchSoundNode = { noise, gain };
    const osc = ac.createOscillator();
    const og = ac.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(55, ac.currentTime);
    osc.frequency.linearRampToValueAtTime(90, ac.currentTime + 4.0);
    og.gain.setValueAtTime(0, ac.currentTime);
    og.gain.linearRampToValueAtTime(0.015, ac.currentTime + 0.6);
    og.gain.linearRampToValueAtTime(0, ac.currentTime + 5.0);
    osc.connect(og); og.connect(ac.destination);
    osc.start(); osc.stop(ac.currentTime + 5.5);
  } catch(e) {}
}
function stopLaunchSound() {
  try {
    if (_launchSoundNode) { _launchSoundNode.noise.stop(); _launchSoundNode = null; }
  } catch(e) { _launchSoundNode = null; }
}

// 到着：空気を切り裂くホイッスル降下＋衝撃ドン
function playArriveSound() {
  try {
    const ac = getAC();

    // やさしい下降音
    const osc = ac.createOscillator();
    const og = ac.createGain();

    osc.type = 'triangle'; // 柔らかい音
    osc.frequency.setValueAtTime(1200, ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(300, ac.currentTime + 1.2);

    og.gain.setValueAtTime(0.015, ac.currentTime);
    og.gain.linearRampToValueAtTime(0, ac.currentTime + 1.4);

    osc.connect(og);
    og.connect(ac.destination);

    osc.start();
    osc.stop(ac.currentTime + 1.5);

    // 軽い空気感だけ残すノイズ
    const bufLen = ac.sampleRate * 1.2;
    const buf = ac.createBuffer(1, bufLen, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < bufLen; i++) d[i] = Math.random() * 2 - 1;

    const ns = ac.createBufferSource();
    ns.buffer = buf;

    const hp = ac.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 1500;

    const ng = ac.createGain();
    ng.gain.setValueAtTime(0.006, ac.currentTime);
    ng.gain.linearRampToValueAtTime(0, ac.currentTime + 1.2);

    ns.connect(hp);
    hp.connect(ng);
    ng.connect(ac.destination);

    ns.start();

  } catch(e) {}
}

// ===== UFO ループ音管理 =====
let _ufoLoopNodes = null;

function startUfoLoopSound() {
  if (_ufoLoopNodes) return; // 既に再生中
  try {
    const ac = getAC();
    const now = ac.currentTime;
    const masterGain = ac.createGain();
    masterGain.gain.setValueAtTime(0, now);
    masterGain.gain.linearRampToValueAtTime(0.03, now + 0.4);
    masterGain.connect(ac.destination);

    const lfo = ac.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 5.5;
    const lfoGain = ac.createGain();
    lfoGain.gain.value = 18;

    const osc1 = ac.createOscillator();
    osc1.type = 'sine';
    osc1.frequency.value = 420;
    lfo.connect(lfoGain);
    lfoGain.connect(osc1.frequency);
    osc1.connect(masterGain);

    const osc2 = ac.createOscillator();
    osc2.type = 'triangle';
    osc2.frequency.value = 840;
    const g2 = ac.createGain();
    g2.gain.value = 0.25;
    osc2.connect(g2); g2.connect(masterGain);

    lfo.start(); osc1.start(); osc2.start();
    _ufoLoopNodes = { osc1, osc2, lfo, lfoGain, g2, masterGain };
  } catch(e) {}
}

function stopUfoLoopSound() {
  if (!_ufoLoopNodes) return;
  try {
    const ac = getAC();
    const g = _ufoLoopNodes.masterGain;
    g.gain.setValueAtTime(g.gain.value, ac.currentTime);
    g.gain.linearRampToValueAtTime(0.001, ac.currentTime + 0.3);
    const nodes = _ufoLoopNodes;
    setTimeout(() => {
      try { nodes.lfo.stop(); nodes.osc1.stop(); nodes.osc2.stop(); } catch(e) {}
    }, 400);
  } catch(e) {}
  _ufoLoopNodes = null;
}

    lp.type = 'lowpass'; lp.frequency.value = 180;
    const g2 = ac.createGain();
    g2.gain.value = 0.35;
    osc2.connect(lp); lp.connect(g2); g2.connect(masterGain);

    lfo.start(); osc1.start(); osc2.start();
    _bhLoopNodes = { osc1, osc2, lfo, masterGain };
  } catch(e) {}
}

function stopBlackholeLoopSound() {
  if (!_bhLoopNodes) return;
  try {
    const ac = getAC();
    const g = _bhLoopNodes.masterGain;
    g.gain.setValueAtTime(g.gain.value, ac.currentTime);
    g.gain.linearRampToValueAtTime(0.001, ac.currentTime + 0.8);
    const nodes = _bhLoopNodes;
    setTimeout(() => {
      try { nodes.lfo.stop(); nodes.osc1.stop(); nodes.osc2.stop(); } catch(e) {}
    }, 900);
  } catch(e) {}
  _bhLoopNodes = null;
}

function drawPlanet(cx,cy,r,alpha,canvas,fallback){
  ctx.save();

      // 土星：横長画像をアスペクト比を保ったまま描画（クリップなし）
      const aspect = canvas.width / Math.max(canvas.height,1);

    ctx.fillStyle=fallback; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

// ブラックホール描画
function drawBlackhole(bh) {
  bh.rot = (bh.rot || 0) + bh.rotV;
  const r = bh.r;
  const t = bh.rot * 8;
  const cx = bh.x, cy = bh.y;
  const no = bh.noiseOff || 0;

  ctx.save();

  // 1. 引力歪みライン（光の筋）
  const WLINES = 24;
  for(let i = 0; i < WLINES; i++){
    const ang = (i / WLINES) * Math.PI * 2 + t * 0.15 + no * 0.01;
    const wobble = 0.04 * Math.sin(i * 1.9 + t * 3.5 + no);
    const a = ang + wobble;
    const r0 = r * (0.55 + 0.08 * Math.sin(i * 2.1 + t * 4.0));
    const r1 = r * (1.8  + 0.4  * Math.abs(Math.sin(i * 1.3 + t * 1.8 + no)));
    const ax = cx + Math.cos(a) * r0, ay = cy + Math.sin(a) * r0;
    const bx = cx + Math.cos(a) * r1, by = cy + Math.sin(a) * r1;
    const br = 0.04 + 0.07 * Math.abs(Math.sin(i * 2.3 + t * 5.5 + no));
    const wg = ctx.createLinearGradient(ax, ay, bx, by);
    wg.addColorStop(0,   `rgba(160,180,255,${br})`);
    wg.addColorStop(0.4, `rgba(100,130,220,${br*0.4})`);
    wg.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.strokeStyle = wg;
    ctx.lineWidth = 0.4 + 0.5 * Math.abs(Math.sin(i * 0.7 + t));
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
  }

  // 2. blackhole.png 描画
  if(blackholeImg.complete && blackholeImg.naturalWidth > 0){
    // ── まず中央に「真っ黒な下地」を作る ──
    ctx.fillStyle = '#000';
    ctx.beginPath();
    // 画像の中央の黒い部分に合わせて少し小さめの円を描く
    ctx.arc(cx, cy, r * 0.7, 0, Math.PI * 2);
    ctx.fill();

    // ── その上に画像をスクリーン合成で重ねる ──
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(bh.rot);
    
    // スクリーン合成にすることで、画像の黒いリム（外枠）だけが消える
    ctx.globalCompositeOperation = 'screen';
    
    const drawR = r * 2.4; 
    ctx.drawImage(blackholeImg, -drawR, -drawR, drawR * 2, drawR * 2);
    ctx.restore();
  } else {
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  }

  ctx.restore();
}

      if(astronautImg.complete && astronautImg.naturalWidth > 0){
        ctx.drawImage(astronautImg, -28, -28, 56, 56);
      } else {
        ctx.fillStyle = '#f0faff';
        ctx.beginPath(); ctx.arc(0, -8, 10, 0, Math.PI*2); ctx.fill();
        ctx.fillRect(-8, -2, 16, 18);
      }
    }
    ctx.restore();
  }
}

function updateBlackholes(dt){
  // ブラックホールはミッション５から出現、同時に1つまで、1ミッションで複数回OK
  const bhAliveNow = blackholes.some(bh => bh.alive);
  if(!bhAliveNow && state === 'playing' && st().id >= 5){
    // ミッションが進むほど出現頻度を上げる（id5→長い, id7→短い）
    const stageId = st().id; // 5〜7
    blackholeSpawnTimer -= dt;
    if(blackholeSpawnTimer <= 0){
      spawnBlackhole();
      // 次の出現までの待機時間：ステージが進むほど短く
      const baseMin = Math.max(20, 35 - (stageId - 5) * 7);  // 5→35, 6→28, 7→21
      const baseRng = Math.max(10, 20 - (stageId - 5) * 4);  // 5→20, 6→16, 7→12
      blackholeSpawnTimer = baseMin + Math.random() * baseRng;
    }
  }
  
  for(const bh of blackholes){
    if(!bh.alive) continue;
    bh.rot += bh.rotV;
    bh.phaseTimer += dt;

    if(bh.phase === 'grow'){
      const t = Math.min(1, bh.phaseTimer / bh.growDur);
      bh.r = bh.maxR * (t * t);
      if(bh.phaseTimer >= bh.growDur){
        bh.phase = 'wander';
        bh.phaseTimer = 0;
        bh.r = bh.maxR;
      }
    } else if(bh.phase === 'wander'){
      bh.wanderTimer += dt;
      if(bh.wanderTimer > 3.0 + Math.random()*2.0){
        bh.wanderVX = (Math.random()-0.5)*0.5;
        bh.wanderVY = (Math.random()-0.5)*0.3;
        bh.wanderTimer = 0;
      }
      bh.x += bh.wanderVX;
      bh.y += bh.wanderVY;
      
      // 移動制限範囲もロケットのレベル（画面下半分）に合わせて調整
      if(bh.x < bh.r*1.5){ bh.x = bh.r*1.5; bh.wanderVX = Math.abs(bh.wanderVX); }
      if(bh.x > W-bh.r*1.5){ bh.x = W-bh.r*1.5; bh.wanderVX = -Math.abs(bh.wanderVX); }
      // 上限を H*0.5、下限を H*0.85 (ロケット付近) に設定
      if(bh.y < H*0.50){ bh.y = H*0.50; bh.wanderVY = Math.abs(bh.wanderVY); }
      if(bh.y > H*0.85){ bh.y = H*0.85; bh.wanderVY = -Math.abs(bh.wanderVY); }

      if(bh.phaseTimer >= bh.wanderDur){
        bh.phase = 'shrink';
        bh.phaseTimer = 0;
      }
    } else if(bh.phase === 'shrink'){
      const t = Math.min(1, bh.phaseTimer / bh.shrinkDur);
      bh.r = bh.maxR * (1 - t * t);
      if(bh.r < 1){ bh.alive = false; }
    }
  }

  // 吸込みアニメ更新（螺旋軌道でくるくる吸い込まれる）
  for(const s of suckingObjects){
    const dx = s.bhX - s.x, dy = s.bhY - s.y;
    const dist = Math.sqrt(dx*dx+dy*dy) || 1;
    // 中心方向の引力
    const pullSpd = (1 - s.scale) * 12 + 3;
    // 接線方向の回転力（螺旋を作る）
    const perpX = -dy / dist, perpY = dx / dist;
    const swirlSpd = pullSpd * 1.4;
    s.x += dx/dist * pullSpd + perpX * swirlSpd;
    s.y += dy/dist * pullSpd + perpY * swirlSpd;
    // 近づくほど高速回転
    s.rot += 0.18 + (1 - s.scale) * 0.55;
    s.scale = Math.max(0, s.scale - dt * 1.0);
    s.alpha = Math.min(1, s.scale * 1.5);
  }
  suckingObjects = suckingObjects.filter(s => s.scale > 0);

  // ブラックホールが1つ以上生きていて、かつplaying中のみループ音ON
  const bhAlive = blackholes.some(bh => bh.alive);
  if (bhAlive && state === 'playing') {
    startBlackholeLoopSound();
  } else {
    stopBlackholeLoopSound();
  }
}

function checkBlackholeCollisions(dt){
  for(const bh of blackholes){
    if(!bh.alive) continue;
    const pullR2 = bh.pullR * bh.pullR;

    // ── 隕石：螺旋引き込み ──
    for(const d of debris){
      if(!d.alive) continue;
      const dx = bh.x - d.x, dy = bh.y - d.y;
      const dist2 = dx*dx + dy*dy;
      if(dist2 < pullR2){
        const dist = Math.sqrt(dist2) || 1;
        const force = 18 / dist;
        const perpX = -dy/dist, perpY = dx/dist;
        d.vx += (dx/dist * force + perpX * force * 0.5) * 0.65;
        d.vy += (dy/dist * force + perpY * force * 0.5) * 0.65;
        if(dist < bh.r * 1.1){
          d.alive = false;
          suckingObjects.push({
            x:d.x, y:d.y, bhX:bh.x, bhY:bh.y,
            rot:d.rot, origR:d.r, scale:1.0, alpha:1.0, type:'debris'
          });
        }
      }
    }

    // ── 宇宙飛行士：隕石と同様に螺旋吸込み ──
    for(const a of astronauts){
      if(!a.alive || a.mode === 'being_pulled') continue;
      const dx = bh.x - a.x, dy = bh.y - a.y;
      const dist2 = dx*dx + dy*dy;
      if(dist2 < pullR2){
        const dist = Math.sqrt(dist2) || 1;
        const force = 14 / dist;
        const perpX = -dy/dist, perpY = dx/dist;
        a.vx += (dx/dist * force + perpX * force * 0.5) * 0.55;
        a.vy += (dy/dist * force + perpY * force * 0.5) * 0.55;
        if(dist < bh.r * 1.2){
          a.alive = false;
          suckingObjects.push({
            x:a.x, y:a.y, bhX:bh.x, bhY:bh.y,
            rot:a.rot, origR:30, scale:1.0, alpha:1.0, type:'astronaut'
          });
        }
      }
    }

    // ── UFO：引力だけ受けて逃げ切る（吸込みはなし） ──
    for(const u of ufos){
      const dx = bh.x - u.x, dy = bh.y - u.y;
      const dist2 = dx*dx + dy*dy;
      if(dist2 < pullR2){
        const dist = Math.sqrt(dist2) || 1;
        const force = 10 / dist;
        // 引力は受けるが接線方向への逃げ力も加えて振り切る
        const perpX = -dy/dist, perpY = dx/dist;
        u.vx = (u.vx||0) + (dx/dist * force - perpX * force * 0.9) * 0.5;
        u.vy = (u.vy||0) + (dy/dist * force - perpY * force * 0.9) * 0.5;
        // UFOの速度を直接位置に反映（モードに関わらず押し流す）
        u.x += (u.vx||0) * 0.08;
        u.y += (u.vy||0) * 0.08;
        u.vx = (u.vx||0) * 0.85;
        u.vy = (u.vy||0) * 0.85;
        // 近づきすぎたら強制離脱
        if(dist < bh.r * 1.8){
          u.x -= dx/dist * 4;
          u.y -= dy/dist * 4;
          u.mode = 'depart';
        }
      }
    }

    // ── ロケット：引力圏の内外を問わず、BH存在中は常に引力と振動が発生 ──
    if(state === 'playing'){
      const rx = rocketX, ry = H - 90;
      const dx = bh.x - rx, dy = bh.y - ry;
      const dist = Math.max(20, Math.sqrt(dx*dx + dy*dy));
      const dirX = dx / dist; // BH方向（+1=右, -1=左）

      // 成長度（grow中は弱め）
      const growFactor = bh.phase === 'grow'
        ? Math.min(1, bh.phaseTimer / bh.growDur)
        : bh.phase === 'shrink'
          ? Math.max(0, 1 - bh.phaseTimer / bh.shrinkDur)
          : 1.0;

      // 引力：距離に反比例、画面内どこにいても最低限効く
      const pullStrength = Math.min(4.0, 120 / dist) * growFactor;
      // rocketX に直接加算（減衰・キー操作の影響を受けない純粋な引力）
      const pullPx = dirX * pullStrength;

      // 逆噴射（BH方向と逆のキーを押している）で引力を相殺
      const left  = keys['ArrowLeft']  || keys['a'] || keys['A'];
      const right = keys['ArrowRight'] || keys['d'] || keys['D'];
      const thrustingAgainst = (left && dirX > 0) || (right && dirX < 0);
      // 逆噴射中は引力をキャンセル（現在位置を保てる）
      if(!thrustingAgainst){
        rocketX = Math.max(22, Math.min(W - 22, rocketX + pullPx));
      }

      // 振動：引力圏の内外を問わず常に発生（近いほど強い）、マイルドに調整
      const distFactor = Math.min(1, 200 / dist); // 近いほど1に近い
      const shakeMag = growFactor * (1.2 + distFactor * 2.8);
      shakeX = (Math.random() - 0.5) * shakeMag * 2 + dirX * growFactor * 1.2;
      shakeY = (Math.random() - 0.5) * shakeMag;

      // 逆噴射中はエネルギー追加消費
      if(thrustingAgainst){
        energy = Math.max(0, energy - growFactor * 4.0 * dt);
        life = Math.round(energy / ENERGY_MAX * LIFE_MAX);
      }
      // 引力圏内にいるだけで微量消費
      energy = Math.max(0, energy - growFactor * 0.8 * dt);
      life = Math.round(energy / ENERGY_MAX * LIFE_MAX);

      // 本体に接触したら弾き飛ばす
      if(dist < bh.r * 1.1){
        hitFlash = 0.5;
        shakeX = (Math.random()-0.5)*16; shakeY = (Math.random()-0.5)*12;
        setTimeout(()=>{shakeX=0;shakeY=0;},250);
        rocketVX -= dirX * 320;
        rocketVX = Math.max(-300, Math.min(300, rocketVX));
        energy = Math.max(0, energy - ENERGY_BH_COST * 0.5);
        life = Math.round(energy / ENERGY_MAX * LIFE_MAX);
      }
    }
  }
}

let heartSetActive = false;
let heartSetClearTimer = 0;
const HEART_SET_WAIT = 2.5;
let lastMissedAnswer = null;
let heartSpawnCount = 0; // 現ステージでのハート出現回数 // 正解ハートを逃したときの正解ラベル
let hintDismissed = false; // 正解ハート取得時にヒントを非表示にするフラグ
let hudProgress = 0;    // 進捗バー表示用（実際の表示値）
let hudTarget   = 0;    // 進捗バーの目標値（ハート出現ごとに更新）
let playingTime = 0;    // playing状態の経過時間（秒）

function spawnHeartSets(){
  if(heartSetActive) return;
  heartSetActive = true;
  heartSetClearTimer = 0;
  lastMissedAnswer = null; // 次のハート出現でリセット
  hintDismissed = false;   // 次のハート出現でヒントを再表示
  heartSpawnCount++;
  // ハート出現のたびに進捗バーの目標値を更新
  { const maxH = st().heartCount || 6;
    hudTarget = heartSpawnCount / maxH;
  }
  const vy = 0.48 + speed * 0.7;

  // ステージに対応したブロックをランダムに選ぶ
  const stageId = st().id; // 1-7
  currentBlock = getBlockForStage(stageId);

  // BGM再生（新しい心音ファイルで切り替え）
  playBgm(currentBlock.sound);

  // 1セット = 2個（左半分に1個・右半分に1個）
  // どちらか一方がランダムで正解（黄色）
  // labels[0] → 左側, labels[1] → 右側 （ランダムにシャッフル）
  const shuffledLabels = [...currentBlock.labels];
  if (Math.random() < 0.5) shuffledLabels.reverse();
  const correctSide = shuffledLabels.indexOf(currentBlock.correct);
  const sharedY = -20;

  for(let side = 0; side < 2; side++){
    const xMin = side === 0 ? 30  : W/2 + 20;
    const xMax = side === 0 ? W/2 - 20 : W - 30;
    const x = xMin + Math.random() * (xMax - xMin);
    items.push({
      x, y: sharedY,
      vx: (Math.random()-0.5)*0.10, vy,
      origVx:0, origVy:vy,
      bumped:false, bumpT:0, alive:true,
      isHeart:true,
      isCorrect: (side === correctSide),
      label: shuffledLabels[side]
    });
  }
}

function updateHeartSet(dt){
  if(!heartSetActive) return;
  const alive = items.filter(it => it.isHeart && it.alive);
  if(alive.length === 0){
    heartSetActive = false;
    heartSetClearTimer = HEART_SET_WAIT;
    stopBgm(); // 両ハートが消えたらBGM停止
  }
}

// --- 星背景の修正（パララックス効果） ---
function drawStars(){
  const hue = st().bgHue;
  ctx.fillStyle = '#000a1a'; 
  ctx.fillRect(0, 0, W, H);

  // 星雲（ネビュラ）：楕円＋ラジアルグラデーションで自然な雲状に描画
  for(const n of NEBULAS){
    const gy = ((n.y + starScroll * n.speed) % (H + n.ry * 2)) - n.ry;
    ctx.save();
    ctx.translate(n.x, gy);
    ctx.rotate(n.rot);
    const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, n.rx);
    grad.addColorStop(0,   `hsla(${hue}, 70%, 65%, ${n.a})`);
    grad.addColorStop(0.45,`hsla(${hue+30}, 60%, 55%, ${n.a * 0.6})`);
    grad.addColorStop(1,   `hsla(${hue}, 50%, 40%, 0)`);
    ctx.scale(1, n.ry / n.rx);
    ctx.globalAlpha = 1;
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, n.rx, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  for(const s of BG_STARS){
    const layerSpeed = s.r * 0.15;
    const sy = (s.y + starScroll * layerSpeed) % (H + 10);

    ctx.globalAlpha = s.a;
    ctx.fillStyle = s.color;  // 初期化時に固定した色を使用
    ctx.beginPath(); 
    ctx.arc(s.x, sy, s.r, 0, Math.PI * 2); 
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// --- ロケット描画（傾き＋サイド炎） ---
// --- 修正点1: drawRocketAt 内の全角マイナスを半角に変更 ---
function drawRocketAt(cx,cy,showFlame,tilt){
  if(showFlame) drawLaunchFlame(cx,cy);
  ctx.save(); ctx.translate(cx,cy);
  const t=tilt||0;
  if(t) ctx.rotate(t);
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';

  const absTilt=Math.abs(t);
  if(absTilt>0.04){
    const dir=t>0?-1:1; 
    const ft=Date.now()*0.022;
    const fLen=10+absTilt/0.62*22+Math.sin(ft)*3;
    const fW=3+absTilt/0.62*4+Math.sin(ft*1.4)*1.2;
    const alpha=Math.min(1,absTilt/0.08)*0.9;

    ctx.globalAlpha=alpha*0.35;
    ctx.fillStyle=`rgba(255,140,0,0.4)`;
    // ↓ ここが修正箇所：全角の「−」を半角の「-」に変更
    ctx.beginPath(); ctx.ellipse(dir*26,-14+Math.sin(ft)*3,fLen*0.7,fW*1.8,0,0,Math.PI*2); ctx.fill();

    ctx.globalAlpha=alpha*0.9;
    const sg=ctx.createLinearGradient(dir*20,0,dir*(20+fLen),0);
    sg.addColorStop(0,'#ffffff');
    sg.addColorStop(0.25,'#ffee44');
    sg.addColorStop(0.6,'#ff6600');
    sg.addColorStop(1,'rgba(255,0,0,0)');
    ctx.fillStyle=sg;
    // ↓ ここも修正箇所：全角の「−」を半角の「-」に変更
    ctx.beginPath(); ctx.ellipse(dir*(20+fLen*0.45),-14+Math.sin(ft*1.1)*2,fLen*0.55,fW,0,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  }
  // (以下、rocketImgの描画処理などはそのまま)
  if(rocketImg.complete&&rocketImg.naturalWidth>0){
    ctx.drawImage(rocketImg,-29,-61,58,95);
  }else{
    ctx.fillStyle='#dde8f0'; ctx.fillRect(-13,-36,26,56);
    ctx.fillStyle='#ff4444'; ctx.beginPath(); ctx.moveTo(0,-62); ctx.lineTo(-12,-34); ctx.lineTo(12,-34); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#88ccff'; ctx.beginPath(); ctx.arc(0,-20,8,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

// --- パーティクル描画 ---
function drawParticles(){
  for(const p of particles){
    ctx.save();
    // 隕石破片の描画（境界を少しボヤけさせる）
    if(p.type==='meteor_debris'){
      ctx.globalAlpha = p.life; // 生存時間に合わせて透明にする
      const gr = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 1.5);
      gr.addColorStop(0, p.color); // 中心は隕石の色
      gr.addColorStop(1, 'rgba(0,0,0,0)'); // 外側は透明
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 1.5 * p.life, 0, Math.PI * 2); // 大きさも徐々に小さくする
      ctx.fill();
    }
    else if(p.type==='smoke'){
      ctx.globalAlpha=p.life*0.22; ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,(p.r||6)*(2-p.life),0,Math.PI*2); ctx.fill();
    }else if(p.type==='core'){
      ctx.globalAlpha=p.life*0.9;
      const gr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*2);
      gr.addColorStop(0,'#ffffff'); gr.addColorStop(0.5,p.color); gr.addColorStop(1,'rgba(255,200,0,0)');
      ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*2*p.life,0,Math.PI*2); ctx.fill();
    }else if(p.type==='spark'){
      ctx.globalAlpha=p.life; ctx.strokeStyle=p.color; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.vx*3,p.y-p.vy*3); ctx.stroke();
    }else if(p.type==='thruster'){
      ctx.globalAlpha=p.life*0.9;
      const tr=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*3);
      tr.addColorStop(0,'#ffffff'); tr.addColorStop(0.3,p.color); tr.addColorStop(1,'rgba(255,60,0,0)');
      ctx.fillStyle=tr; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*2.5*p.life,0,Math.PI*2); ctx.fill();
    }else{
      ctx.globalAlpha=p.life*(p.isFlame?0.85:0.5); ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.isFlame?4*p.life:2*p.life,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

// --- 隕石 ---
function drawMeteor(d){

    ctx.lineTo(-d.r*0.7,-d.r*0.4); ctx.closePath(); ctx.fill();
  }

}

// --- ハートアイテム ---
function drawHeartItem(it){
  ctx.save();
  ctx.translate(it.x, it.y);

  const pulse = 0.92 + 0.08 * Math.sin(Date.now() * 0.005); // 拍動

  // 背景の光（正解・不正解で色を変えない）
  ctx.globalAlpha = 0.28 * pulse;
  ctx.fillStyle = '#ff66aa';
  ctx.beginPath();
  ctx.arc(0, 0, 26, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalAlpha = 1;

  // --- 画像描画（縦横比を維持・フィルターなし統一） ---
  if (heartImg.complete && heartImg.naturalWidth > 0) {
    const base = 38 * pulse;
    const ratio = heartImg.naturalHeight / heartImg.naturalWidth;
    const w = base;
    const h = base * ratio;
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(heartImg, -w / 2, -h / 2, w, h);
  } 
  // --- フォールバック（ベクターハート・色統一） ---
  else {
    ctx.fillStyle = '#ff3366';
    ctx.beginPath();
    ctx.moveTo(0, 6);
    ctx.bezierCurveTo(-16, -6, -22, -19, -10, -22);
    ctx.bezierCurveTo(-3, -25, 0, -19, 0, -16);
    ctx.bezierCurveTo(0, -19, 3, -25, 10, -22);
    ctx.bezierCurveTo(22, -19, 16, -6, 0, 6);
    ctx.fill();
  }

  // --- ラベル表示（ハートの上・色統一） ---
  if (it.label) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = "bold 9px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
    ctx.fillStyle = 'rgba(0,0,0,0.60)';
    const textW = ctx.measureText(it.label).width + 8;
    ctx.beginPath();
    ctx.roundRect(-textW/2, -54, textW, 15, 4);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.fillText(it.label, 0, -43);
    ctx.restore();
  }

  ctx.restore();
}

// --- HUD ---
function drawHUD(){
  const s=st();
  const progress = hudProgress;
  const MARGIN=6;

  // 上部パネル
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.roundRect(6,4,W-12,36,5); ctx.fill();
  ctx.restore();

  // ステージラベル
  ctx.save();
  ctx.fillStyle='rgba(180,220,255,0.9)'; ctx.font = "bold 9px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif"; ctx.textAlign='center';
  ctx.fillText(s.label,W/2,14);
  ctx.restore();

  // 一行: [出発] [バー] [目標]
  const ICO=10,BAR_Y=27,BAR_H=7;
  const LEFT_X=MARGIN+ICO*2+6, RIGHT_X=W-MARGIN-ICO*2-6;
  const BAR_W=RIGHT_X-LEFT_X;
  const fromX=MARGIN+ICO+2, toX=W-MARGIN-ICO-2;

  // 惑星アイコン描画ヘルパー（土星はリング付き横長で描画）
  function drawPlanetIcon(c, cx, cy, r, fallColor){
    ctx.save(); ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
    if(c){
      if(c._isSaturn){
        const aspect = c.width / Math.max(c.height,1);
        const dh = r * 2, dw = dh * aspect;
        ctx.drawImage(c, 0, 0, c.width, c.height, cx - dw/2, cy - dh/2, dw, dh);
      } else {
        ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.clip();
        ctx.drawImage(c,0,0,c.width,c.height,cx-r,cy-r,r*2,r*2);
      }
    } else {
      ctx.fillStyle=fallColor; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  // 出発惑星（HUD専用高解像度キャッシュを使用）
  drawPlanetIcon(s.getHudFrom ? s.getHudFrom() : s.getFrom(), fromX, BAR_Y, ICO, s.fromColor);

  // 目標惑星（HUD専用高解像度キャッシュを使用）
  drawPlanetIcon(s.getHudTo ? s.getHudTo() : s.getTo(), toX, BAR_Y, ICO, s.toColor);

  // 進行バー
  ctx.save();
  ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.beginPath(); ctx.roundRect(LEFT_X,BAR_Y-BAR_H/2,BAR_W,BAR_H,3); ctx.fill();
  const bfill=BAR_W*progress;
  if(bfill>1){
    const g=ctx.createLinearGradient(LEFT_X,0,LEFT_X+BAR_W,0);
    g.addColorStop(0,'#1155cc'); g.addColorStop(0.5,'#44aaff'); g.addColorStop(1,'#aaddff');
    ctx.fillStyle=g; ctx.beginPath(); ctx.roundRect(LEFT_X,BAR_Y-BAR_H/2,bfill,BAR_H,3); ctx.fill();
  }
  ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.arc(Math.min(LEFT_X+bfill,LEFT_X+BAR_W),BAR_Y,3,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(150,200,255,0.2)'; ctx.lineWidth=1; ctx.beginPath(); ctx.roundRect(LEFT_X,BAR_Y-BAR_H/2,BAR_W,BAR_H,3); ctx.stroke();
  ctx.restore();

  // 左右移動ガイド矢印（ロケットの左右・プレイ中のみ）
  if(state === 'playing'){
    const ry = H - 90; // ロケットのY座標
    const arrowY = ry - 2;
    const alpha = 0.18 + 0.07 * Math.sin(Date.now() * 0.002); // ゆっくり点滅

    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#aaddff';
    ctx.font = "18px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // 左矢印（画面左端）
    ctx.fillText('◀', 16, arrowY);
    // 右矢印（画面右端）
    ctx.fillText('▶', W - 16, arrowY);
    ctx.textBaseline = 'alphabetic';
    ctx.restore();
  }

  // エネルギーバー（右下）
  const BAR_FULL_W = 110;
  const BAR_BH = 14;
  const EX = W - MARGIN - BAR_FULL_W;
  const EY = H - MARGIN - BAR_BH - 2;
  const energyRatio = Math.max(0, Math.min(1, energy / ENERGY_MAX));

  // バー背景パネル
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.roundRect(EX-28, EY-4, BAR_FULL_W+32, BAR_BH+8, 5); ctx.fill();

  // ラベル
  ctx.fillStyle='rgba(180,220,255,0.85)';
  ctx.font = "bold 13px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif"; ctx.textAlign='right';
  ctx.fillText('⚡', EX-1, EY+BAR_BH-1);

  // バー背景
  ctx.fillStyle='rgba(255,255,255,0.08)';
  ctx.beginPath(); ctx.roundRect(EX, EY, BAR_FULL_W, BAR_BH, 4); ctx.fill();

  // バー本体（エネルギー残量によって色変化）
  if(energyRatio > 0){
    const barFillW = BAR_FULL_W * energyRatio;
    let barColor;
    if(energyRatio > 0.5){
      // 緑 → 黄
      const t2 = (energyRatio - 0.5) / 0.5;
      const r2 = Math.round(255 * (1-t2) + 80 * t2) | 0;
      const g2 = Math.round(220 * (1-t2) + 220 * t2) | 0;
      barColor = `rgb(${r2},${g2},50)`;
    } else {
      // 黄 → 赤
      const t2 = energyRatio / 0.5;
      const r2 = 255;
      const g2 = Math.round(220 * t2) | 0;
      barColor = `rgb(${r2},${g2},30)`;
    }
    const eg = ctx.createLinearGradient(EX, 0, EX+barFillW, 0);
    eg.addColorStop(0, barColor);
    eg.addColorStop(1, '#ffffff88');
    ctx.fillStyle = eg;
    ctx.beginPath(); ctx.roundRect(EX, EY, barFillW, BAR_BH, 4); ctx.fill();

    // 点滅演出（残り20%以下）
    if(energyRatio < 0.2 && Math.sin(Date.now() * 0.015) > 0){
      ctx.fillStyle='rgba(255,80,0,0.35)';
      ctx.beginPath(); ctx.roundRect(EX, EY, barFillW, BAR_BH, 4); ctx.fill();
    }
  }

  // バー枠線
  ctx.strokeStyle='rgba(150,200,255,0.25)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(EX, EY, BAR_FULL_W, BAR_BH, 4); ctx.stroke();

  // パーセント表示
  ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.font = "bold 8px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif"; ctx.textAlign='center';
  ctx.fillText(Math.ceil(energyRatio*100)+'%', EX + BAR_FULL_W/2, EY + BAR_BH - 3);

  ctx.textAlign='left';
  ctx.restore();

  // ===== ヒントコメント（左下、音出現中に表示） =====
  if(heartSetActive && currentBlock && currentBlock.comment && !hintDismissed){
    drawHintComment(currentBlock.comment);
  }

  // ===== 正解表示（ハートを逃したとき・次のハート出現まで） =====
  if(!heartSetActive && lastMissedAnswer){
    drawMissedAnswer(lastMissedAnswer);
  }
}

// ===== ヒントコメント描画（テキストのみ）=====
function drawHintComment(comment){
  const MARGIN = 6;
  const BAR_BH = 14;
  const EY = H - MARGIN - BAR_BH - 2;

  const PH = BAR_BH + 8;
  const PY = EY - 4;

  ctx.save();
  const labelText = 'ヒント：';
  ctx.font = "bold 9px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  const labelW = ctx.measureText(labelText).width;
  ctx.font = "9px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  const textW  = ctx.measureText(comment).width;
  const PW = labelW + textW + 14;
  const PX = MARGIN;
  const midY = PY + PH / 2;

  // 背景パネル（グラデーション）
  const bg = ctx.createLinearGradient(PX, PY, PX, PY + PH);
  bg.addColorStop(0, 'rgba(0,20,50,0.88)');
  bg.addColorStop(1, 'rgba(0,8,28,0.88)');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.roundRect(PX, PY, PW, PH, 5); ctx.fill();

  // シアン枠線
  ctx.strokeStyle = 'rgba(100,200,255,0.45)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(PX, PY, PW, PH, 5); ctx.stroke();

  // 上部ハイライトライン
  ctx.strokeStyle = 'rgba(160,230,255,0.25)';
  ctx.lineWidth = 0.5;
  ctx.beginPath(); ctx.moveTo(PX+6, PY+1); ctx.lineTo(PX+PW-6, PY+1); ctx.stroke();

  // 「ヒント：」ラベル（明るいシアン・太字）
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(120,220,255,1)';
  ctx.font = "bold 9px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  ctx.fillText(labelText, PX + 6, midY + 3);

  // コメントテキスト
  ctx.fillStyle = 'rgba(210,240,255,0.95)';
  ctx.font = "9px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  ctx.fillText(comment, PX + 6 + labelW, midY + 3);

  ctx.restore();
}

// ===== 正解表示パネル（ミス後に表示）=====
function drawMissedAnswer(label){
  const MARGIN = 6;
  const BAR_BH = 14;
  const EY = H - MARGIN - BAR_BH - 2;

  const PH = BAR_BH + 8;
  const PY = EY - 4;

  ctx.save();
  const labelText = '正解：';
  ctx.font = "bold 9px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  const labelW = ctx.measureText(labelText).width;
  ctx.font = "9px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  const textW  = ctx.measureText(label).width;
  const PW = labelW + textW + 14;
  const PX = MARGIN;
  const midY = PY + PH / 2;

  // 背景パネル（オレンジ系グラデーション・ヒントと区別）
  const bg = ctx.createLinearGradient(PX, PY, PX, PY + PH);
  bg.addColorStop(0, 'rgba(50,15,0,0.92)');
  bg.addColorStop(1, 'rgba(30,8,0,0.92)');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.roundRect(PX, PY, PW, PH, 5); ctx.fill();

  // オレンジ枠線
  ctx.strokeStyle = 'rgba(255,160,60,0.6)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(PX, PY, PW, PH, 5); ctx.stroke();

  // 上部ハイライトライン
  ctx.strokeStyle = 'rgba(255,200,100,0.25)';
  ctx.lineWidth = 0.5;
  ctx.beginPath(); ctx.moveTo(PX+6, PY+1); ctx.lineTo(PX+PW-6, PY+1); ctx.stroke();

  // 「正解：」ラベル（オレンジ・太字）
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,180,60,1)';
  ctx.font = "bold 9px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  ctx.fillText(labelText, PX + 6, midY + 3);

  // 正解テキスト
  ctx.fillStyle = 'rgba(255,220,160,0.95)';
  ctx.font = "9px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  ctx.fillText(label, PX + 6 + labelW, midY + 3);

  ctx.restore();
}

let _uiTime = 0; // UI animation time accumulator

function drawStartScreen() {

  const bg = ctx.createRadialGradient(W/2, H*0.42, 0, W/2, H*0.42, W*0.85);

  const titleY = H * 0.20;

  // タイトル光輪
  const glow = ctx.createRadialGradient(W/2, titleY, 0, W/2, titleY, 90);
  glow.addColorStop(0,   `rgba(80,120,255,${0.18 + 0.08*Math.sin(T*1.8)})`);
  glow.addColorStop(0.5, `rgba(40,80,200,${0.08 + 0.04*Math.sin(T*2.1)})`);
  glow.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, titleY - 60, W, 120);

  // タイトル：サブ
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = "bold 9px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  ctx.letterSpacing = '3px';
  ctx.fillStyle = `rgba(120,180,255,${0.7 + 0.3*Math.sin(T*1.4)})`;
  ctx.fillText('MISSION  START', W/2, titleY - 22);

  // タイトル：メイン（2行）
  ctx.font = "bold 26px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  ctx.shadowColor = `rgba(100,160,255,${0.8 + 0.2*Math.sin(T*2.2)})`;
  ctx.shadowBlur = 18 + 8 * Math.sin(T * 1.6);
  const tg = ctx.createLinearGradient(W/2 - 100, 0, W/2 + 100, 0);
  tg.addColorStop(0,   '#88ccff');
  tg.addColorStop(0.35,'#ffffff');
  tg.addColorStop(0.65,'#ffffff');
  tg.addColorStop(1,   '#aabbff');
  ctx.fillStyle = tg;
  ctx.fillText('心音の旅', W/2, titleY + 6);

  ctx.shadowBlur = 0;
  ctx.font = "10px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  ctx.fillStyle = `rgba(160,200,255,${0.6 + 0.2*Math.sin(T*1.1)})`;
  ctx.fillText('太陽系を超え心臓星へ', W/2, titleY + 24);
  ctx.restore();

  // --- 装飾ライン ---
  ctx.save();
  ctx.textAlign = 'center';
  for(let side = -1; side <= 1; side += 2){
    const lx = W/2 + side * 70;
    const lg = ctx.createLinearGradient(W/2, 0, lx, 0);
    lg.addColorStop(0,   `rgba(100,160,255,${0.6 + 0.3*Math.sin(T*1.5)})`);
    lg.addColorStop(1,   'rgba(100,160,255,0)');
    ctx.strokeStyle = lg;
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(W/2 + side * 6, titleY + 36);
    ctx.lineTo(lx, titleY + 36);
    ctx.stroke();
  }
  ctx.restore();

  // --- 流れ星パーティクル（UI専用、簡易） ---
  ctx.save();
  for(let i = 0; i < 4; i++){
    const phase = (T * 0.7 + i * 1.57) % (Math.PI * 2);
    const px = (W * 0.1 + i * W * 0.25 + Math.sin(phase * 0.3) * 20) % W;
    const py = (H * 0.05 + i * H * 0.07 + T * (14 + i * 5)) % (H * 0.55);
    const len = 18 + i * 8;
    const alpha = 0.3 + 0.4 * Math.abs(Math.sin(phase));
    const sg = ctx.createLinearGradient(px, py, px - len * 0.6, py - len);
    sg.addColorStop(0, `rgba(200,220,255,${alpha})`);
    sg.addColorStop(1, 'rgba(200,220,255,0)');
    ctx.strokeStyle = sg;
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - len * 0.6, py - len); ctx.stroke();
  }
  ctx.restore();

  // --- 航路マップ ---
  drawProgressMap(completedCount, START_MAP_OFFSET);

  // --- クレジット＆免責（スタート画面のみ） ---
  ctx.save();

  // © クレジット：ボタン直下・中央揃え
  // bottom:33% → ボタン下端はおよそ H * 0.67 付近、余白を見てY座標を設定
  const creditY = H * 0.695;
  ctx.textAlign = 'center';
  ctx.font = "bold 7px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  ctx.fillStyle = 'rgba(160,200,255,0.60)';
  ctx.fillText('© 2026 ponde3110', W / 2, creditY);

  // 免責テキスト：航路マップ枠の下・左揃え・極小
  // 枠下端 = H - 4 - START_MAP_OFFSET = 520 - 4 - 30 = 486
  const mapBottom = H - 4 - START_MAP_OFFSET;  // 枠の下端
  const disclaimerTopMargin = 7;               // 枠との間隔
  const disclaimer =
    '心音の解釈は必ずしも一義的ではないため，本アプリに掲載された情報に基づいて生じた' +
    'いかなる損害について一切の責任を負いかねます．音声は全て実際の心音です．' +
    '本アプリに含まれるすべてのコンテンツは，著作権法により保護されています．';
  ctx.font = "5.5px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  ctx.fillStyle = 'rgba(120,160,210,0.40)';
  ctx.textAlign = 'left';
  const leftX = 8;
  const maxLineW = W - 16;
  const lineH = 7;
  // 手動折り返し
  const dLines = [];
  let cur = '';
  for(const ch of disclaimer){
    const test = cur + ch;
    if(ctx.measureText(test).width > maxLineW){ dLines.push(cur); cur = ch; }
    else { cur = test; }
  }
  if(cur) dLines.push(cur);
  // 枠下端＋余白から下向きに描画
  dLines.forEach((l, idx) => {
    ctx.fillText(l, leftX, mapBottom + disclaimerTopMargin + (idx + 1) * lineH);
  });

  ctx.restore();
}

// ゴージャス ステージクリア画面

function drawStageClearScreen(stageIndex) {
  const T = _uiTime;
  const s = STAGES[stageIndex];
  const missionTitle = s.label.split('：')[0];
  const nextS = STAGES[stageIndex + 1];

  // オーバーレイ
  const bg = ctx.createRadialGradient(W/2, H*0.38, 0, W/2, H*0.38, W*0.9);
  bg.addColorStop(0,   'rgba(0,20,10,0.88)');
  bg.addColorStop(0.5, 'rgba(0,10,30,0.92)');
  bg.addColorStop(1,   'rgba(0,0,10,0.96)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // SUCCESS バナー背景
  const bannerY = H * 0.13;
  const bannerH = 70;
  ctx.save();
  const bannerG = ctx.createLinearGradient(0, bannerY, 0, bannerY + bannerH);
  bannerG.addColorStop(0,   `rgba(0,60,20,${0.5 + 0.1*Math.sin(T*2)})`);
  bannerG.addColorStop(0.5, `rgba(0,100,40,${0.35})`);
  bannerG.addColorStop(1,   'rgba(0,20,10,0)');
  ctx.fillStyle = bannerG;
  ctx.fillRect(0, bannerY, W, bannerH);

  // 左右の光線
  for(let side = -1; side <= 1; side += 2){
    const rx = W/2 + side * (30 + 40 * Math.abs(Math.sin(T * 0.9)));
    const rg = ctx.createLinearGradient(W/2, bannerY + bannerH/2, rx, bannerY + bannerH/2);
    rg.addColorStop(0,   `rgba(80,255,140,${0.18 + 0.08*Math.sin(T*1.8)})`);
    rg.addColorStop(1,   'rgba(80,255,140,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(Math.min(W/2, rx), bannerY, Math.abs(rx - W/2), bannerH);
  }

  ctx.textAlign = 'center';

  // ラベル
  ctx.font = "bold 8px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  ctx.fillStyle = `rgba(80,255,140,${0.7 + 0.25*Math.sin(T*2.5)})`;
  ctx.fillText('✦  MISSION COMPLETE  ✦', W/2, bannerY + 18);

  // ミッション名
  ctx.font = "bold 22px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  ctx.shadowColor = `rgba(60,255,120,${0.9 + 0.1*Math.sin(T*1.8)})`;
  ctx.shadowBlur = 14 + 6 * Math.sin(T * 2.2);
  const mg = ctx.createLinearGradient(W/2-80, 0, W/2+80, 0);
  mg.addColorStop(0,   '#88ffcc');
  mg.addColorStop(0.4, '#ffffff');
  mg.addColorStop(0.6, '#ffffff');
  mg.addColorStop(1,   '#aaffdd');
  ctx.fillStyle = mg;
  ctx.fillText(missionTitle + '  成功！', W/2, bannerY + 50);
  ctx.shadowBlur = 0;

  // --- 到着した星のアイコン（大きく） ---
  const iconY = H * 0.30;
  const iconR2 = 36;
  const toImg = PLANET_IMGS[stageIndex + 1]();
  const pulse = 1 + 0.06 * Math.sin(T * 2.4);

  ctx.save();
  ctx.shadowColor = PLANET_COLORS[stageIndex + 1];
  ctx.shadowBlur = 20 + 10 * Math.sin(T * 2.0);

  // リング
  for(let ri = 0; ri < 3; ri++){
    const rr = iconR2 + 10 + ri * 12 + ri * 4 * Math.sin(T * 1.5 + ri);
    const ra = (0.4 - ri * 0.1) * (0.6 + 0.4 * Math.abs(Math.sin(T * 1.2 + ri * 0.8)));
    ctx.strokeStyle = `rgba(255,255,255,${ra})`;
    ctx.lineWidth = 1.0 - ri * 0.2;
    ctx.beginPath(); ctx.arc(W/2, iconY, rr, 0, Math.PI * 2); ctx.stroke();
  }

  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  if(toImg && toImg.complete && toImg.naturalWidth){
    const isSaturn = (stageIndex + 1 === 4); // 土星はindex4
    if(isSaturn){
      const asp = toImg.naturalWidth / Math.max(toImg.naturalHeight, 1);
      const dh = iconR2 * pulse * 2.6; // リングごと表示
      const dw = dh * asp;
      ctx.drawImage(toImg, W/2 - dw/2, iconY - dh/2, dw, dh);
    } else {
      const r2d = iconR2 * pulse;
      ctx.beginPath(); ctx.arc(W/2, iconY, r2d, 0, Math.PI * 2); ctx.clip();
      const iw = toImg.naturalWidth, ih = toImg.naturalHeight;
      const sq = Math.min(iw, ih);
      ctx.drawImage(toImg, (iw-sq)/2, (ih-sq)/2, sq, sq, W/2-r2d, iconY-r2d, r2d*2, r2d*2);
    }
  } else {
    ctx.fillStyle = PLANET_COLORS[stageIndex + 1];
    ctx.beginPath(); ctx.arc(W/2, iconY, iconR2 * pulse, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  // 到着テキスト
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = "bold 11px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  ctx.fillStyle = `rgba(200,240,255,${0.85 + 0.15*Math.sin(T*1.6)})`;
  ctx.fillText(s.arriveText, W/2, iconY + iconR2 + 18);

  // 次のミッション予告
  if(nextS){
    ctx.font = "9px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
    ctx.fillStyle = `rgba(120,180,255,${0.55 + 0.2*Math.sin(T*1.3)})`;
    ctx.fillText('NEXT ▶  ' + nextS.label.split('：')[0], W/2, iconY + iconR2 + 33);
  }
  ctx.restore();

  // 航路マップ（ローカル保存済みのクリア数と現在の大きい方）
  drawProgressMap(Math.max(completedCount, stageIndex + 1));
}

// ゴージャス ゲームオーバー画面
// =============================================
function drawGameOverScreen() {
  const T = _uiTime;

  // ── 背景：深宇宙ブラック＋青紫ネビュラ ──
  const bg = ctx.createRadialGradient(W/2, H*0.28, 0, W/2, H*0.28, W*1.1);
  bg.addColorStop(0,   'rgba(10,0,30,0.92)');
  bg.addColorStop(0.5, 'rgba(4,0,18,0.95)');
  bg.addColorStop(1,   'rgba(0,0,8,0.98)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.textAlign = 'center';

  // ══════════════════════════════════════════
  // ブロック①：GAME OVER（サイバーネオン）
  // ══════════════════════════════════════════
  const goY = H * 0.22;

  // 背景スキャンライン（ホログラム感）
  for(let ly = goY - 36; ly < goY + 14; ly += 3){
    const la = 0.04 + 0.03 * Math.sin(T * 4 + ly * 0.3);
    ctx.fillStyle = `rgba(80,180,255,${la})`;
    ctx.fillRect(W*0.06, ly, W*0.88, 1);
  }

  // 外枠パネル（サイバー風）
  const panelAlpha = 0.55 + 0.15 * Math.sin(T * 1.6);
  ctx.strokeStyle = `rgba(0,220,255,${panelAlpha})`;
  ctx.lineWidth = 1.2;
  // 上辺
  ctx.beginPath();
  ctx.moveTo(W*0.06, goY - 38); ctx.lineTo(W*0.94, goY - 38);
  ctx.stroke();
  // 下辺
  ctx.beginPath();
  ctx.moveTo(W*0.06, goY + 16); ctx.lineTo(W*0.94, goY + 16);
  ctx.stroke();
  // 左上コーナーマーク
  ctx.lineWidth = 2;
  ctx.strokeStyle = `rgba(0,255,220,${panelAlpha})`;
  ctx.beginPath(); ctx.moveTo(W*0.06, goY - 38); ctx.lineTo(W*0.06, goY - 28); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W*0.06, goY - 38); ctx.lineTo(W*0.14, goY - 38); ctx.stroke();
  // 右上コーナーマーク
  ctx.beginPath(); ctx.moveTo(W*0.94, goY - 38); ctx.lineTo(W*0.94, goY - 28); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W*0.94, goY - 38); ctx.lineTo(W*0.86, goY - 38); ctx.stroke();
  // 左下コーナーマーク
  ctx.beginPath(); ctx.moveTo(W*0.06, goY + 16); ctx.lineTo(W*0.06, goY + 6);  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W*0.06, goY + 16); ctx.lineTo(W*0.14, goY + 16); ctx.stroke();
  // 右下コーナーマーク
  ctx.beginPath(); ctx.moveTo(W*0.94, goY + 16); ctx.lineTo(W*0.94, goY + 6);  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W*0.94, goY + 16); ctx.lineTo(W*0.86, goY + 16); ctx.stroke();
  ctx.lineWidth = 1;

  // グリッチ：時々ランダムにXズレ
  const glitchActive = Math.sin(T * 7.3) > 0.82;
  const gx1 = glitchActive ? (Math.random() - 0.5) * 7 : 0;
  const gx2 = glitchActive ? (Math.random() - 0.5) * 5 : 0;

  // 広域シアンネオングロー
  ctx.shadowColor = 'rgba(0,230,255,0.9)';
  ctx.shadowBlur = 28;
  ctx.font = 'bold 30px monospace';

  // グリッチ層①（マゼンタ・微ズレ）
  ctx.globalAlpha = 0.45;
  ctx.fillStyle = '#ff44cc';
  ctx.fillText('GAME OVER', W/2 + gx1 + 3, goY);

  // グリッチ層②（シアン・微ズレ）
  ctx.fillStyle = '#00ffee';
  ctx.fillText('GAME OVER', W/2 + gx2 - 3, goY);

  // メイン文字（白→シアングラデーション）
  ctx.globalAlpha = 1.0;
  ctx.shadowColor = 'rgba(0,200,255,1)';
  ctx.shadowBlur = 18;
  const neonGrad = ctx.createLinearGradient(W/2 - 105, 0, W/2 + 105, 0);
  neonGrad.addColorStop(0,   '#00eeff');
  neonGrad.addColorStop(0.3, '#aaffff');
  neonGrad.addColorStop(0.5, '#ffffff');
  neonGrad.addColorStop(0.7, '#aaffff');
  neonGrad.addColorStop(1,   '#00eeff');
  ctx.fillStyle = neonGrad;
  ctx.fillText('GAME OVER', W/2, goY);
  ctx.shadowBlur = 0;

  // パネル下の小テキスト（緑モノスペース）
  ctx.font = '8px monospace';
  ctx.globalAlpha = 0.55 + 0.2 * Math.sin(T * 4.5);
  ctx.fillStyle = '#44ffaa';
  ctx.fillText('[ SYS:CRITICAL  ENERGY:000  STATUS:DESTROYED ]', W/2, goY + 30);
  ctx.globalAlpha = 1.0;

  // ══════════════════════════════════════════
  // ブロック②：ロケット 大破（オレンジ炎系・別レイヤー感）
  // ══════════════════════════════════════════
  const fireY = H * 0.40;
  const dangerPulse = 0.6 + 0.4 * Math.abs(Math.sin(T * 2.5));

  // 炎のオーラ
  const fireGlow = ctx.createRadialGradient(W/2, fireY, 0, W/2, fireY, 80);
  fireGlow.addColorStop(0,   `rgba(255,120,0,${0.22 * dangerPulse})`);
  fireGlow.addColorStop(0.6, `rgba(255,40,0,${0.10 * dangerPulse})`);
  fireGlow.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = fireGlow;
  ctx.fillRect(W/2 - 90, fireY - 50, 180, 100);

  // 区切り破線
  ctx.setLineDash([4, 5]);
  ctx.lineWidth = 0.8;
  ctx.strokeStyle = `rgba(255,120,40,${0.3 + 0.15 * Math.sin(T * 1.8)})`;
  ctx.beginPath(); ctx.moveTo(W*0.15, fireY - 22); ctx.lineTo(W*0.85, fireY - 22); ctx.stroke();
  ctx.setLineDash([]);

  // 「ロケット 大破」本体
  ctx.font = "bold 26px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  ctx.shadowColor = `rgba(255,80,0,${dangerPulse})`;
  ctx.shadowBlur = 22 * dangerPulse;
  const fireGrad = ctx.createLinearGradient(W/2 - 80, 0, W/2 + 80, 0);
  fireGrad.addColorStop(0,   '#ff6600');
  fireGrad.addColorStop(0.35,'#ffcc44');
  fireGrad.addColorStop(0.5, '#ffffff');
  fireGrad.addColorStop(0.65,'#ffcc44');
  fireGrad.addColorStop(1,   '#ff6600');
  ctx.fillStyle = fireGrad;
  ctx.fillText('ロケット 大破', W/2, fireY);
  ctx.shadowBlur = 0;

  // 「エネルギーが尽きた…」
  ctx.font = "10px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  ctx.fillStyle = `rgba(210,160,100,${0.55 + 0.2 * Math.sin(T * 1.4)})`;
  ctx.fillText('エネルギーが尽きた…', W/2, fireY + 20);

  // 浮遊破片（炎色2種）
  for(let i = 0; i < 8; i++){
    const angle = (i / 8) * Math.PI * 2 + T * 0.35;
    const r2 = 48 + 8 * Math.sin(T * 1.6 + i * 1.3);
    const px = W/2 + Math.cos(angle) * r2;
    const py = fireY - 4  + Math.sin(angle) * r2 * 0.32;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(T * 1.1 + i);
    ctx.globalAlpha = 0.28 + 0.22 * Math.sin(T * 2.2 + i);
    ctx.fillStyle = i % 2 === 0 ? '#ff8822' : '#ffdd44';
    const sz = 3 + (i % 3);
    ctx.fillRect(-sz/2, -sz/2, sz, sz * 0.7);
    ctx.restore();
  }

  ctx.restore();

  // 航路マップ（ローカル保存済みのクリア数を使用）
  drawProgressMap(completedCount);
}

// --- 出発アニメーション（修正版） ---
function drawLaunchAnim(){
  ensureCanvas();
  const s=st(),t=launchT;
  // 惑星を大きく・画面下部に上1/3だけ見えるように表示
  const fromR=Math.round(W * 0.85); // 画面幅の約85%の半径＝大きな惑星
  // 中心Y: 惑星の上1/3が画面に見えるよう、中心をH + fromR*(2/3) あたりに固定
  const baseY = H + fromR * (2/3);
  // アニメ開始時は少し下から登場し、終わりに向けてゆっくり沈んでいく（出発感）
  let fromY = baseY + fromR * 0.55 * easeIn(t); // 惑星がしっかり消えるまで沈む

  // 土星はリング込みの横長画像なので、画像上部（リング含む）が画面に見えるよう中心Yを調整
  const fromCanvas = s.getFrom();
  if(fromCanvas && fromCanvas._isSaturn){
    const aspect = fromCanvas.width / Math.max(fromCanvas.height, 1);
    const drawH = fromR * 2;
    fromY = H + drawH / 2 - drawH * 0.22 + drawH * 0.55 * easeIn(t);

    // 反時計回りに少し傾けてリングを見せる
    ctx.save();
    ctx.translate(W/2, fromY);
    ctx.rotate(-0.28); // 約16度反時計回り
    const drawW = drawH * aspect;
    ctx.globalAlpha = 1;
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(fromCanvas, 0, 0, fromCanvas.width, fromCanvas.height,
                  -drawW/2, -drawH/2, drawW, drawH);
    ctx.restore();
  } else {
    drawPlanet(W/2, fromY, fromR, 1, s.getFrom(), s.fromColor);
  }

  const ry=(H-fromR*0.15-70)+(H-90-(H-fromR*0.15-70))*easeOut(t);
  addLaunchFlame(W/2,ry+18); drawRocketAt(W/2+(Math.random()-0.5)*t*4,ry,true,0);
  if(t<0.6){
    const a=Math.min(1,t*5);
    ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.font = "bold 18px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";ctx.textAlign='center';
    ctx.fillText(s.launchText,W/2,H*0.38);ctx.textAlign='left';
  }
}

function drawArriveAnim(){
  const s = st(), t = arriveT;
  
  // 1. 星の描画：bgDestLastR/bgDestLastYから徐々に拡大して中央へ
  const r = bgDestLastR + (450 - bgDestLastR) * easeIn(t);
  const dy = bgDestLastY + (H / 2 - bgDestLastY) * easeIn(t);
  drawPlanet(W/2, dy, r, 1, s.getTo(), s.toColor);

  // 2. ロケットの描画：playing終了時の大きさ(scale=1)から縮小
  const rocketScale = Math.max(0, 1.0 * (1 - t));
  const alpha = Math.max(0, 1 - t * 1.2);
  // Y座標：ロケットの通常位置(H-90)から上へ移動
  const rocketY = (H - 90) - (t * H * 0.65);

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(W/2, rocketY);
  ctx.scale(rocketScale, rocketScale);
  
  // 揺れながら進む
  const shake = (Math.random() - 0.5) * 3;
  drawRocketAt(shake, 0, true, 0);
  ctx.restore();

  // 3. テキスト表示
  if(t > 0.3){
    const a = Math.min(1, (t - 0.3) * 3);
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.font = "bold 20px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
    ctx.textAlign = 'center';
    ctx.fillText(s.arriveText, W/2, H * 0.45);
    ctx.textAlign = 'left';
  }
}

function drawUfo(u){
  if(u.exploding) {
    for(const p of u.explodeParticles){
      ctx.save(); ctx.globalAlpha = p.life * 0.9; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    return;
  }

  ctx.save();
  ctx.translate(u.x, u.y);

  // --- シンプルなサーチライト（hoverモード中のみ） ---
  if(u.mode === 'hover' && !u.isCapture){
    const pulse = 0.75 + Math.sin(Date.now() * 0.007) * 0.25;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const beam = ctx.createLinearGradient(0, 5, 0, 120);
    beam.addColorStop(0, `rgba(100, 220, 255, ${0.22 * pulse})`);
    beam.addColorStop(1, 'rgba(0, 120, 255, 0)');
    ctx.fillStyle = beam;
    ctx.beginPath();
    ctx.moveTo(-10, 5); ctx.lineTo(10, 5);
    ctx.lineTo(38, 120); ctx.lineTo(-38, 120);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // --- 捕獲ビーム（捕獲UFO用・同じ円錐スタイル） ---
  if(u.isCapture && u.beamActive){
    const target = u.captureTarget;
    const beamLen = target ? Math.max(30, target.y - u.y + 20) : 100;
    const spread = beamLen * 0.32;
    const pulse = 0.75 + Math.sin(Date.now() * 0.007) * 0.25;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const beam = ctx.createLinearGradient(0, 5, 0, beamLen);
    beam.addColorStop(0, `rgba(100, 220, 255, ${0.28 * pulse})`);
    beam.addColorStop(1, 'rgba(0, 120, 255, 0)');
    ctx.fillStyle = beam;
    ctx.beginPath();
    ctx.moveTo(-10, 5); ctx.lineTo(10, 5);
    ctx.lineTo(spread, beamLen); ctx.lineTo(-spread, beamLen);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // UFO本体の描画
  if(ufoImg.complete && ufoImg.naturalWidth > 0){
    ctx.drawImage(ufoImg, -39, -25, 78, 50);
  } else {
    // 画像がない場合のフォールバック
    ctx.fillStyle = '#88ddff';
    ctx.beginPath(); ctx.ellipse(0, 0, 26, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#aaeeff';
    ctx.beginPath(); ctx.ellipse(0, -4, 12, 6, 0, 0, Math.PI * 2); ctx.fill();
  }

  ctx.restore();
}

function updateUfos(dt){

  for(const u of ufos){
    if(u.mode === 'approach'){
      // 捕獲UFOは対象が死んでいたら退場
      if(u.isCapture && u.captureTarget && !u.captureTarget.alive){
        u.mode = 'depart'; continue;
      }
      // 捕獲UFOは対象の上に移動
      if(u.isCapture && u.captureTarget){
        u.targetX = u.captureTarget.x;
        u.targetY = u.captureTarget.y - 60;
      }
      u.x += (u.targetX - u.x) * dt * 2.5;
      u.y += (u.targetY - u.y) * dt * 2.5;
      if(Math.abs(u.x - u.targetX) < 5 && Math.abs(u.y - u.targetY) < 5){
        u.mode = 'hover';
        if(u.isCapture) u.beamActive = true;
      }
    }
    else if(u.mode === 'hover'){
      u.timer += dt;
      u.x += Math.sin(u.timer * 3) * 0.7;
      u.y += Math.cos(u.timer * 5) * 0.4;

      if(u.isCapture && u.beamActive){
        u.beamTimer += dt;
        const tgt = u.captureTarget;
        // 対象が既に消えていたら退場
        if(!tgt || !tgt.alive){ u.mode = 'depart'; continue; }
        // 対象の上に追従
        u.targetX = tgt.x;
        u.targetY = tgt.y - 60;
        // ビーム展開後2秒で宇宙飛行士を引き込み開始
        if(u.beamTimer > 2.0 && tgt.mode !== 'being_pulled'){
          tgt.mode = 'being_pulled';
          tgt.captureAlpha = 1;
          tgt.captureScale = 1;
          tgt.captureUfoRef = u;
        }
        // 宇宙飛行士が消えたら退場（being_pulledで処理済みの場合もある）
        if(!tgt.alive){ u.mode = 'depart'; continue; }
      } else if(!u.isCapture && u.timer > 4.0){
        u.mode = 'depart';
      }
    }
    else if(u.mode === 'depart'){
      u.vy -= dt * 700;
      u.y += u.vy * dt;
    }

    // UFOは隕石などほかの物から影響を受けない（衝突判定なし）
  }

  ufos = ufos.filter(u => u.y > -200 && u.x > -150 && u.x < W + 150);

  // UFOが1機以上画面内にいて、かつplaying中のみループ音ON
  if (ufos.length > 0 && state === 'playing') {
    startUfoLoopSound();
  } else {
    stopUfoLoopSound();
  }
}
