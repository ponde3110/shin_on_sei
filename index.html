// 白一色の紙吹雪
function spawnConfettiWhite(count=80) {
  const overlay = document.getElementById('licensedCelebOverlay');
  if(!overlay) return;
  const shapes = ['rect','rect','rect','circle','ribbon'];
  const overlayRect = overlay.getBoundingClientRect();
  const OW = overlayRect.width  || 320;
  const OH = overlayRect.height || 560;
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    el.className = 'confetti';
    const shape = shapes[Math.floor(Math.random()*shapes.length)];
    const alpha = 0.65 + Math.random()*0.35;
    const sz = 6 + Math.random()*9;
    if(shape === 'circle'){ el.style.width = el.style.height = sz+'px'; el.style.borderRadius='50%'; }
    else if(shape === 'ribbon'){ el.style.width=(sz*0.35)+'px'; el.style.height=(sz*2.8)+'px'; el.style.borderRadius='2px'; }
    else { el.style.width=sz+'px'; el.style.height=(sz*(0.35+Math.random()*0.5))+'px'; el.style.borderRadius='1px'; }
    el.style.background = `rgba(255,255,255,${alpha})`;
    el.style.boxShadow  = '0 0 4px 1px rgba(220,240,255,0.5)';
    el.style.position   = 'absolute';
    const startX = Math.random()*OW;
    const startY = -sz - Math.random()*60;
    el.style.left = startX+'px';
    el.style.top  = startY+'px';
    const dur    = 2.8 + Math.random()*2.4;
    const delay  = Math.random()*1.8;
    const driftX = (Math.random()-0.5)*OW*0.55;
    const travelY = OH + sz + 20 - startY;
    const rotEnd = (Math.random()<0.5?1:-1)*(360+Math.random()*720);
    const swingAmp = 18 + Math.random()*22;
    el.animate([
      { transform:`translate(0px,0px) rotate(0deg) scaleX(1)`, opacity:1, offset:0 },
      { transform:`translate(${driftX*0.3+swingAmp}px,${travelY*0.25}px) rotate(${rotEnd*0.25}deg) scaleX(0.7)`, opacity:1, offset:0.25 },
      { transform:`translate(${driftX*0.6-swingAmp}px,${travelY*0.55}px) rotate(${rotEnd*0.55}deg) scaleX(1.0)`, opacity:0.95, offset:0.55 },
      { transform:`translate(${driftX*0.85+swingAmp*0.5}px,${travelY*0.82}px) rotate(${rotEnd*0.82}deg) scaleX(0.6)`, opacity:0.7, offset:0.82 },
      { transform:`translate(${driftX}px,${travelY}px) rotate(${rotEnd}deg) scaleX(1)`, opacity:0, offset:1 },
    ], { duration:dur*1000, delay:delay*1000, fill:'forwards', easing:'ease-in' });
    overlay.appendChild(el);
    setTimeout(()=>{ if(el.parentNode) el.remove(); }, (dur+delay+0.5)*1000);
  }
}

// 裏ミッションボタン
document.getElementById('secretMissionBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  unlockAudio();
  hideCelebration();

  document.getElementById('startBtn').classList.add('hidden');
  const _hpwForTransform = document.getElementById('heartPlanetWrap');
  if(_hpwForTransform) _hpwForTransform.style.display = 'none';

  // 裏ミッションクリア済みの場合はアニメをスキップして直接開始
  if (secretCleared) {
    state = 'launch_anim';
    ctx.clearRect(0, 0, W, H);
    _triggerLaunchAudio();
    startStage(7);
    return;
  }

  // 【修正②】金色変換アニメ中はstartBtnを非表示にする
  const _heartPlanet = document.getElementById('heartPlanet');
  if(_heartPlanet) _heartPlanet.style.display = 'none';
  const _orbitPath = document.getElementById('orbitPath');
  if(_orbitPath) _orbitPath.style.display = 'none';

  // ゲームループの干渉を防ぐ
  state = 'golden_transform';
  ctx.clearRect(0, 0, W, H);

  // ===== 金色ロケット変換アニメ（超ドラマチック版） =====
  // フェーズ：
  //   0.00-0.15  : ロケット(rocket.webp)が画面中央に降下・登場
  //   0.15-0.38  : 青白い霧/もやがロケットを包んでいく
  //   0.38-0.58  : 霧が最高濃度・ロケットが霧に飲み込まれる（完全に隠れる）
  //   0.58-0.72  : 霧の中で衝撃波・光・変換エフェクト爆発
  //   0.72-0.86  : 霧が晴れていく → 金色ロケット(rocket2.webp)が現れる
  //   0.86-1.00  : 金色ロケット全開放・輝き・テキスト → フェードアウト
  (function playGoldenTransform() {
    const overlay = document.getElementById('goldenTransformOverlay');
    const gtCanvas = document.getElementById('goldenTransformCanvas');
    const rwrap = document.getElementById('rwrap');
    const dw = parseInt(rwrap.style.width) || 320;
    const dh = parseInt(rwrap.style.height) || 520;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    gtCanvas.width  = dw * dpr;
    gtCanvas.height = dh * dpr;
    gtCanvas.style.width  = dw + 'px';
    gtCanvas.style.height = dh + 'px';
    const gc = gtCanvas.getContext('2d');
    gc.scale(dpr, dpr);

    overlay.classList.add('active');

    const CW = dw, CH = dh;
    const cx = CW / 2;
    const cy = CH * 0.45;  // 画面の少し上寄り中央

    // 【修正③】ロケット描画サイズ：進化前と全く同じサイズ(58×95)で2倍スケール
    // RYを-RH/2にして画像の中心がtranslate点(cy)に来るよう修正
    const BASE_SCALE = 2.0;
    const RW = 58 * BASE_SCALE, RH = 95 * BASE_SCALE;
    const RX = -RW/2, RY = -RH/2; // 【修正③】中心揃え

    let startT = null;
    const TOTAL_DUR = 10000; // ms（金色ロケット表示時間をさらに延長）

    // ── パーティクルシステム ──
    const fogParticles  = [];
    const goldParticles = [];
    const shockRings    = [];
    const starSparkles  = [];
    const energySparks  = [];

    function spawnFog(count, baseR, color, spread, vy_bias) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random()*Math.PI*2;
        const dist  = Math.random()*spread;
        fogParticles.push({
          x: cx + Math.cos(angle)*dist,
          y: cy + Math.sin(angle)*dist,
          vx: (Math.random()-0.5)*0.6,
          vy: (Math.random()-0.5)*0.5 + (vy_bias||0),
          r: baseR + Math.random()*baseR*1.8,
          life: 1.0,
          decayRate: 0.008 + Math.random()*0.006,
          color,
        });
      }
    }

    function spawnGoldBurst() {
      for (let i = 0; i < 40; i++) {
        const angle = Math.random()*Math.PI*2;
        const spd   = 2.0 + Math.random()*6.0;
        goldParticles.push({
          x: cx, y: cy,
          vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd - 1.5,
          life: 1.0, r: 2+Math.random()*4,
          color: ['#ffd700','#fff8a0','#ffcc00','#ffffff','#ffaa00'][Math.floor(Math.random()*5)],
        });
      }
      // エネルギースパーク（長い線）
      for (let i = 0; i < 18; i++) {
        const angle = (i/18)*Math.PI*2;
        const spd   = 4+Math.random()*8;
        energySparks.push({
          x: cx, y: cy,
          vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd,
          len: 20+Math.random()*40,
          life: 1.0, decay: 0.035+Math.random()*0.02,
          color: i%2===0 ? '#ffe840' : '#ffffff',
        });
      }
      // 衝撃波リング
      shockRings.push({ r: 5, life: 1.0, maxR: CW*0.7, color: 'rgba(255,240,80,' });
      shockRings.push({ r: 5, life: 1.0, maxR: CW*0.5, color: 'rgba(255,255,200,' });
      setTimeout(() => shockRings.push({ r: 5, life: 1.0, maxR: CW*0.6, color: 'rgba(255,180,40,' }), 180);
    }

    function drawStar4(x, y, size, rot, alpha) {
      gc.save(); gc.globalAlpha = alpha;
      gc.translate(x, y); gc.rotate(rot);
      gc.fillStyle = '#fffaaa'; gc.shadowColor = '#ffd700'; gc.shadowBlur = 8;
      gc.beginPath();
      for (let i = 0; i < 4; i++) {
        const a = (i/4)*Math.PI*2;
        const a1 = a + Math.PI/4;
        const r0 = size, r1 = size*0.18;
        i===0 ? gc.moveTo(Math.cos(a)*r0, Math.sin(a)*r0)
              : gc.lineTo(Math.cos(a)*r0, Math.sin(a)*r0);
        gc.lineTo(Math.cos(a1)*r1, Math.sin(a1)*r1);
      }
      gc.closePath(); gc.fill(); gc.restore();
    }

    // 【修正④⑤】金色ロケット（rocket2.webp）のキャッシュ
    // rocket2.webpは背景無色ファイルなのでmultiply合成せず、そのまま描画する
    // （multiply合成すると黒背景のように金色になってしまうため削除）
    let goldenCanvas = null;
    function buildGoldenRocket() {
      if (goldenCanvas) return goldenCanvas;
      // rocket2が読み込み済みならそのまま使う、なければrocket1を使う
      const src = (rocket2Img.complete && rocket2Img.naturalWidth) ? rocket2Img : rocketImg;
      if (!src.complete || !src.naturalWidth) return null;
      // オフスクリーンCanvasにそのまま描画（色変更なし）
      const oc = document.createElement('canvas');
      oc.width = RW; oc.height = RH;
      const c2 = oc.getContext('2d');
      c2.imageSmoothingEnabled = true;
      c2.imageSmoothingQuality = 'medium';
      c2.drawImage(src, 0, 0, RW, RH);
      goldenCanvas = oc;
      return oc;
    }

    let burstFired = false;
    let fogDensity = 0;
    let sparkleTimer = 0;
    let lastT = 0;

    function frame(ts) {
      if (!startT) startT = ts;
      const elapsed = ts - startT;
      const t = Math.min(1, elapsed / TOTAL_DUR);
      const rawDt = (ts - (startT + lastT * TOTAL_DUR)) / 1000;
      lastT = t;

      gc.clearRect(0, 0, CW, CH);

      // ── 背景：宇宙（暗→ミドル） ──
      const bgG = gc.createRadialGradient(cx, cy, 0, cx, cy, CW);
      bgG.addColorStop(0,   'rgba(10,5,25,1)');
      bgG.addColorStop(0.5, 'rgba(4,2,12,1)');
      bgG.addColorStop(1,   'rgba(0,0,5,1)');
      gc.fillStyle = bgG;
      gc.fillRect(0, 0, CW, CH);

      // 背景の星
      const now = ts;
      for (let i = 0; i < 80; i++) {
        const sx = (Math.sin(i*137.5+0.1)*0.5+0.5)*CW;
        const sy = (Math.sin(i*97.3+0.3)*0.5+0.5)*CH;
        const sa = 0.3 + 0.4*Math.abs(Math.sin(now*0.001*((i%5)*0.3+0.8)+i));
        gc.save(); gc.globalAlpha = sa;
        gc.fillStyle = '#ffffff';
        gc.beginPath(); gc.arc(sx, sy, 0.5+Math.sin(i)*0.3, 0, Math.PI*2); gc.fill();
        gc.restore();
      }

      // ── Phase 1 (0.00-0.15): ロケット登場 ──
      const p1 = Math.min(1, t / 0.15);
      const easeP1 = 1 - Math.pow(1-p1, 3);
      const entryY = CH + 120 - (CH + 120 - cy) * easeP1;
      const rocketAlpha = Math.min(1, p1 * 4);

      // ── 霧密度制御 ──
      if      (t < 0.15) fogDensity = 0;
      else if (t < 0.38) fogDensity = (t - 0.15) / 0.23;
      else if (t < 0.58) fogDensity = 1.0;
      else if (t < 0.72) fogDensity = 1.0 - (t - 0.58) / 0.14 * 0.8;  // 少し残す
      else if (t < 0.86) fogDensity = 0.2 * (1 - (t-0.72)/0.14);
      else               fogDensity = 0;

      // 霧スポーン
      if (t > 0.13 && t < 0.86 && Math.random() < fogDensity * 0.5 + 0.04) {
        const isGold = t > 0.58;
        const col = isGold
          ? `rgba(255,${Math.round(180+fogDensity*60)},40,`
          : `rgba(160,200,255,`;
        spawnFog(1, 25 + fogDensity*30, col, 55 + fogDensity*55, -0.1);
      }

      // 霧パーティクル更新・描画
      for (let i = fogParticles.length-1; i >= 0; i--) {
        const fp = fogParticles[i];
        fp.x += fp.vx; fp.y += fp.vy;
        fp.life -= fp.decayRate;
        if (fp.life <= 0) { fogParticles.splice(i,1); continue; }
        const la = fogDensity * fp.life * 0.38;
        gc.save(); gc.globalAlpha = la;
        const rg = gc.createRadialGradient(fp.x, fp.y, 0, fp.x, fp.y, fp.r);
        rg.addColorStop(0, fp.color + '0.6)');
        rg.addColorStop(0.5, fp.color + '0.3)');
        rg.addColorStop(1, fp.color + '0)');
        gc.fillStyle = rg;
        gc.beginPath(); gc.arc(fp.x, fp.y, fp.r*(0.4+fp.life*0.6), 0, Math.PI*2); gc.fill();
        gc.restore();
      }

      // ── Phase 変換爆発 (0.58) ──
      if (t >= 0.58 && !burstFired) {
        burstFired = true;
        spawnGoldBurst();
      }

      // 衝撃波
      for (let i = shockRings.length-1; i >= 0; i--) {
        const sr = shockRings[i];
        sr.r += sr.maxR * 0.04;
        sr.life -= 0.04;
        if (sr.r > sr.maxR || sr.life <= 0) { shockRings.splice(i,1); continue; }
        const prog = sr.r / sr.maxR;
        gc.save();
        gc.strokeStyle = `${sr.color}${sr.life * 0.9})`;
        gc.lineWidth = Math.max(1, (1-prog) * 8);
        gc.shadowColor = 'rgba(255,220,0,1)'; gc.shadowBlur = 12;
        gc.beginPath(); gc.arc(cx, cy, sr.r, 0, Math.PI*2); gc.stroke();
        gc.restore();
      }

      // エネルギースパーク
      for (let i = energySparks.length-1; i >= 0; i--) {
        const es = energySparks[i];
        es.x += es.vx; es.y += es.vy;
        es.vx *= 0.94; es.vy *= 0.94;
        es.life -= es.decay;
        if (es.life <= 0) { energySparks.splice(i,1); continue; }
        gc.save(); gc.globalAlpha = es.life;
        gc.strokeStyle = es.color; gc.lineWidth = es.life * 2;
        gc.shadowColor = '#ffd700'; gc.shadowBlur = 6;
        gc.beginPath();
        gc.moveTo(es.x, es.y);
        gc.lineTo(es.x - es.vx * es.len * 0.08, es.y - es.vy * es.len * 0.08);
        gc.stroke(); gc.restore();
      }

      // 金色パーティクル
      for (let i = goldParticles.length-1; i >= 0; i--) {
        const p = goldParticles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.05;
        p.vx *= 0.97; p.vy *= 0.97;
        p.life -= 0.022;
        if (p.life <= 0) { goldParticles.splice(i,1); continue; }
        gc.save(); gc.globalAlpha = p.life * 0.9;
        gc.shadowColor = '#ffd700'; gc.shadowBlur = 8;
        gc.fillStyle = p.color;
        gc.beginPath(); gc.arc(p.x, p.y, p.r*p.life, 0, Math.PI*2); gc.fill();
        gc.restore();
      }

      // きらきら★（Phase4以降）
      sparkleTimer += 16;
      if (t >= 0.72 && t < 0.97 && sparkleTimer > 100+Math.random()*120) {
        sparkleTimer = 0;
        const a = Math.random()*Math.PI*2;
        const d = 35+Math.random()*75;
        starSparkles.push({ x:cx+Math.cos(a)*d, y:cy+Math.sin(a)*d*0.7, life:1.0, size:5+Math.random()*9, rot:Math.random()*Math.PI, rotV:(Math.random()-0.5)*0.18 });
      }
      for (let i = starSparkles.length-1; i >= 0; i--) {
        const s = starSparkles[i];
        s.life -= 0.03; s.rot += s.rotV;
        if (s.life <= 0) { starSparkles.splice(i,1); continue; }
        drawStar4(s.x, s.y, s.size*s.life, s.rot, s.life*0.95);
      }

      // ── ロケット描画 ──
      gc.save();
      gc.translate(cx, entryY);

      const showGolden   = t >= 0.72;
      const goldReveal   = t >= 0.72 ? Math.min(1, (t - 0.72) / 0.16) : 0;
      const fogCoverAlpha = t >= 0.38 && t < 0.86
        ? Math.min(1, fogDensity * 1.5) : 0;

      // 通常ロケット（rocket.webp）- 変換前
      if (!showGolden || goldReveal < 1) {
        const srcImg = rocketImg.complete && rocketImg.naturalWidth ? rocketImg : null;
        if (srcImg) {
          gc.globalAlpha = rocketAlpha * (showGolden ? (1-goldReveal) : 1) * (1-fogCoverAlpha*0.85);
          gc.imageSmoothingEnabled = true; gc.imageSmoothingQuality = 'medium';
          // 軽いシマー（霧フェーズ）
          if (fogDensity > 0.3 && !showGolden) {
            gc.shadowColor = 'rgba(120,200,255,0.8)';
            gc.shadowBlur  = 16 * fogDensity;
          }
          gc.drawImage(srcImg, RX, RY, RW, RH);
        }
      }

      // 金色ロケット（rocket2.webp）- 変換後
      if (showGolden) {
        const goldenOC = buildGoldenRocket();
        if (goldenOC) {
          gc.globalAlpha = rocketAlpha * goldReveal;
          gc.imageSmoothingEnabled = true; gc.imageSmoothingQuality = 'medium';
          // ゴールドグロー
          gc.shadowColor = `rgba(255,200,0,${goldReveal})`;
          gc.shadowBlur  = 32 * goldReveal;
          gc.drawImage(goldenOC, RX, RY, RW, RH);
          // 追加グロー（2重）
          gc.save();
          gc.shadowColor = 'rgba(255,240,100,0.8)';
          gc.shadowBlur  = 18 * goldReveal;
          gc.globalAlpha = rocketAlpha * goldReveal * 0.4;
          const src2 = rocket2Img.complete && rocket2Img.naturalWidth ? rocket2Img : rocketImg;
          gc.drawImage(src2, RX, RY, RW, RH);
          gc.restore();
        }
      }
      gc.restore();

      // 変換フラッシュ（t≈0.58）- shadowをリセットしてから描画（金色四角形バグ防止）
      if (t >= 0.55 && t < 0.68) {
        const ft = (t - 0.55) / 0.13;
        const fa = Math.sin(ft * Math.PI) * 0.85;
        gc.save();
        gc.shadowBlur = 0; gc.shadowColor = 'transparent';
        gc.fillStyle = `rgba(255,240,120,${fa})`;
        gc.fillRect(0, 0, CW, CH);
        gc.restore();
      }

      // ── テキスト ──
      gc.save();
      gc.textAlign = 'center';
      // 「進化中...」霧フェーズ
      if (t >= 0.20 && t < 0.62) {
        const ta = Math.min(1,(t-0.20)/0.10) * (1-Math.max(0,(t-0.54)/0.08));
        gc.globalAlpha = ta;
        gc.font = "bold 13px -apple-system,'Hiragino Sans',sans-serif";
        gc.shadowColor = 'rgba(120,200,255,0.9)'; gc.shadowBlur = 12;
        gc.fillStyle = 'rgba(200,235,255,0.95)';
        gc.fillText('✦ 進化中... ✦', cx, cy + RY - 30);
      }
      // 「GOLDEN ROCKET」- 金色ロケット表示中（t=0.74〜0.97）に表示（長めに）
      if (t >= 0.74 && t < 0.97) {
        const ta = Math.min(1,(t-0.74)/0.06) * (1-Math.max(0,(t-0.93)/0.04));
        gc.globalAlpha = ta;
        gc.font = `bold ${Math.round(CW*0.054)}px -apple-system,'Hiragino Sans',sans-serif`;
        gc.shadowColor = 'rgba(255,180,0,1)'; gc.shadowBlur = 24;
        const tg = gc.createLinearGradient(cx-90, 0, cx+90, 0);
        tg.addColorStop(0, '#ffe066'); tg.addColorStop(0.45, '#ffffff'); tg.addColorStop(1, '#ffcc00');
        gc.fillStyle = tg;
        gc.fillText('✦ GOLDEN ROCKET ✦', cx, cy + RY - 32);
        gc.shadowBlur = 0;
        gc.font = `bold ${Math.round(CW*0.034)}px -apple-system,'Hiragino Sans',sans-serif`;
        gc.fillStyle = `rgba(255,220,100,${ta})`;
        gc.fillText('地球へ帰還せよ', cx, cy + RY - 14);
      }
      gc.restore();

      // ── 終了フェードアウト（t=0.96〜1.0）──
      if (t > 0.96) {
        const fa = (t - 0.96) / 0.04;
        gc.save();
        gc.shadowBlur = 0;
        gc.fillStyle = `rgba(0,3,12,${fa})`;
        gc.fillRect(0, 0, CW, CH);
        gc.restore();
      }

      if (t < 1.0) {
        requestAnimationFrame(frame);
      } else {
        overlay.classList.remove('active');
        gc.clearRect(0, 0, CW, CH);
        stageIdx = 7;
        state = 'launch_anim'; // golden_transformを解除してからstartStageへ
        document.getElementById('startBtn').classList.add('hidden');
        // 修正②で隠したheartPlanet/orbitPathを元に戻す（startStageが上書きするので問題なし）
        const _hp2 = document.getElementById('heartPlanet');
        if(_hp2) _hp2.style.display = '';
        const _op2 = document.getElementById('orbitPath');
        if(_op2) _op2.style.display = '';
        const hpw = document.getElementById('heartPlanetWrap');
        if(hpw) hpw.style.display = 'none';
        // 【修正⑥】ミッション8開始時に発射音を鳴らす
        _triggerLaunchAudio();
        startStage(7);
      }
    }
    requestAnimationFrame(frame);
  })();
});

// =============================
// 全クリア時にお祝い表示を呼ぶ
// =============================
// all_clear への遷移はゲームループ内で直接 showCelebration() を呼ぶようにしたため、
// updateBtn フックでの二重呼び出しは行わない。
let _prevState = state;
const _origUpdateBtn = updateBtn;
updateBtn = function() {
  _origUpdateBtn();
  _prevState = state;
};


// バックグラウンド時: ゲームを一時停止し、全音声も停止する
let _bgmWasPlaying = false;
let _bgmWasFile = null;
let _bgmWasTime = 0;

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    // --- バックグラウンド: 全音声を止め、ゲームを一時停止 ---
    _pausedByVisibility = true;

    // BGM停止（復帰時に再開するため状態を保存）
    _bgmWasFile = currentBgmFile;
    _bgmWasTime = bgm.currentTime;
    _bgmWasPlaying = !bgm.paused && !!currentBgmFile;
    if (!bgm.paused) bgm.pause();

    // ループSE停止
    try {
      const ufoEl = document.getElementById('seUfoLoopEl');
      if (ufoEl && !ufoEl.paused) ufoEl.pause();
      const bhEl = document.getElementById('seBhLoopEl');
      if (bhEl && !bhEl.paused) bhEl.pause();
    } catch(e) {}

  } else {
    // --- フォアグラウンド: ゲームを再開 ---
    _pausedByVisibility = false;

    // BGM再開（stopBgm()後はcurrentBgmFile===nullなので再開しない）
    if (_bgmWasPlaying && _bgmWasFile && currentBgmFile === _bgmWasFile) {
      bgm.currentTime = _bgmWasTime;
      _bgmPlayPromise = bgm.play();
      if (_bgmPlayPromise) {
        _bgmPlayPromise
          .then(() => { _bgmPlayPromise = null; })
          .catch(() => { _bgmPlayPromise = null; });
      }
    }

    // ループSE再開
    try {
      if (_ufoLoopNodes) {
        const ufoEl = document.getElementById('seUfoLoopEl');
        if (ufoEl && ufoEl.paused) { const p = ufoEl.play(); if (p) p.catch(()=>{}); }
      }
      if (_bhLoopNodes) {
        const bhEl = document.getElementById('seBhLoopEl');
        if (bhEl && bhEl.paused) { const p = bhEl.play(); if (p) p.catch(()=>{}); }
      }
    } catch(e) {}

    _bgmWasPlaying = false;
    _bgmWasFile = null;
  }
});


// startBtn の pointerdown でメディア解放 + 発射音を即時再生（Android対策）
// キャプチャフェーズ（true）で実行することで、後続ハンドラより先に play() を呼ぶ
document.getElementById('startBtn').addEventListener('pointerdown', () => {
  unlockAudio();
  _triggerLaunchAudio();
}, true);// 起動時にミッション1の背景キャッシュを事前生成
try { buildStarCaches(STAGES[0].bgHue, 0); } catch(e){}

// 拍動開始ボタン削除済み：起動時にそのままスタート画面を表示
_audioUnlocked = false; // タップで解除
window._preBeatActive = false;

lastTime=performance.now();
requestAnimationFrame(loop);
</script>
