<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>心音の旅　心臓星を目指して</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}

html, body {
  width: 100%;
  height: 100%;
  background: #000008;
  overflow: hidden;
  font-family: var(--font-sans, -apple-system, sans-serif);
  -webkit-touch-callout: none;
}

/* ゲーム全体のラッパー：画面中央に縦長キャンバスを配置 */
#rw {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  /* PCではmax-widthで横が広がりすぎないようにする */
}

#rwrap {
  position: relative;
  display: inline-block;
  overflow: visible;
  /* JS側で width/height をセット */
}

#rc {
  display: block;
}

#rctrl { display: none; }

#startBtn {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: 33%;
  z-index: 10;

  /* ===== レイアウト制御（ここが重要）===== */
  display: inline-block;
  white-space: nowrap;          /* ← メインテキストを1行固定 */
  text-align: center;
  min-width: 180px;

  padding: 12px 28px;

  /* ===== 文字 ===== */
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 2px;
  line-height: 1.3;

  color: #ffffff;

  /* ===== 見た目 ===== */
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 999px;
  cursor: pointer;
  overflow: hidden;             /* はみ出し防止 */

  background:
    radial-gradient(circle at 50% 35%,
      rgba(180,240,255,0.9) 0%,
      rgba(0,200,255,0.95) 35%,
      rgba(0,110,255,0.95) 70%,
      rgba(0,60,180,0.95) 100%
    );

  box-shadow:
    0 0 12px rgba(0,220,255,0.55),
    0 0 30px rgba(0,220,255,0.35),
    0 10px 24px rgba(0,0,0,0.45);

  text-shadow: 0 0 8px rgba(255,255,255,0.45);

  transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
  animation: cosmicLaunch 2.5s infinite ease-in-out;
}

/* ===== コメント（2行目）を下に表示 ===== */
#startBtn span {
  display: block;       /* ← これで必ず下に配置 */
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  opacity: 0.88;
  margin-top: 2px;
}

#heartPlanetWrap {
  position: absolute;
  top: 27%;
  left: 50%;
  transform: translateX(-50%);
  width: 160px;
  height: 160px;
  z-index: 5;
}

/* 中央の心臓星 */
#heartPlanet {
  position: absolute;
  width: 110px;
  height: 110px;
  left: 50%;
  top: 50%;
  z-index: 3;
  transform-origin: center center;
  will-change: transform, filter;
  /* 実測値: 周期893ms / S1→S2=328ms(収縮) / S2→静止=261ms(拡張) / 静止304ms
     animation-delay: -164ms でS1タイミングに位相合わせ */
  animation: heartContract 893ms ease-in-out infinite;
  animation-play-state: paused;
  animation-delay: -164ms;
}

/* S1で収縮開始 → S2で拡張開始 → 静止 の1周期
   0%   = S1 (収縮スタート)
   36.7%= S2 (収縮完了・拡張スタート)  ← 328/893
   66.0%= 拡張完了・静止スタート       ← (328+261)/893
   100% = 次のS1直前 (静止のまま) */
@keyframes heartContract {
  0%    {
    transform: translate(-50%, -50%) scale(1.0);
    filter: drop-shadow(0 0 8px rgba(255,215,60,0.55));
  }
  36.7% {
    transform: translate(-50%, -50%) scale(0.82);
    filter: drop-shadow(0 0 20px rgba(255,200,40,0.90));
  }
  66.0% {
    transform: translate(-50%, -50%) scale(1.0);
    filter: drop-shadow(0 0 8px rgba(255,215,60,0.55));
  }
  100%  {
    transform: translate(-50%, -50%) scale(1.0);
    filter: drop-shadow(0 0 8px rgba(255,215,60,0.55));
  }
}

/* 公転軌道 */
#orbitPath {
  position: absolute;
  inset: 0;
  animation: orbitAround 8s linear infinite;
  transform-origin: center center;
}

/* 聴診器本体 */
#orbitStethoscope {
  position: absolute;
  width: 70px;
  height: auto;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) translateY(-65px) rotate(133deg);
  z-index: 6;
  opacity: 1;
  filter:
    drop-shadow(0 0 4px rgba(255,255,255,0.9))
    drop-shadow(0 0 10px rgba(200,220,255,0.6))
    drop-shadow(0 0 20px rgba(150,180,255,0.35));
}

/* 軌跡リング */
#orbitPath::before {
  content: "";
  position: absolute;
  width: 130px;
  height: 130px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 0 8px rgba(255,255,255,0.05), 0 0 14px rgba(0,220,255,0.06);
}

@keyframes orbitAround {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

@keyframes stethoFaceCenter {
  from { transform: translate(-50%, -50%) translateY(-54px) rotate(180deg); }
  to   { transform: translate(-50%, -50%) translateY(-54px) rotate(-180deg); }
}

#startBtn::before {
  content: "";
  position: absolute;
  inset: -6px;
  border-radius: 999px;
  background: radial-gradient(ellipse, rgba(0,220,255,0.22) 0%, rgba(0,220,255,0.08) 60%, transparent 80%);
  z-index: -1;
}

#startBtn:hover {
  transform: translateX(-50%) scale(1.05);
  filter: brightness(1.08);
  box-shadow: 0 0 18px rgba(0,240,255,0.75), 0 0 36px rgba(0,240,255,0.45), 0 12px 28px rgba(0,0,0,0.5);
}

#startBtn:active {
  transform: translateX(-50%) scale(0.97);
}

@keyframes cosmicLaunch {
  0%, 100% {
    box-shadow: 0 0 12px rgba(0,220,255,0.5), 0 0 28px rgba(0,220,255,0.3), 0 10px 24px rgba(0,0,0,0.45);
  }
  50% {
    box-shadow: 0 0 24px rgba(120,240,255,0.9), 0 0 42px rgba(0,220,255,0.45), 0 10px 24px rgba(0,0,0,0.45);
  }
}

#startBtn.hidden { display: none; }

/* ===== お祝いオーバーレイ ===== */
#celebrationOverlay {
  display: none;
  position: absolute;
  inset: 0;
  z-index: 100;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 40%, #0d0030 0%, #000818 60%, #000005 100%);
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#celebrationOverlay.active { display: flex; }

#celebBgCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

#journeyReplay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  opacity: 0;
  animation: journeyFadeOut 1.0s ease 2.8s forwards;
}
@keyframes journeyFadeOut {
  0%   { opacity:1; }
  100% { opacity:0; }
}
#journeyTrail {
  display: flex;
  align-items: center;
  gap: 0;
  position: absolute;
  white-space: nowrap;
  animation: journeySweep 2.6s cubic-bezier(0.25,0.1,0.25,1) forwards;
}
@keyframes journeySweep {
  0%   { transform: translateX(420px); opacity:0; }
  12%  { opacity:1; }
  80%  { opacity:1; }
  100% { transform: translateX(-420px); opacity:0; }
}
.journey-planet { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; image-rendering: high-quality; }
.journey-saturn { width: 46px; height: 28px; border-radius: 0; flex-shrink: 0; }
.journey-line   { width: 18px; height: 2px; flex-shrink: 0; opacity: 0.5; }
.journey-rocket { font-size: 18px; margin: 0 6px; display: inline-block; animation: rocketBob 0.5s ease-in-out infinite alternate; }
@keyframes rocketBob {
  from { transform: translateY(-2px); }
  to   { transform: translateY(2px); }
}

#arrivalFlash {
  position: absolute;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
  /* flashBurst削除：白い空白を出さない */
}
@keyframes flashBurst {
  0%   { opacity: 0; }
  100% { opacity: 0; }
}

#mergeArea {
  position: relative;
  width: 220px;
  height: 220px;
  flex-shrink: 0;
  opacity: 1;
}

.glow-ring {
  position: absolute;
  left: 50%; top: 50%;
  border-radius: 50%;
  transform: translate(-50%,-50%);
  border: 1.5px solid;
  pointer-events: none;
  opacity: 0;
}
#ring1 { width: 130px; height: 130px; border-color: rgba(255,200,100,0.6); animation: ringPulse 2.0s ease-out 0s infinite; }
#ring2 { width: 160px; height: 160px; border-color: rgba(255,120,180,0.4); animation: ringPulse 2.0s ease-out 0.25s infinite; }
#ring3 { width: 195px; height: 195px; border-color: rgba(120,180,255,0.25); animation: ringPulse 2.0s ease-out 0.5s infinite; }
@keyframes ringPulse {
  0%   { transform: translate(-50%,-50%) scale(0.9); opacity:0.8; }
  60%  { opacity:0.5; }
  100% { transform: translate(-50%,-50%) scale(1.25); opacity:0; }
}

#celebHeart {
  position: absolute;
  left: 50%; top: 50%;
  width: 120px;
  height: auto;
  transform: translate(-50%, -50%) scale(1.0);
  opacity: 1;
  filter:
    drop-shadow(0 0 18px rgba(255,200,60,0.9))
    drop-shadow(0 0 40px rgba(255,160,20,0.6))
    drop-shadow(0 0 70px rgba(220,120,0,0.3));
}
@keyframes celebHeartBeat {
  0%    { transform: translate(-50%, -50%) scale(1.0); }
  36.7% { transform: translate(-50%, -50%) scale(0.82); }
  66.0% { transform: translate(-50%, -50%) scale(1.0); }
  100%  { transform: translate(-50%, -50%) scale(1.0); }
}
@keyframes heartGrandEntrance {
  0%   { transform: translate(-50%,-50%) scale(0) rotate(-15deg); opacity:0; }
  50%  { transform: translate(-50%,-50%) scale(1.25) rotate(5deg);  opacity:1; }
  70%  { transform: translate(-50%,-50%) scale(0.92) rotate(-2deg); opacity:1; }
  85%  { transform: translate(-50%,-50%) scale(1.08) rotate(1deg);  opacity:1; }
  100% { transform: translate(-50%,-50%) scale(1.0)  rotate(0deg);  opacity:1; }
}

/* 勲章（meister.webp）専用：傾きなし・まっすぐ登場 */
@keyframes meisterEntrance {
  0%   { transform: translate(-50%,-50%) scale(0);    opacity:0; }
  50%  { transform: translate(-50%,-50%) scale(1.22); opacity:1; }
  70%  { transform: translate(-50%,-50%) scale(0.93); opacity:1; }
  85%  { transform: translate(-50%,-50%) scale(1.06); opacity:1; }
  100% { transform: translate(-50%,-50%) scale(1.0);  opacity:1; }
}

#celebStetho {
  position: absolute;
  left: 50%; top: 50%;
  width: 130px;
  height: auto;
  transform-origin: center center;
  transform: translate(-50%,-50%) translate(48px, 40px) rotate(385deg) scale(1.0);
  opacity: 1;
  filter:
    drop-shadow(0 0 5px rgba(255,255,255,1))
    drop-shadow(0 0 14px rgba(200,230,255,0.8))
    drop-shadow(0 0 28px rgba(150,190,255,0.5));
}
@keyframes stethoOrbit {
  0%   { transform:translate(-50%,-50%) translateY(-82px) rotate(0deg)   scale(1.0); opacity:1; }
  25%  { transform:translate(-50%,-50%) translateY(-82px) rotate(90deg)  scale(1.0); opacity:1; }
  50%  { transform:translate(-50%,-50%) translateY(-82px) rotate(180deg) scale(1.0); opacity:1; }
  75%  { transform:translate(-50%,-50%) translateY(-82px) rotate(270deg) scale(1.0); opacity:1; }
  100% { transform:translate(-50%,-50%) translateY(-82px) rotate(360deg) scale(1.0); opacity:1; }
}
@keyframes stethoSettle {
  0%   { transform:translate(-50%,-50%) translateY(-82px) rotate(360deg) scale(1.0); opacity:1; }
  60%  { transform:translate(-50%,-50%) translate(52px, 42px) rotate(390deg) scale(1.1); opacity:1; }
  100% { transform:translate(-50%,-50%) translate(48px, 40px) rotate(385deg) scale(1.0); opacity:1; }
}

#mergeFlash {
  position: absolute; left: 50%; top: 50%;
  width: 0; height: 0; border-radius: 50%;
  transform: translate(-50%,-50%);
  background: transparent;
  border: 6px solid rgba(255,240,120,0);
  animation: mergeFlashAnim 0.7s ease-out 0s forwards;
  pointer-events: none;
}
@keyframes mergeFlashAnim {
  0%   { width:0;     height:0;     border-color:rgba(255,240,120,1);   border-width:8px; }
  100% { width:260px; height:260px; border-color:rgba(255,240,120,0);   border-width:1px; }
}
#mergeFlash2 {
  position: absolute; left: 50%; top: 50%;
  width: 0; height: 0; border-radius: 50%;
  transform: translate(-50%,-50%);
  background: transparent;
  border: 4px solid rgba(255,160,220,0);
  animation: mergeFlashAnim2 0.9s ease-out 0.15s forwards;
  pointer-events: none;
}
@keyframes mergeFlashAnim2 {
  0%   { width:0;     height:0;     border-color:rgba(255,160,220,0.9); border-width:5px; }
  100% { width:300px; height:300px; border-color:rgba(255,160,220,0);   border-width:1px; }
}

#celebTitle {
  margin-top: 14px;
  font-size: 20px; font-weight: 900; color: #fff;
  text-align: center; letter-spacing: 3px; line-height: 1.3;
  text-shadow: 0 0 16px rgba(255,220,80,1), 0 0 36px rgba(255,160,40,0.8), 0 0 60px rgba(255,80,20,0.4);
}
@keyframes titleBlast {
  from { opacity:0; transform: scale(0.6) translateY(20px); letter-spacing:8px; }
  to   { opacity:1; transform: scale(1)   translateY(0);    letter-spacing:3px; }
}

#celebSub {
  margin-top: 8px;
  font-size: 12px; color: rgba(200,230,255,0.95);
  text-align: center; letter-spacing: 1px; line-height: 1.7;
}

#celebClose {
  margin-top: 18px; padding: 11px 36px;
  font-size: 14px; font-weight: 800; color: #fff;
  background: linear-gradient(135deg, #ff5599 0%, #cc2277 50%, #880055 100%);
  border: 1px solid rgba(255,180,220,0.5); border-radius: 999px;
  cursor: pointer; letter-spacing: 1.5px;
  box-shadow: 0 0 18px rgba(255,80,150,0.7), 0 0 40px rgba(255,40,120,0.35), 0 4px 16px rgba(0,0,0,0.5);
  transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
  width: 80%; box-sizing: border-box; display: block; margin-left: auto; margin-right: auto;
}
#celebClose:hover {
  transform: scale(1.06); filter: brightness(1.15);
  box-shadow: 0 0 28px rgba(255,120,180,0.9), 0 0 55px rgba(255,60,140,0.5);
}

/* ミッション7/8クリア後：2ボタン共通レイアウト */
#secretMissionBtn, #celebMission1Btn {
  display: block;
  margin: 12px auto 0;   /* celebCloseと同じgap */
  padding: 11px 36px;    /* celebCloseと同じサイズ */
  font-size: 14px; font-weight: 800; color: #fff;
  border-radius: 999px;
  cursor: pointer; letter-spacing: 1.5px;
  transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
  width: 80%; box-sizing: border-box;
}
#secretMissionBtn {
  background: linear-gradient(135deg, #4488ff 0%, #1144cc 50%, #002288 100%);
  border: 1px solid rgba(100,180,255,0.5);
  box-shadow: 0 0 18px rgba(60,140,255,0.7), 0 0 40px rgba(40,100,255,0.35), 0 4px 16px rgba(0,0,0,0.5);
}
#secretMissionBtn:hover {
  transform: scale(1.06); filter: brightness(1.15);
  box-shadow: 0 0 28px rgba(80,160,255,0.9), 0 0 55px rgba(60,120,255,0.5);
}
#celebMission1Btn {
  background: linear-gradient(135deg, #44cc88 0%, #119944 50%, #006622 100%);
  border: 1px solid rgba(80,200,140,0.5);
  box-shadow: 0 0 18px rgba(40,180,100,0.7), 0 4px 16px rgba(0,0,0,0.5);
}
#celebMission1Btn:hover {
  transform: scale(1.06); filter: brightness(1.15);
}

@keyframes fadeSlideUp {
  from { opacity:0; transform: translateY(14px); }
  to   { opacity:1; transform: translateY(0); }
}

.confetti {
  position: absolute;
  pointer-events: none;
  animation: confettiFall linear forwards;

// 円形に切り抜いたオフスクリーンCanvas（通常惑星用）
function makeRoundImg(img, diameter) {
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const sq = Math.min(iw, ih);
  // 元画像より大きなCanvasに引き伸ばさない（ぼやけ防止）
  const d = Math.min(diameter, sq);
  const oc = document.createElement('canvas');
  oc.width = oc.height = d;
  const c = oc.getContext('2d');
  c.imageSmoothingEnabled = true; 
  c.imageSmoothingQuality = 'medium';
  c.beginPath(); 
  c.arc(d / 2, d / 2, d / 2, 0, Math.PI * 2); 
  c.clip();
  c.drawImage(img, (iw - sq) / 2, (ih - sq) / 2, sq, sq, 0, 0, d, d);
  return oc;
}

// 土星専用：リングを含む横長画像をそのままキャッシュ（クリップなし）
// isSaturnLike=true の惑星は drawPlanet で特別扱い
function makeSaturnImg(img, diameter) {
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const aspect = iw / Math.max(ih, 1);
  // 元画像より大きく引き伸ばさない（ぼやけ防止）
  const d = Math.min(diameter, ih);
  const cw = Math.round(d * Math.max(aspect, 1.8));
  const ch = Math.round(cw / aspect);
  const oc = document.createElement('canvas');
  oc.width = cw; oc.height = ch;
  oc._isSaturn = true;
  oc._planetR = d / 2; // 惑星本体の半径（リング除く）
  const c = oc.getContext('2d');
  c.imageSmoothingEnabled = true;
  c.imageSmoothingQuality = 'medium';
  c.drawImage(img, 0, 0, cw, ch);
  return oc;
}

    pool = BLOCK_TYPES.filter(b => b.mission === stageId);
  }
  if (pool.length === 0) return BLOCK_TYPES[0];
  return pool[Math.floor(Math.random() * pool.length)];
}

// 心音ファイルを再生する（同じファイルが既に再生中なら何もしない）
function playBgm(soundFile) {
  if (!soundFile) return;
  const targetSrc = new URL('sound/' + soundFile, location.href).href;
  if (currentBgmFile === soundFile && !bgm.paused) return;

  // iOS対策: play()中にpause()→src変更しないよう、既存のpromiseを先に解決してから変更
  const doPlay = () => {
    if (bgm.src !== targetSrc) {
      bgm.src = 'sound/' + soundFile;
      bgm.load(); // iOS: srcを変更したらloadが必要
    }
    bgm.loop        = true;
    bgm.volume      = 0.55;
    bgm.currentTime = 0;
    // iOS: play() の Promise を保存して pause() との競合を防ぐ
    _bgmPlayPromise = bgm.play();
    if (_bgmPlayPromise) {
      _bgmPlayPromise
        .then(() => { _bgmPlayPromise = null; })
        .catch((e) => { _bgmPlayPromise = null; });
    }
    currentBgmFile = soundFile;
  };

  if (_bgmPlayPromise) {
    _bgmPlayPromise.then(doPlay).catch(doPlay);
    _bgmPlayPromise = null;
  } else {
    doPlay();
  }
}

// 心音を停止する
function stopBgm() {
  // iOS: play() 完了前に pause() を呼ぶと AbortError になるため Promise 経由で停止
  const doPause = () => {
    bgm.pause();
    bgm.currentTime = 0;
    try { bgm.removeAttribute('src'); bgm.load(); } catch(e) {}
  };
  if (_bgmPlayPromise) {
    _bgmPlayPromise.then(doPause).catch(() => {});
    _bgmPlayPromise = null;
  } else {
    doPause();
  }
  currentBgmFile = null;
}

// ===== 星背景：3レイヤー オフスクリーンキャッシュ =====
// 各レイヤーは高さ H*2 のオフスクリーンCanvasにタイル描画済み。
// 毎フレームは drawImage x2 ずつ（タイルループ）のみ。
// ステージ切り替え時に bgHue に合わせて再生成する。

const STAR_LAYERS = [
  // [スクロール速度係数, 星数, 最小r, 最大r, 透明度範囲, ネビュラ描画]
  { speed: 0.08, count: 40, rMin: 0.3, rMax: 0.9, aMin: 0.25, aMax: 0.55, nebula: true  }, // 遠景
  { speed: 0.20, count: 28, rMin: 0.6, rMax: 1.3, aMin: 0.45, aMax: 0.75, nebula: false }, // 中景
  { speed: 0.42, count: 14, rMin: 1.0, rMax: 2.0, aMin: 0.65, aMax: 1.00, nebula: false }, // 近景
];

let _starCaches = [null, null, null]; // オフスクリーンCanvas x3
let _starCacheBgHue = -1;             // 最後にキャッシュ生成したhue

function buildStarCaches(bgHue, stageId) {
  const _cacheKey = bgHue * 100 + (stageId || 0);
  if (_starCacheBgHue === _cacheKey && _starCaches[0]) return;
  _starCacheBgHue = _cacheKey;
  const isFinalMission = (stageId === 6 || stageId === 7); // stageIdx=6,7 が最終/裏ミッション（同じ銀河背景）
  const isSecretMission = false; // 裏ミッション8は別ネビュラを使わない（ミッション7と同じ銀河）
  const isBrightSecret  = (stageId === 7); // stageIdx=7（ミッション8）は少し明るめにする

  STAR_LAYERS.forEach((layer, li) => {
    const TH = H * 4; // H*4でシームレスなタイルループ（切れ目なし）
    const oc = document.createElement('canvas');
    oc.width  = W;
    oc.height = TH;
    const c = oc.getContext('2d');
    c.clearRect(0, 0, W, TH);

    // ── ネビュラ/背景ムラ（遠景レイヤーのみ）
    if (layer.nebula) {
      const h1 = bgHue;
      const h2 = (bgHue + 40)  % 360;
      const h3 = (bgHue + 200) % 360;

      c.save();
      c.globalCompositeOperation = 'screen';

      if (isSecretMission) {
        // ===== 裏ミッション8：帰還テーマ ── 「地球へ戻る復路」を表現 =====
        // 暖色系の星雲が後方（上側）に広がり、青い地球の光が前方（下側）を照らすイメージ
        const nebulaBlobs = [
          { x: W*0.22, y: TH*0.08, r: W*0.60, hue:  10, a: 0.065 }, // 赤橙（出発した心臓星側）
          { x: W*0.78, y: TH*0.18, r: W*0.52, hue:  35, a: 0.055 }, // オレンジ（後方）
          { x: W*0.55, y: TH*0.32, r: W*0.50, hue:  20, a: 0.045 }, // 赤茶
          { x: W*0.15, y: TH*0.55, r: W*0.48, hue: 200, a: 0.055 }, // 青（地球方向が近づく）
          { x: W*0.70, y: TH*0.68, r: W*0.58, hue: 215, a: 0.060 }, // 水色（地球方向）
          { x: W*0.40, y: TH*0.84, r: W*0.65, hue: 210, a: 0.070 }, // 青白（到達直前）
          { x: W*0.80, y: TH*0.95, r: W*0.50, hue: 200, a: 0.065 }, // 地球の青
        ];
        c.save(); c.globalCompositeOperation = 'screen';
        for (const bl of nebulaBlobs) {
          const g = c.createRadialGradient(bl.x, bl.y, 0, bl.x, bl.y, bl.r);
          g.addColorStop(0,   `hsla(${bl.hue},70%,40%,${bl.a})`);
          g.addColorStop(0.4, `hsla(${(bl.hue+20)%360},55%,28%,${bl.a*0.6})`);
          g.addColorStop(1,   'rgba(0,0,0,0)');
          c.fillStyle = g;
          c.beginPath(); c.arc(bl.x, bl.y, bl.r, 0, Math.PI*2); c.fill();
        }
        // 帰還を示す赤い散光星雲（後方に大きく）
        { const hx=W*0.50, hy=TH*0.22;
          c.save(); c.globalCompositeOperation='screen';
          const hg=c.createRadialGradient(hx,hy,0,hx,hy,70);
          hg.addColorStop(0,  'rgba(240,60,50,0.22)');
          hg.addColorStop(0.4,'rgba(200,35,45,0.12)');
          hg.addColorStop(1,  'rgba(0,0,0,0)');
          c.save(); c.scale(1.4,1);
          c.fillStyle=hg; c.beginPath(); c.arc(hx/1.4,hy,70,0,Math.PI*2); c.fill();
          c.restore(); c.restore();
        }
        // 青白い地球方向の光（前方・大きく鮮明に）
        { const ex=W*0.50, ey=TH*0.78;
          c.save(); c.globalCompositeOperation='screen';
          const eg=c.createRadialGradient(ex,ey,0,ex,ey,100);
          eg.addColorStop(0,  'rgba(120,220,255,0.32)');
          eg.addColorStop(0.4,'rgba(70,160,240,0.18)');
          eg.addColorStop(0.75,'rgba(40,100,200,0.07)');
          eg.addColorStop(1,  'rgba(0,0,0,0)');
          c.fillStyle=eg; c.beginPath(); c.arc(ex,ey,100,0,Math.PI*2); c.fill();
          c.restore();
        }
        // 地球の光の筋（縦方向のグラデーション）－下方向に向かって青くなる感じ
        { c.save(); c.globalCompositeOperation='screen';
          const lg=c.createLinearGradient(0, TH*0.5, 0, TH*1.0);
          lg.addColorStop(0,   'rgba(0,0,0,0)');
          lg.addColorStop(0.5, 'rgba(40,100,200,0.04)');
          lg.addColorStop(1,   'rgba(80,180,255,0.09)');
          c.fillStyle=lg; c.fillRect(0, TH*0.5, W, TH*0.5);
          c.restore();
        }
        c.restore();
      } else if (isFinalMission) {
        // ===== 最終ミッション7：多彩な銀河・星雲（星座・天の川なし） =====
        // H*4キャンバスを使い、銀河をキャンバス上下端から十分離して配置
        // → タイルループ時に継ぎ目が目立たない

        // ── 銀河を描く共通関数 ──
        // type: 'elliptical'=楕円銀河, 'spiral'=渦状銀河風, 'irregular'=不規則銀河
        function drawGalaxy(cx, cy, r1, r2, rot, coreR, coreG, coreB, haloR, haloG2, haloB, coreA, haloA, starCount) {
          c.save();
          c.globalCompositeOperation = 'screen';
          c.translate(cx, cy);
          c.rotate(rot);
          // 外縁ハロー（楕円形）
          const haloGrad = c.createRadialGradient(0,0,0, 0,0, r1);
          haloGrad.addColorStop(0,   `rgba(${haloR},${haloG2},${haloB},${haloA*0.8})`);
          haloGrad.addColorStop(0.4, `rgba(${haloR},${haloG2},${haloB},${haloA*0.4})`);
          haloGrad.addColorStop(0.75,`rgba(${haloR},${haloG2},${haloB},${haloA*0.12})`);
          haloGrad.addColorStop(1,   'rgba(0,0,0,0)');
          c.scale(1, r2/r1);
          c.fillStyle = haloGrad;
          c.beginPath(); c.arc(0,0,r1,0,Math.PI*2); c.fill();
          c.restore();

          c.save();
          c.translate(cx, cy);
          c.rotate(rot);
          // 中心バルジ
          const bulge = c.createRadialGradient(0,0,0, 0,0, r1*0.38);
          bulge.addColorStop(0,   `rgba(${coreR},${coreG},${coreB},${coreA})`);
          bulge.addColorStop(0.3, `rgba(${coreR},${coreG},${coreB},${coreA*0.55})`);
          bulge.addColorStop(0.6, `rgba(${Math.round(coreR*0.7+haloR*0.3)},${Math.round(coreG*0.7+haloG2*0.3)},${Math.round(coreB*0.7+haloB*0.3)},${coreA*0.22})`);
          bulge.addColorStop(1,   'rgba(0,0,0,0)');
          c.scale(1, r2/r1);
          c.fillStyle = bulge;
          c.beginPath(); c.arc(0,0,r1*0.38,0,Math.PI*2); c.fill();
          c.restore();

          // バルジ周辺の微小星
          for (let i=0; i<starCount; i++) {
            const ang = Math.random()*Math.PI*2;
            const dist2 = Math.pow(Math.random(), 1.6) * r1 * 0.85;
            const sx = cx + Math.cos(ang)*dist2 - Math.sin(ang)*dist2*(r2/r1)*Math.cos(rot);
            const sy = cy + Math.sin(ang)*dist2*(r2/r1) + Math.cos(ang)*dist2*(r2/r1)*Math.sin(rot)*0.3;
            const brightness = 1 - dist2/(r1*0.85);
            c.globalAlpha = (0.08 + Math.random()*0.45) * brightness;
            const warm = Math.random() < 0.45;
            c.fillStyle = warm
              ? `rgba(${coreR},${Math.round(coreG*0.85)},${Math.round(coreB*0.5)},1)`
              : `rgba(${Math.round(haloR*0.8+60)},${Math.round(haloG2*0.8+60)},${Math.min(255,haloB+80)},1)`;
            c.beginPath(); c.arc(sx, sy, 0.25+Math.random()*0.55, 0, Math.PI*2); c.fill();
          }
          c.globalAlpha = 1;
        }

        // ── 銀河1: アンドロメダ銀河（M31）青白・楕円・大きめ）──
        drawGalaxy(W*0.20, TH*0.12, 68, 22, -0.42,
          255,248,220,  // コア：黄白
          180,200,255,  // ハロー：青白
          0.58, 0.12, 70);

        // ── 銀河2: 渦状銀河（NGC253風・黄橙）──
        drawGalaxy(W*0.78, TH*0.24, 55, 16, 0.65,
          255,210,140,  // コア：黄橙
          220,170,80,   // ハロー：オレンジ
          0.62, 0.10, 55);

        // ── 銀河3: 青い楕円銀河（M87風）──
        drawGalaxy(W*0.15, TH*0.42, 46, 40, 0.15,
          160,200,255,  // コア：水色
          100,150,255,  // ハロー：青
          0.55, 0.11, 40);

        // ── 銀河4: 赤みがかった楕円銀河（NGC1052風）──
        drawGalaxy(W*0.72, TH*0.55, 50, 20, -0.30,
          255,180,140,  // コア：サーモン
          200,100,80,   // ハロー：赤茶
          0.50, 0.09, 40);

        // ── 銀河5: エメラルド緑の不規則銀河（LMC風）──
        {
          const gx=W*0.35, gy=TH*0.68;
          c.save(); c.globalCompositeOperation='screen';
          // 不規則な広がり（3つのブロブで合成）
          [[0,0,55,0.16],[20,-10,32,0.12],[-18,12,28,0.10]].forEach(([dx,dy,r,a])=>{
            const g2=c.createRadialGradient(gx+dx,gy+dy,0,gx+dx,gy+dy,r);
            g2.addColorStop(0,  `rgba(120,220,180,${a})`);
            g2.addColorStop(0.5,`rgba(80,180,140,${a*0.5})`);
            g2.addColorStop(1,  'rgba(0,0,0,0)');
            c.fillStyle=g2; c.beginPath(); c.arc(gx+dx,gy+dy,r,0,Math.PI*2); c.fill();
          });
          // 輝星散りばめ
          for(let i=0;i<50;i++){
            const ang=Math.random()*Math.PI*2, d=Math.random()*48;
            c.globalAlpha=0.1+Math.random()*0.4;
            c.fillStyle=Math.random()<0.5?'rgba(180,255,220,1)':'rgba(255,255,200,1)';
            c.beginPath(); c.arc(gx+Math.cos(ang)*d, gy+Math.sin(ang)*d*0.55, 0.3+Math.random()*0.5,0,Math.PI*2); c.fill();
          }
          c.globalAlpha=1; c.restore();
        }

        // ── 銀河6: 紫の棒渦巻銀河（NGC1300風）──
        drawGalaxy(W*0.62, TH*0.80, 52, 24, 0.80,
          220,160,255,  // コア：薄紫
          170,100,230,  // ハロー：紫

        // ── 銀河7: 金色の巨大楕円銀河（M49風）──
        drawGalaxy(W*0.88, TH*0.92, 42, 36, -0.10,
          255,230,160,  // コア：金
          200,160,80,   // ハロー：黄金
          0.48, 0.09, 35);

        // ── 馬頭星雲（IC434）赤い散光星雲 ──
        {
          const hx=W*0.55, hy=TH*0.34;
          c.save(); c.globalCompositeOperation='screen';
          const hg1=c.createRadialGradient(hx,hy,0,hx,hy,44);
          hg1.addColorStop(0,  'rgba(230,55,75,0.22)');
          hg1.addColorStop(0.45,'rgba(180,35,55,0.12)');
          hg1.addColorStop(1,  'rgba(0,0,0,0)');
          c.save(); c.scale(1,1.4);
          c.fillStyle=hg1; c.beginPath(); c.arc(hx,hy/1.4,44,0,Math.PI*2); c.fill();

          const hg2=c.createRadialGradient(hx-6,hy-10,0,hx-6,hy-10,20);
          hg2.addColorStop(0,'rgba(255,100,150,0.28)');
          hg2.addColorStop(1,'rgba(0,0,0,0)');
          c.fillStyle=hg2; c.beginPath(); c.arc(hx-6,hy-10,20,0,Math.PI*2); c.fill();
          c.globalCompositeOperation='multiply';
          c.fillStyle='rgba(4,1,6,0.82)';
          c.save(); c.translate(hx+3,hy-4); c.scale(0.6,1);
          c.beginPath(); c.arc(0,0,10,0,Math.PI*2); c.fill();
          c.restore(); c.restore();
        }

        // ── オリオン大星雲（M42）青白・散光 ──
        {
          const ox=W*0.25, oy=TH*0.48;
          c.save(); c.globalCompositeOperation='screen';
          const og=c.createRadialGradient(ox,oy,0,ox,oy,48);
          og.addColorStop(0,  'rgba(200,225,255,0.38)');
          og.addColorStop(0.3,'rgba(140,185,255,0.20)');
          og.addColorStop(0.6,'rgba(160,90,200,0.08)');
          og.addColorStop(1,  'rgba(0,0,0,0)');
          c.save(); c.scale(1,0.72);
          c.fillStyle=og; c.beginPath(); c.arc(ox,oy/0.72,48,0,Math.PI*2); c.fill();
          c.restore();
          // 内部の明るいコア
          const og2=c.createRadialGradient(ox,oy,0,ox,oy,18);
          og2.addColorStop(0,  'rgba(240,250,255,0.55)');
          og2.addColorStop(0.5,'rgba(180,220,255,0.28)');
          og2.addColorStop(1,  'rgba(0,0,0,0)');
          c.fillStyle=og2; c.beginPath(); c.arc(ox,oy,18,0,Math.PI*2); c.fill();
          c.restore();
        }

        // ── わし星雲（M16）緑・散光 ──
        {
          const ex=W*0.78, ey=TH*0.62;
          c.save(); c.globalCompositeOperation='screen';
          const eg=c.createRadialGradient(ex,ey,0,ex,ey,40);
          eg.addColorStop(0,  'rgba(70,210,130,0.18)');
          eg.addColorStop(0.5,'rgba(40,160,85,0.09)');
          eg.addColorStop(1,  'rgba(0,0,0,0)');
          c.save(); c.scale(1.35,1);
          c.fillStyle=eg; c.beginPath(); c.arc(ex/1.35,ey,40,0,Math.PI*2); c.fill();
          c.restore();
          // 暗黒柱
          c.globalCompositeOperation='multiply';
          c.strokeStyle='rgba(3,8,5,0.55)'; c.lineWidth=2.5;
          c.beginPath(); c.moveTo(ex-4,ey+18); c.lineTo(ex-2,ey-14); c.stroke();
          c.beginPath(); c.moveTo(ex+8,ey+16); c.lineTo(ex+6,ey-9); c.stroke();
          c.restore();
        }

        // ── プレアデス星団（M45・すばる）青い反射星雲 ──
        {
          const pleiades=[
            {dx:0,dy:0,mag:2.9},{dx:14,dy:-9,mag:3.7},
            {dx:24,dy:6,mag:3.6},{dx:9,dy:16,mag:5.1},
            {dx:-11,dy:11,mag:4.2},{dx:-15,dy:-5,mag:5.5},
            {dx:7,dy:-18,mag:4.8},
          ];
          const px0=W*0.42, py0=TH*0.76;
          c.save(); c.globalCompositeOperation='screen';
          pleiades.forEach(st2=>{
            const sx=px0+st2.dx, sy=py0+st2.dy;
            const sr=Math.max(0.5,(6.0-st2.mag)*0.36);
            const rel=(6-st2.mag)/3.1;
            // 青い反射星雲グロー
            const pg=c.createRadialGradient(sx,sy,0,sx,sy,sr*10);
            pg.addColorStop(0,  `rgba(100,160,255,${0.20*rel})`);
            pg.addColorStop(0.5,`rgba(60,110,220,${0.08*rel})`);
            pg.addColorStop(1,  'rgba(0,0,0,0)');
            c.fillStyle=pg; c.beginPath(); c.arc(sx,sy,sr*10,0,Math.PI*2); c.fill();
            c.globalAlpha=0.92; c.fillStyle='rgba(215,235,255,1)';
            c.beginPath(); c.arc(sx,sy,sr,0,Math.PI*2); c.fill();
          });
          c.globalAlpha=1; c.restore();
        }

      } else {
        // ===== ミッション1〜6：シンプルな色ムラのみ =====
        const blobs = [
          { x: W*0.25, y: TH*0.12, r: W*0.55, hue: h1, a: 0.045 },
          { x: W*0.78, y: TH*0.28, r: W*0.45, hue: h2, a: 0.035 },
          { x: W*0.40, y: TH*0.48, r: W*0.60, hue: h3, a: 0.040 },
          { x: W*0.15, y: TH*0.65, r: W*0.50, hue: h1, a: 0.030 },
          { x: W*0.70, y: TH*0.80, r: W*0.45, hue: h2, a: 0.035 },
          { x: W*0.50, y: TH*0.95, r: W*0.50, hue: h3, a: 0.030 },
        ];
        for (const bl of blobs) {
          const g = c.createRadialGradient(bl.x, bl.y, 0, bl.x, bl.y, bl.r);
          g.addColorStop(0,   `hsla(${bl.hue},55%,35%,${bl.a})`);
          g.addColorStop(0.5, `hsla(${(bl.hue+30)%360},45%,25%,${bl.a*0.5})`);
          g.addColorStop(1,   'rgba(0,0,0,0)');
          c.fillStyle = g;
          c.beginPath(); c.arc(bl.x, bl.y, bl.r, 0, Math.PI*2); c.fill();
        }
      }

      c.restore(); // globalCompositeOperation をリセット
    }

    // ── 星を TH の範囲にランダム配置（H*4 でシームレス）
    // 全ミッション共通：ミッション8と同じ明るさ・密度
    const brightMul = 1.3;
    const starCount = Math.round(layer.count * 2 * 1.2); // H*4分
    for (let i = 0; i < starCount; i++) {
      const x = Math.random() * W;
      const y = Math.random() * TH;
      const r = layer.rMin + Math.random() * (layer.rMax - layer.rMin);
      const a = Math.min(1.0, (layer.aMin + Math.random() * (layer.aMax - layer.aMin)) * brightMul);
      if (r >= 1.2) {
        const glow = c.createRadialGradient(x, y, 0, x, y, r * 3);
        const rb = 180 + Math.random() * 30 | 0;
        glow.addColorStop(0,   `rgba(${rb},${rb},255,${Math.min(1, a * 0.6 * brightMul)})`);
        glow.addColorStop(1,   'rgba(0,0,40,0)');
        c.fillStyle = glow;
        c.beginPath(); c.arc(x, y, r * 3, 0, Math.PI * 2); c.fill();
      }
      c.globalAlpha = a;
      c.fillStyle = '#ffffff';
      c.beginPath(); c.arc(x, y, Math.max(0.5, r * 0.6), 0, Math.PI * 2); c.fill();
      c.globalAlpha = 1;
    }

    _starCaches[li] = oc;
  });
}

// --- 惑星描画（オフスクリーンをそのまま描画→真円、土星はリング付き横長） ---
function drawPlanet(cx,cy,r,alpha,canvas,fallback){
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality = 'medium';
  if(canvas){
    if(canvas._isSaturn){
      // 土星：横長画像をアスペクト比を保ったまま描画（クリップなし）
      const aspect = canvas.width / Math.max(canvas.height,1);
      const drawH = r * 2;
      const drawW = drawH * aspect;
      ctx.drawImage(canvas, 0, 0, canvas.width, canvas.height,
                    cx - drawW/2, cy - drawH/2, drawW, drawH);
    } else {
      ctx.drawImage(canvas,0,0,canvas.width,canvas.height,cx-r,cy-r,r*2,r*2);
    }
  } else {
    ctx.fillStyle=fallback; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

// ブラックホール描画
function drawBlackhole(bh) {
  bh.rot = (bh.rot || 0) + bh.rotV;
  const r = bh.r;
  const t = bh.rot * 8;
  const cx = bh.x, cy = bh.y;
  const no = bh.noiseOff || 0;

  ctx.save();

  // 1. 引力歪みライン（光の筋）- 6本に削減
  const WLINES = 6;
  for(let i = 0; i < WLINES; i++){
    const ang = (i / WLINES) * Math.PI * 2 + t * 0.15 + no * 0.01;
    const wobble = 0.04 * Math.sin(i * 1.9 + t * 3.5 + no);
    const a = ang + wobble;
    const r0 = r * (0.55 + 0.08 * Math.sin(i * 2.1 + t * 4.0));
    const r1 = r * (1.8  + 0.4  * Math.abs(Math.sin(i * 1.3 + t * 1.8 + no)));
    const ax = cx + Math.cos(a) * r0, ay = cy + Math.sin(a) * r0;
    const bx = cx + Math.cos(a) * r1, by = cy + Math.sin(a) * r1;
    const br = 0.04 + 0.07 * Math.abs(Math.sin(i * 2.3 + t * 5.5 + no));
    const wg = ctx.createLinearGradient(ax, ay, bx, by);
    wg.addColorStop(0,   `rgba(160,180,255,${br})`);
    wg.addColorStop(0.4, `rgba(100,130,220,${br*0.4})`);
    wg.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.strokeStyle = wg;
    ctx.lineWidth = 0.4 + 0.5 * Math.abs(Math.sin(i * 0.7 + t));
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
  }

  // 2. blackhole.webp 描画
  if(blackholeImg.complete && blackholeImg.naturalWidth > 0){
    // ── まずブラックホール画像を描画 ──
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(bh.rot);
    ctx.globalCompositeOperation = 'screen';
    const drawR = r * 2.4; 
    ctx.drawImage(blackholeImg, -drawR, -drawR, drawR * 2, drawR * 2);
    ctx.restore();

    // ── 画像の透明（穴）部分を覆う黒い円
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,1)';
    ctx.beginPath();
    ctx.arc(cx, cy, r * 0.88, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  } else {
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  }

  ctx.restore();
}

function updateBlackholes(dt){
  // ブラックホールはミッション５から出現、同時に1つまで、1ミッションで複数回OK
  const bhAliveNow = blackholes.some(bh => bh.alive);
  if(!bhAliveNow && state === 'playing' && st().id >= 5){
    // ミッションが進むほど出現頻度を上げる（id5→長い, id7→短い）
    const stageId = st().id; // 5〜7
    blackholeSpawnTimer -= dt;
    if(blackholeSpawnTimer <= 0){
      spawnBlackhole();
      // 次の出現までの待機時間：ステージが進むほど短く
      const baseMin = Math.max(20, 35 - (stageId - 5) * 7);  // 5→35, 6→28, 7→21
      const baseRng = Math.max(10, 20 - (stageId - 5) * 4);  // 5→20, 6→16, 7→12
      blackholeSpawnTimer = baseMin + Math.random() * baseRng;
    }
  }
  
  for(const bh of blackholes){
    if(!bh.alive) continue;
    bh.rot += bh.rotV;
    bh.phaseTimer += dt;

    if(bh.phase === 'grow'){
      const t = Math.min(1, bh.phaseTimer / bh.growDur);
      bh.r = bh.maxR * (t * t);
      if(bh.phaseTimer >= bh.growDur){
        bh.phase = 'wander';
        bh.phaseTimer = 0;
        bh.r = bh.maxR;
      }
    } else if(bh.phase === 'wander'){
      bh.wanderTimer += dt;
      if(bh.wanderTimer > 3.0 + Math.random()*2.0){
        bh.wanderVX = (Math.random()-0.5)*0.5;
        bh.wanderVY = (Math.random()-0.5)*0.3;
        bh.wanderTimer = 0;
      }
      bh.x += bh.wanderVX;
      bh.y += bh.wanderVY;
      
      // 移動制限範囲もロケットのレベル（画面下半分）に合わせて調整
      if(bh.x < bh.r*1.5){ bh.x = bh.r*1.5; bh.wanderVX = Math.abs(bh.wanderVX); }
      if(bh.x > W-bh.r*1.5){ bh.x = W-bh.r*1.5; bh.wanderVX = -Math.abs(bh.wanderVX); }
      // 上限を H*0.5、下限を H*0.85 (ロケット付近) に設定
      if(bh.y < H*0.50){ bh.y = H*0.50; bh.wanderVY = Math.abs(bh.wanderVY); }
      if(bh.y > H*0.85){ bh.y = H*0.85; bh.wanderVY = -Math.abs(bh.wanderVY); }

      if(bh.phaseTimer >= bh.wanderDur){
        bh.phase = 'shrink';
        bh.phaseTimer = 0;
      }
    } else if(bh.phase === 'shrink'){
      const t = Math.min(1, bh.phaseTimer / bh.shrinkDur);
      bh.r = bh.maxR * (1 - t * t);
      if(bh.r < 1){ bh.alive = false; }
    }
  }

  // 吸込みアニメ更新（螺旋軌道でくるくる吸い込まれる）
  for(const s of suckingObjects){
    const dx = s.bhX - s.x, dy = s.bhY - s.y;
    const dist = Math.sqrt(dx*dx+dy*dy) || 1;
    // 中心方向の引力
    const pullSpd = (1 - s.scale) * 12 + 3;
    // 接線方向の回転力（螺旋を作る）
    const perpX = -dy / dist, perpY = dx / dist;
    const swirlSpd = pullSpd * 1.4;
    s.x += dx/dist * pullSpd + perpX * swirlSpd;
    s.y += dy/dist * pullSpd + perpY * swirlSpd;
    // 近づくほど高速回転
    s.rot += 0.18 + (1 - s.scale) * 0.55;
    s.scale = Math.max(0, s.scale - dt * 1.0);
    s.alpha = Math.min(1, s.scale * 1.5);
  }
  suckingObjects = suckingObjects.filter(s => s.scale > 0);

  // ブラックホールが生きていてかつplaying中のみループ音ON
  const bhAlive = blackholes.some(bh => bh.alive);
  if (bhAlive && state === 'playing') {
    startBlackholeLoopSound();
  } else {
    stopBlackholeLoopSound();
  }
}

function checkBlackholeCollisions(dt){
  for(const bh of blackholes){
    if(!bh.alive) continue;
    const pullR2 = bh.pullR * bh.pullR;

    // ── 隕石：螺旋引き込み ──
    for(const d of debris){
      if(!d.alive) continue;
      const dx = bh.x - d.x, dy = bh.y - d.y;
      const dist2 = dx*dx + dy*dy;
      if(dist2 < pullR2){
        const dist = Math.sqrt(dist2) || 1;
        const force = 18 / dist;
        const perpX = -dy/dist, perpY = dx/dist;
        d.vx += (dx/dist * force + perpX * force * 0.5) * 0.65;
        d.vy += (dy/dist * force + perpY * force * 0.5) * 0.65;
        if(dist < bh.r * 1.1){
          d.alive = false;
          suckingObjects.push({
            x:d.x, y:d.y, bhX:bh.x, bhY:bh.y,
            rot:d.rot, origR:d.r, scale:1.0, alpha:1.0, type:'debris'
          });
        }
      }
    }

    // ── 宇宙飛行士：隕石と同様に螺旋吸込み ──
    for(const a of astronauts){
      if(!a.alive || a.mode === 'being_pulled') continue;
      const dx = bh.x - a.x, dy = bh.y - a.y;
      const dist2 = dx*dx + dy*dy;
      if(dist2 < pullR2){
        const dist = Math.sqrt(dist2) || 1;
        const force = 14 / dist;
        const perpX = -dy/dist, perpY = dx/dist;
        a.vx += (dx/dist * force + perpX * force * 0.5) * 0.55;
        a.vy += (dy/dist * force + perpY * force * 0.5) * 0.55;
        if(dist < bh.r * 1.2){
          a.alive = false;
          suckingObjects.push({
            x:a.x, y:a.y, bhX:bh.x, bhY:bh.y,
            rot:a.rot, origR:30, scale:1.0, alpha:1.0, type:'astronaut'
          });
        }
      }
    }

    // ── UFO：引力だけ受けて逃げ切る（吸込みはなし） ──
    for(const u of ufos){
      const dx = bh.x - u.x, dy = bh.y - u.y;
      const dist2 = dx*dx + dy*dy;
      if(dist2 < pullR2){
        const dist = Math.sqrt(dist2) || 1;
        const force = 10 / dist;
        // 引力は受けるが接線方向への逃げ力も加えて振り切る
        const perpX = -dy/dist, perpY = dx/dist;
        u.vx = (u.vx||0) + (dx/dist * force - perpX * force * 0.9) * 0.5;
        u.vy = (u.vy||0) + (dy/dist * force - perpY * force * 0.9) * 0.5;
        // UFOの速度を直接位置に反映（モードに関わらず押し流す）
        u.x += (u.vx||0) * 0.08;
        u.y += (u.vy||0) * 0.08;
        u.vx = (u.vx||0) * 0.85;
        u.vy = (u.vy||0) * 0.85;
        // 近づきすぎたら強制離脱
        if(dist < bh.r * 1.8){
          u.x -= dx/dist * 4;
          u.y -= dy/dist * 4;
          u.mode = 'depart';
        }
      }
    }

    // ── ロケット：引力圏の内外を問わず、BH存在中は常に引力と振動が発生 ──
    if(state === 'playing'){
      const rx = rocketX, ry = H - 90;
      const dx = bh.x - rx, dy = bh.y - ry;
      const dist = Math.max(20, Math.sqrt(dx*dx + dy*dy));
      const dirX = dx / dist; // BH方向（+1=右, -1=左）

      // 成長度（grow中は弱め）
      const growFactor = bh.phase === 'grow'
        ? Math.min(1, bh.phaseTimer / bh.growDur)
        : bh.phase === 'shrink'
          ? Math.max(0, 1 - bh.phaseTimer / bh.shrinkDur)
          : 1.0;

      // 引力：距離に反比例、画面内どこにいても最低限効く
      const pullStrength = Math.min(4.0, 120 / dist) * growFactor;
      // rocketX に直接加算（減衰・キー操作の影響を受けない純粋な引力）
      const pullPx = dirX * pullStrength;

      // 逆噴射（BH方向と逆のキーを押している）で引力を相殺
      const left  = keys['ArrowLeft']  || keys['a'] || keys['A'];
      const right = keys['ArrowRight'] || keys['d'] || keys['D'];
      const thrustingAgainst = (left && dirX > 0) || (right && dirX < 0);
      // 逆噴射中は引力をキャンセル（現在位置を保てる）
      if(!thrustingAgainst){
        rocketX = Math.max(22, Math.min(W - 22, rocketX + pullPx));
      }

      // 振動：引力圏の内外を問わず常に発生（近いほど強い）、マイルドに調整
      const distFactor = Math.min(1, 200 / dist); // 近いほど1に近い
      const shakeMag = growFactor * (1.2 + distFactor * 2.8);
      shakeX = (Math.random() - 0.5) * shakeMag * 2 + dirX * growFactor * 1.2;
      shakeY = (Math.random() - 0.5) * shakeMag;

      // 逆噴射中はエネルギー追加消費
      if(thrustingAgainst){
        energy = Math.max(0, energy - growFactor * 4.0 * dt);
        life = Math.round(energy / ENERGY_MAX * LIFE_MAX);
      }
      // 引力圏内にいるだけで微量消費
      energy = Math.max(0, energy - growFactor * 0.8 * dt);
      life = Math.round(energy / ENERGY_MAX * LIFE_MAX);

      // 本体に接触したら弾き飛ばす
      if(dist < bh.r * 1.1){
        hitFlash = 0.5;
        shakeX = (Math.random()-0.5)*16; shakeY = (Math.random()-0.5)*12;
        setTimeout(()=>{shakeX=0;shakeY=0;},250);
        rocketVX -= dirX * 320;
        rocketVX = Math.max(-300, Math.min(300, rocketVX));
        energy = Math.max(0, energy - ENERGY_BH_COST * 0.5);
        life = Math.round(energy / ENERGY_MAX * LIFE_MAX);
      }
    }
  }
}

let heartSetActive = false;
let heartSetClearTimer = 0;
const HEART_SET_WAIT = 1.0;
let lastMissedAnswer = null;
let heartSpawnCount = 0; // 現ステージでのハート出現回数 // 正解ハートを逃したときの正解ラベル
let hintDismissed = false; // 正解ハート取得時にヒントを非表示にするフラグ
let hudProgress = 0;    // 進捗バー表示用（実際の表示値）
let hudTarget   = 0;    // 進捗バーの目標値（ハート出現ごとに更新）

function spawnHeartSets(){
  if(heartSetActive) return;
  heartSetActive = true;
  heartSetClearTimer = 0;
  lastMissedAnswer = null; // 次のハート出現でリセット
  hintDismissed = false;   // 次のハート出現でヒントを再表示
  heartSpawnCount++;
  // ハート出現のたびに進捗バーの目標値を更新
  { const maxH = st().heartCount || 6;
    hudTarget = heartSpawnCount / maxH;
  }
  const vy = 0.48 + speed * 0.7;

  // ステージに対応したブロックをランダムに選ぶ
  const stageId = st().id; // 1-7
  currentBlock = getBlockForStage(stageId);

  // BGM再生（playing中のみ）
  if (state === 'playing') playBgm(currentBlock.sound);

  // 1セット = 2個（左半分に1個・右半分に1個）
  // どちらか一方がランダムで正解（黄色）
  // labels[0] → 左側, labels[1] → 右側 （ランダムにシャッフル）
  const shuffledLabels = [...currentBlock.labels];
  if (Math.random() < 0.5) shuffledLabels.reverse();
  const correctSide = shuffledLabels.indexOf(currentBlock.correct);
  const sharedY = -20;

  // 両ハートのX座標を決定（最小間隔を確保）
  const MIN_HEART_GAP = 70;
  let heartXLeft, heartXRight;
  let heartAttempts = 0;
  do {
    heartXLeft  = 30  + Math.random() * (W/2 - 20 - 30);
    heartXRight = W/2 + 30 + Math.random() * (W - 30 - (W/2 + 30));
    heartAttempts++;
  } while(heartXRight - heartXLeft < MIN_HEART_GAP && heartAttempts < 20);
  const heartXes = [heartXLeft, heartXRight];

  for(let side = 0; side < 2; side++){
    const x = heartXes[side];
    items.push({
      x, y: sharedY,
      vx: (Math.random()-0.5)*0.10, vy,
      origVx:0, origVy:vy,
      bumped:false, bumpT:0, alive:true,
      isHeart:true,
      isCorrect: (side === correctSide),
      label: shuffledLabels[side]
    });
  }
}

function updateHeartSet(dt){
  if(!heartSetActive) return;
  const alive = items.filter(it => it.isHeart && it.alive);
  if(alive.length === 0){
    heartSetActive = false;
    heartSetClearTimer = HEART_SET_WAIT;
    stopBgm(); // 両ハートが消えたらBGM停止
  }
}

function spawnHalley() {

  // 出現位置（上から）
  const x = Math.random() * W;
  const y = -60;

  // ★ ロケット位置（あなたのコードに合わせる）
  const rx = rocketX;
  const ry = H - 90;

  // ★ 少しブレを入れる（自然化）
  const targetX = rx + (Math.random() - 0.5) * 80;
  const targetY = ry + (Math.random() - 0.5) * 80;

  let dx = targetX - x;
  let dy = targetY - y;
  let dist = Math.hypot(dx, dy);

  // ★ 安全対策
  if (!isFinite(dist) || dist < 0.001) {
    dx = 0;
    dy = 1;
    dist = 1;
  }

  const speed = 1.0 + Math.random() * 0.8;

  const vx = dx / dist * speed;
  const vy = dy / dist * speed;

  halleys.push({
    x, y, vx, vy,
    r: 6 + Math.random() * 3,
    rot: Math.random() * Math.PI * 2,
    rotV: (Math.random() - 0.5) * 0.8,
    alive: true,
    trail: []
  });
}

function updateAndDrawShootingStars(dt) {
  // タイマー更新（playing / launch_anim / arrive_anim すべてで動く）
  shootingStarTimer -= dt;
  if (shootingStarTimer <= 0) {
    spawnShootingStar();
    shootingStarTimer = 4.5 + Math.random() * 15;
  }

  // ハレー彗星タイマー（ミッション2以降・playing中のみ）
  if (state === 'playing' && st().id >= 2) {
    halleyTimer -= dt;
    if (halleyTimer <= 0 && halleys.length < 2) {
      spawnHalley();
      playHalleyAppearSE();
    }
    if (halleyTimer <= 0) {
      // ミッションが進むほど間隔を短縮
      // id=2: 22〜32秒、id=3: 18〜26秒、id=4: 14〜20秒
      // id=5: 11〜16秒、id=6: 8〜13秒、id=7: 6〜10秒
      const sid = st().id;
      const base = Math.max(6,  28 - (sid - 2) * 4.0);
      const rng  = Math.max(4,  10 - (sid - 2) * 1.0);
      halleyTimer = base + Math.random() * rng;
    }
  }

  // ── 流れ星の描画と更新 ──
  for (let i = shootingStars.length - 1; i >= 0; i--) {
    const s = shootingStars[i];
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.life -= dt / s.maxLife;
    if (s.life <= 0) { shootingStars.splice(i, 1); continue; }

    const a = s.life * s.alpha;
    const nx = -s.vx / Math.hypot(s.vx, s.vy);
    const ny = -s.vy / Math.hypot(s.vx, s.vy);

    const grad = ctx.createLinearGradient(
      s.x, s.y,
      s.x + nx * s.len, s.y + ny * s.len
    );
    grad.addColorStop(0,   `rgba(255,255,255,${a})`);
    grad.addColorStop(0.3, `rgba(200,220,255,${a * 0.6})`);
    grad.addColorStop(1,   `rgba(180,200,255,0)`);

    ctx.save();
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x + nx * s.len, s.y + ny * s.len);
    ctx.stroke();
    // 先端の光点
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ── ハレー彗星の位置更新のみ（描画はdrawHalleys()で行う）──
  for (let i = halleys.length - 1; i >= 0; i--) {
    const h = halleys[i];
    if (!h.alive) { halleys.splice(i, 1); continue; }
    h.x += h.vx;
    h.y += h.vy;
    h.rot += h.rotV;
    h.trail.push({ x: h.x, y: h.y });
    if (h.trail.length > 8) h.trail.shift();
    if (h.y > H + 80 || h.x < -80 || h.x > W + 80) {
      halleys.splice(i, 1); continue;
    }
  }
}

// ── ハレー彗星の描画（直線テール版）──
function drawHalleys() {
  for (const h of halleys) {
    if (!h.alive) continue;

    const spd = Math.hypot(h.vx, h.vy) || 1;
    const tx = -h.vx / spd;
    const ty = -h.vy / spd;

    const px = -ty;
    const py = tx;

    const tailLen = 160 + h.r * 8;
    const dustLen = tailLen * 0.75;

    // 太さ（ここだけ調整）
    const widthScale = 1.8;
    const halfW = h.r * widthScale;

    ctx.save();

    // ── 尾①：メインテール（まっすぐ）
    const ionSlices = 6;
    for (let k = 0; k < ionSlices; k++) {

      const t1 = k / ionSlices;
      const t2 = (k + 1) / ionSlices;

      // ★ 根元
      const nx1 = h.x + px * (-halfW + 2 * halfW * t1);
      const ny1 = h.y + py * (-halfW + 2 * halfW * t1);
      const nx2 = h.x + px * (-halfW + 2 * halfW * t2);
      const ny2 = h.y + py * (-halfW + 2 * halfW * t2);

      // ★ 先端（広げない＝平行移動）
      const fx1 = nx1 + tx * tailLen;
      const fy1 = ny1 + ty * tailLen;
      const fx2 = nx2 + tx * tailLen;
      const fy2 = ny2 + ty * tailLen;

      const edgeFrac = 1 - Math.abs((t1 + t2) * 0.5 - 0.5) * 2;

      const grad = ctx.createLinearGradient(h.x, h.y, h.x + tx * tailLen, h.y + ty * tailLen);
      const baseAlpha = edgeFrac * edgeFrac * 0.55;

      grad.addColorStop(0,    `rgba(255,120,80,${baseAlpha})`);
      grad.addColorStop(0.3,  `rgba(220,60,40,${baseAlpha * 0.75})`);
      grad.addColorStop(0.65, `rgba(180,30,20,${baseAlpha * 0.35})`);
      grad.addColorStop(1,    'rgba(120,0,10,0)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(nx1, ny1);
      ctx.lineTo(nx2, ny2);
      ctx.lineTo(fx2, fy2);
      ctx.lineTo(fx1, fy1);
      ctx.closePath();
      ctx.fill();
    }

    // ── 尾②：ダスト尾（同じく直線）
    const dustSlices = 5;
    for (let k = 0; k < dustSlices; k++) {

      const t1 = k / dustSlices;
      const t2 = (k + 1) / dustSlices;

      const nx1 = h.x + px * (-halfW + 2 * halfW * t1);
      const ny1 = h.y + py * (-halfW + 2 * halfW * t1);
      const nx2 = h.x + px * (-halfW + 2 * halfW * t2);
      const ny2 = h.y + py * (-halfW + 2 * halfW * t2);

      const fx1 = nx1 + tx * dustLen;
      const fy1 = ny1 + ty * dustLen;
      const fx2 = nx2 + tx * dustLen;
      const fy2 = ny2 + ty * dustLen;

      const edgeFrac = 1 - Math.abs((t1 + t2) * 0.5 - 0.5) * 2;

      const grad = ctx.createLinearGradient(h.x, h.y, h.x + tx * dustLen, h.y + ty * dustLen);
      const baseAlpha = edgeFrac * edgeFrac * 0.30;

      grad.addColorStop(0,    `rgba(200,60,120,${baseAlpha})`);
      grad.addColorStop(0.4,  `rgba(160,30,80,${baseAlpha * 0.5})`);
      grad.addColorStop(1,    'rgba(100,0,40,0)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(nx1, ny1);
      ctx.lineTo(nx2, ny2);
      ctx.lineTo(fx2, fy2);
      ctx.lineTo(fx1, fy1);
      ctx.closePath();
      ctx.fill();
    }

    // ── 核
    ctx.translate(h.x, h.y);
    ctx.rotate(h.rot);

    if (halleyImg.complete && halleyImg.naturalWidth > 0) {
      const s = h.r * 2.0;
      ctx.drawImage(halleyImg, -s/2, -s/2, s, s);
    } else {
      ctx.fillStyle = 'rgba(255,200,180,0.95)';
      ctx.beginPath();
      ctx.arc(0, 0, h.r * 0.8, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }
}

function drawOriginPlanet(){
  ensureCanvas();

  // 土星はリング込みの横長画像なので上にオフセットしてリングを見せる
  const fromCanvas = s.getFrom();
  if(fromCanvas && fromCanvas._isSaturn){

// --- 目標天体（背景接近）：位置と見え方の再調整 ---
function drawBgDest(){
  const s = st();
  const maxHearts = s.heartCount || 6;

  // ハートのクリア数を進捗として使う（0.0〜1.0）
  // hudProgress は一定速度で追いかけるので、それをそのまま使う
  const t = Math.min(1.0, hudProgress);

  const easeT = Math.pow(t, 2.5);
  // t=1.0（全ハートクリア）で最大サイズ到達
  const r = (0.05 + easeT * 7.5) * 45;

  const dy = H * 0.12 + easeT * (H * 0.45 - H * 0.12);

  bgDestLastR = r;
  bgDestLastY = dy;

  const alpha = 1.0;  // 常に不透過

  // 最終ミッション（心臓星）は拍動アニメを適用
  const isFinalMission = (stageIdx === 6);
  if (isFinalMission) {
    // heartContract と同じ周期・タイミング（893ms周期）
    const period = 893;
    const now = performance.now();
    // -164ms の delay を再現（位相オフセット）
    const phase = ((now + 164) % period) / period; // 0.0〜1.0
    // keyframe: 0%=1.0, 36.7%=0.82, 66%=1.0, 100%=1.0
    let pulse;
    if (phase < 0.367) {
      // 収縮フェーズ: scale 1.0 → 0.82
      const p = phase / 0.367;
      // ease-in-out 近似
      const e = p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p+2,2)/2;
      pulse = 1.0 - 0.18 * e;
    } else if (phase < 0.66) {
      // 拡張フェーズ: scale 0.82 → 1.0
      const p = (phase - 0.367) / (0.66 - 0.367);
      const e = p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p+2,2)/2;
      pulse = 0.82 + 0.18 * e;
    } else {
      // 静止フェーズ
      pulse = 1.0;
    }
    // glow強度（収縮時に強くなる）
    const glowT = phase < 0.367 ? Math.sin(phase / 0.367 * Math.PI) : 0;
    const glowA = 0.55 + 0.35 * glowT;
    const glowR = 8 + 12 * glowT;

    ctx.save();
    ctx.translate(W/2, dy);
    ctx.scale(pulse, pulse);
    // glow（drop-shadow の代わりにcanvasのshadow）
    ctx.shadowColor = `rgba(255,215,60,${glowA})`;
    ctx.shadowBlur = glowR * (r / 45);
    drawPlanet(0, 0, r, alpha, s.getTo(), s.toColor);
    ctx.restore();
  } else {
    drawPlanet(W/2, dy, r, alpha, s.getTo(), s.toColor);
  }
}

let _flameCache = null;

  oc.width = 100; oc.height = 130;
  const c = oc.getContext('2d');
  const cx = 50, cy = 50;
  const gw = c.createRadialGradient(cx, cy+28, 0, cx, cy+28, 40);
  gw.addColorStop(0, 'rgba(255,120,0,0.18)'); gw.addColorStop(1, 'rgba(255,60,0,0)');
  c.fillStyle = gw; c.beginPath(); c.ellipse(cx, cy+28, 40, 50, 0, 0, Math.PI*2); c.fill();
  c.globalAlpha = 0.65;
  const g1 = c.createRadialGradient(cx, cy+20, 0, cx, cy+36, 26);
  g1.addColorStop(0, '#ff6600'); g1.addColorStop(1, 'rgba(255,0,0,0)');
  c.fillStyle = g1; c.beginPath(); c.ellipse(cx, cy+30, 11, 30, 0, 0, Math.PI*2); c.fill();
  c.globalAlpha = 0.5;
  const g2 = c.createRadialGradient(cx, cy+18, 0, cx, cy+32, 20);
  g2.addColorStop(0, '#ff4400'); g2.addColorStop(1, 'rgba(255,80,0,0)');
  c.fillStyle = g2; c.beginPath(); c.ellipse(cx, cy+26, 8, 22, 0, 0, Math.PI*2); c.fill();
  c.globalAlpha = 0.85;
  const g3 = c.createRadialGradient(cx, cy+12, 1, cx, cy+20, 12);
  g3.addColorStop(0, '#ffee44'); g3.addColorStop(0.5, '#ff8800'); g3.addColorStop(1, 'rgba(255,60,0,0)');
  c.fillStyle = g3; c.beginPath(); c.ellipse(cx, cy+18, 6, 16, 0, 0, Math.PI*2); c.fill();
  c.globalAlpha = 0.95;
  const g4 = c.createRadialGradient(cx, cy+10, 0, cx, cy+13, 5);
  g4.addColorStop(0, '#ffffff'); g4.addColorStop(0.6, '#ffee88'); g4.addColorStop(1, 'rgba(255,200,0,0)');
  c.fillStyle = g4; c.beginPath(); c.ellipse(cx, cy+11, 2.5, 7, 0, 0, Math.PI*2); c.fill();
  return oc;
}

function drawLaunchFlame(cx, cy) {
  if (!_flameCache) _flameCache = _buildFlameCache();
  const ft = Date.now() * 0.018;

// --- パーティクル描画 ---
function drawParticles(){
  for(const p of particles){
    ctx.save();
    // 隕石破片の描画（境界を少しボヤけさせる）
    if(p.type==='meteor_debris'){
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 1.5 * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    else if(p.type==='smoke'){
      ctx.globalAlpha=p.life*0.22; ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,(p.r||6)*(2-p.life),0,Math.PI*2); ctx.fill();
    }else if(p.type==='core'){
      ctx.globalAlpha=p.life*0.9;
      ctx.fillStyle='rgba(255,255,255,0.9)';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*0.6*p.life,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=p.life*0.5;
      ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*2*p.life,0,Math.PI*2); ctx.fill();
    }else if(p.type==='spark'){
      ctx.globalAlpha=p.life; ctx.strokeStyle=p.color; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.vx*3,p.y-p.vy*3); ctx.stroke();
    }else if(p.type==='thruster'){
      ctx.globalAlpha=p.life*0.9;
      ctx.fillStyle='rgba(255,255,255,0.8)';
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*0.8*p.life,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=p.life*0.5;
      ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*2.5*p.life,0,Math.PI*2); ctx.fill();
    }else{
      ctx.globalAlpha=p.life*(p.isFlame?0.85:0.5); ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.isFlame?4*p.life:2*p.life,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha=1;
}

// --- ハートアイテム ---
function drawHeartItem(it){
  ctx.save();
  ctx.translate(it.x, it.y);

  const pulse = 0.92 + 0.08 * Math.sin(Date.now() * 0.005); // 拍動

  // 背景の光（正解・不正解で色を変えない）
  ctx.globalAlpha = 0.28 * pulse;
  ctx.fillStyle = '#ff66aa';
  ctx.beginPath();
  ctx.arc(0, 0, 26, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalAlpha = 1;

  // --- 画像描画（縦横比を維持・フィルターなし統一） ---
  if (heartImg.complete && heartImg.naturalWidth > 0) {
    const base = 38 * pulse;
    const ratio = heartImg.naturalHeight / heartImg.naturalWidth;
    const w = base;
    const h = base * ratio;
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'medium';
    ctx.drawImage(heartImg, -w / 2, -h / 2, w, h);
  } 
  // --- フォールバック（ベクターハート・色統一） ---
  else {
    ctx.fillStyle = '#ff3366';
    ctx.beginPath();
    ctx.moveTo(0, 6);
    ctx.bezierCurveTo(-16, -6, -22, -19, -10, -22);
    ctx.bezierCurveTo(-3, -25, 0, -19, 0, -16);
    ctx.bezierCurveTo(0, -19, 3, -25, 10, -22);
    ctx.bezierCurveTo(22, -19, 16, -6, 0, 6);
    ctx.fill();
  }

  // --- ラベル表示（ハートの上・色統一） ---
  if (it.label) {
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = "bold 9px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
    ctx.fillStyle = 'rgba(0,0,0,0.60)';
    const textW = ctx.measureText(it.label).width + 8;
    ctx.beginPath();
    ctx.roundRect(-textW/2, -54, textW, 15, 4);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.fillText(it.label, 0, -43);
    ctx.restore();
  }

  ctx.restore();
}

// --- HUD ---
function drawHUD(){
  const s=st();
  const progress = hudProgress;
  const MARGIN=6;

  // 上部パネル
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.roundRect(6,4,W-12,36,5); ctx.fill();
  ctx.restore();

  // ステージラベル
  ctx.save();
  ctx.fillStyle='rgba(180,220,255,0.9)'; ctx.font = "bold 9px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif"; ctx.textAlign='center';
  ctx.fillText(s.label,W/2,14);
  ctx.restore();

  // 一行: [バー] のみ（出発・到着星は不要）
  const ICO=10,BAR_Y=27,BAR_H=7;
  const LEFT_X=MARGIN+4, RIGHT_X=W-MARGIN-4;
  const BAR_W=RIGHT_X-LEFT_X;

  // 進行バー
  ctx.save();
  ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.beginPath(); ctx.roundRect(LEFT_X,BAR_Y-BAR_H/2,BAR_W,BAR_H,3); ctx.fill();
  const bfill=BAR_W*progress;
  if(bfill>1){
    const g=ctx.createLinearGradient(LEFT_X,0,LEFT_X+BAR_W,0);
    g.addColorStop(0,'#1155cc'); g.addColorStop(0.5,'#44aaff'); g.addColorStop(1,'#aaddff');
    ctx.fillStyle=g; ctx.beginPath(); ctx.roundRect(LEFT_X,BAR_Y-BAR_H/2,bfill,BAR_H,3); ctx.fill();
  }
  ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.beginPath(); ctx.arc(Math.min(LEFT_X+bfill,LEFT_X+BAR_W),BAR_Y,3,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(150,200,255,0.2)'; ctx.lineWidth=1; ctx.beginPath(); ctx.roundRect(LEFT_X,BAR_Y-BAR_H/2,BAR_W,BAR_H,3); ctx.stroke();
  ctx.restore();

  // 左右移動ガイド矢印（ロケットの左右・プレイ中のみ）
  if(state === 'playing'){
    const ry = H - 90; // ロケットのY座標
    const arrowY = ry - 2;
    const t = Date.now() * 0.003;
    const pulse = 0.55 + 0.35 * Math.abs(Math.sin(t)); // 強めの点滅

    // 左ボタン（枠なし・小さめ）
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#ffffff';
    ctx.font = "bold 16px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('◀', 13, arrowY);
    ctx.restore();

    // 右ボタン（枠なし・小さめ）
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#ffffff';
    ctx.font = "bold 16px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('▶', W - 13, arrowY);
    ctx.textBaseline = 'alphabetic';
    ctx.restore();
  }

  // エネルギーバー（右下）
  const BAR_FULL_W = 110;
  const BAR_BH = 14;
  const EX = W - MARGIN - BAR_FULL_W;
  const EY = H - MARGIN - BAR_BH - 2;
  const energyRatio = Math.max(0, Math.min(1, energy / ENERGY_MAX));

  // バー背景パネル
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.beginPath(); ctx.roundRect(EX-28, EY-4, BAR_FULL_W+32, BAR_BH+8, 5); ctx.fill();

  // ラベル
  ctx.fillStyle='rgba(180,220,255,0.85)';
  ctx.font = "bold 13px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif"; ctx.textAlign='right';
  ctx.fillText('⚡', EX-1, EY+BAR_BH-1);

  // バー背景
  ctx.fillStyle='rgba(255,255,255,0.08)';
  ctx.beginPath(); ctx.roundRect(EX, EY, BAR_FULL_W, BAR_BH, 4); ctx.fill();

  // バー本体（エネルギー残量によって色変化）
  if(energyRatio > 0){
    const barFillW = BAR_FULL_W * energyRatio;
    let barColor;
    if(energyRatio > 0.5){
      // 緑 → 黄
      const t2 = (energyRatio - 0.5) / 0.5;
      const r2 = Math.round(255 * (1-t2) + 80 * t2) | 0;
      const g2 = Math.round(220 * (1-t2) + 220 * t2) | 0;
      barColor = `rgb(${r2},${g2},50)`;
    } else {
      // 黄 → 赤
      const t2 = energyRatio / 0.5;
      const r2 = 255;
      const g2 = Math.round(220 * t2) | 0;
      barColor = `rgb(${r2},${g2},30)`;
    }
    const eg = ctx.createLinearGradient(EX, 0, EX+barFillW, 0);
    eg.addColorStop(0, barColor);
    eg.addColorStop(1, '#ffffff88');
    ctx.fillStyle = eg;
    ctx.beginPath(); ctx.roundRect(EX, EY, barFillW, BAR_BH, 4); ctx.fill();

    // 点滅演出（残り20%以下）
    if(energyRatio < 0.2 && Math.sin(Date.now() * 0.015) > 0){
      ctx.fillStyle='rgba(255,80,0,0.35)';
      ctx.beginPath(); ctx.roundRect(EX, EY, barFillW, BAR_BH, 4); ctx.fill();
    }
  }

  // バー枠線
  ctx.strokeStyle='rgba(150,200,255,0.25)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.roundRect(EX, EY, BAR_FULL_W, BAR_BH, 4); ctx.stroke();

  // パーセント表示
  ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.font = "bold 8px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif"; ctx.textAlign='center';
  ctx.fillText(Math.ceil(energyRatio*100)+'%', EX + BAR_FULL_W/2, EY + BAR_BH - 3);

  ctx.textAlign='left';
  ctx.restore();

  // ===== ヒントコメント（左下、音出現中に表示）ミッション7では非表示 =====
  if(heartSetActive && currentBlock && currentBlock.comment && !hintDismissed && stageIdx !== 6 && stageIdx !== 7){
    drawHintComment(currentBlock.comment);
  }

  // ===== 正解表示（ハートを逃したとき・次のハート出現まで）ミッション7では非表示 =====
  if(!heartSetActive && lastMissedAnswer && stageIdx !== 6 && stageIdx !== 7){
    drawMissedAnswer(lastMissedAnswer);
  }
}

// ===== ヒントコメント描画（テキストのみ）=====
function drawHintComment(comment){
  const MARGIN = 6;
  const BAR_BH = 14;
  const EY = H - MARGIN - BAR_BH - 2;

  const PH = BAR_BH + 8;
  const PY = EY - 4;

  ctx.save();
  const labelText = 'ヒント：';
  ctx.font = "bold 9px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  const labelW = ctx.measureText(labelText).width;
  ctx.font = "9px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  const textW  = ctx.measureText(comment).width;
  const PW = labelW + textW + 14;
  const PX = MARGIN;
  const midY = PY + PH / 2;

  // 背景パネル（グラデーション）
  const bg = ctx.createLinearGradient(PX, PY, PX, PY + PH);
  bg.addColorStop(0, 'rgba(0,20,50,0.88)');
  bg.addColorStop(1, 'rgba(0,8,28,0.88)');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.roundRect(PX, PY, PW, PH, 5); ctx.fill();



  // 「ヒント：」ラベル（明るいシアン・太字）
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(120,220,255,1)';
  ctx.font = "bold 9px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  ctx.fillText(labelText, PX + 6, midY + 3);

  // コメントテキスト
  ctx.fillStyle = 'rgba(210,240,255,0.95)';
  ctx.font = "9px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  ctx.fillText(comment, PX + 6 + labelW, midY + 3);

  ctx.restore();
}
