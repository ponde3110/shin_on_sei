// =============================================
// ゴージャス スタート画面
// =============================================
let _uiTime = 0; // UI animation time accumulator

function drawStartScreen() {
  const T = _uiTime;

  // 全体ダークオーバーレイ
  ctx.fillStyle = 'rgba(2,0,22,0.92)';
  ctx.fillRect(0, 0, W, H);

  // タイトル光輪（単色半透明）
  const titleY = H * 0.17;
  ctx.fillStyle = `rgba(60,100,220,${0.14 + 0.06*Math.sin(T*1.8)})`;
  ctx.fillRect(0, titleY - 60, W, 120);

  // タイトル：サブ
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = "bold 9px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  ctx.letterSpacing = '3px';
  ctx.fillStyle = `rgba(120,180,255,${0.7 + 0.3*Math.sin(T*1.4)})`;
  ctx.fillText('MISSION  START', W/2, titleY - 22);

  // タイトル：メイン（2行）
  ctx.font = "bold 26px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  ctx.shadowColor = `rgba(100,160,255,${0.8 + 0.2*Math.sin(T*2.2)})`;
  ctx.shadowBlur = 18 + 8 * Math.sin(T * 1.6);
  const tg = ctx.createLinearGradient(W/2 - 100, 0, W/2 + 100, 0);
  tg.addColorStop(0,   '#88ccff');
  tg.addColorStop(0.35,'#ffffff');
  tg.addColorStop(0.65,'#ffffff');
  tg.addColorStop(1,   '#aabbff');
  ctx.fillStyle = tg;
  ctx.fillText('心音の旅', W/2, titleY + 6);

  ctx.shadowBlur = 0;
  ctx.font = "10px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  ctx.fillStyle = `rgba(160,200,255,${0.6 + 0.2*Math.sin(T*1.1)})`;
  ctx.fillText('太陽系を超え心臓星へ', W/2, titleY + 24);
  ctx.restore();

  // --- 装飾ライン ---
  ctx.save();
  ctx.textAlign = 'center';
  for(let side = -1; side <= 1; side += 2){
    const lx = W/2 + side * 70;
    const lg = ctx.createLinearGradient(W/2, 0, lx, 0);
    lg.addColorStop(0,   `rgba(100,160,255,${0.6 + 0.3*Math.sin(T*1.5)})`);
    lg.addColorStop(1,   'rgba(100,160,255,0)');
    ctx.strokeStyle = lg;
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(W/2 + side * 6, titleY + 36);
    ctx.lineTo(lx, titleY + 36);
    ctx.stroke();
  }
  ctx.restore();

  // ── 右上：記録をリセット（テキストのみ・クリック可能）──
  // ── 左上：マイスター取得（secretCleared時のみ）／ 右上：記録をリセット ──
  {
    const MARGIN  = 7;
    const LABEL_Y = 12; // ボタン中心Y

    ctx.save();
    ctx.shadowBlur = 0;

    // ── 左上：勲章エリア（常に3枚表示・未取得は暗く・航路マップ風の枠付き）──
    {
      const MEDAL_H   = 22;
      const MEDAL_GAP = 6;
      const PAD_X     = 6;
      const PAD_Y     = 5;
      const FRAME_X   = MARGIN;
      const FRAME_Y   = 3;
      const FRAME_R   = 6;

      // 各勲章の幅を計算して枠全体の幅を決定
      const imgs = [licensedImg, expertImg, meisterImg];
      const mws  = imgs.map(img =>
        (img.complete && img.naturalWidth > 0)
          ? Math.round(MEDAL_H * img.naturalWidth / Math.max(img.naturalHeight, 1))
          : MEDAL_H
      );
      const totalMedalW = mws.reduce((s, w) => s + w, 0) + MEDAL_GAP * 2;
      const FRAME_W = totalMedalW + PAD_X * 2;
      const FRAME_H = MEDAL_H + PAD_Y * 2;

      // 航路マップと同じ枠スタイル
      ctx.save();
      ctx.fillStyle = 'rgba(0,10,30,0.85)';
      ctx.beginPath(); ctx.roundRect(FRAME_X, FRAME_Y, FRAME_W, FRAME_H, FRAME_R); ctx.fill();
      ctx.strokeStyle = 'rgba(100,160,255,0.3)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.roundRect(FRAME_X, FRAME_Y, FRAME_W, FRAME_H, FRAME_R); ctx.stroke();
      ctx.restore();

      const medalY  = FRAME_Y + PAD_Y;
      let   medalX  = FRAME_X + PAD_X;
      const types   = ['licensed', 'expert', 'meister'];
      const earneds = [licensedCleared, completedCount >= 7, secretCleared];

      _medalRects = [];
      let medalIdx = 0;

      for(let i = 0; i < 3; i++){
        const img    = imgs[i];
        const mw     = mws[i];
        const earned = earneds[i];
        const hov    = earned && (_medalHoverIdx === medalIdx);

        ctx.save();
        ctx.globalAlpha = earned ? 1.0 : 0.22;

        if(img.complete && img.naturalWidth > 0){
          if(hov){
            ctx.translate(medalX + mw/2, medalY + MEDAL_H/2);
            ctx.scale(1.15, 1.15);
            ctx.translate(-(medalX + mw/2), -(medalY + MEDAL_H/2));
          }
          ctx.drawImage(img, medalX, medalY, mw, MEDAL_H);
        } else {
          // 画像未ロード時：プレースホルダー円
          ctx.fillStyle = 'rgba(180,200,255,0.3)';
          ctx.beginPath(); ctx.arc(medalX + mw/2, medalY + MEDAL_H/2, MEDAL_H/2, 0, Math.PI*2); ctx.fill();
        }
        ctx.restore();

        // 取得済みのみクリック判定に追加
        if(earned){
          _medalRects.push({ x: medalX - 2, y: medalY - 2, w: mw + 4, h: MEDAL_H + 4, idx: medalIdx, type: types[i] });
          medalIdx++;
        }
        medalX += mw + MEDAL_GAP;
      }
    }

    // ── 右上：記録をリセット（控えめボタン・ホバーで変化）──
    {
      const label = '記録をリセット';
      ctx.font = "bold 7.5px -apple-system,'Hiragino Sans','Yu Gothic UI',sans-serif";
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      const tw = ctx.measureText(label).width;
      const BTN_PAD_X = 5, BTN_PAD_Y = 3;
      const btnW = tw + BTN_PAD_X * 2;
      const btnH = 12 + BTN_PAD_Y * 2;
      const btnX = W - MARGIN - btnW;
      const btnY = LABEL_Y - btnH / 2;

      const hov = _resetBtnHover;

      // 背景（ホバー時は少し明るく）
      ctx.save();
      ctx.globalAlpha = hov ? 0.95 : 0.78;
      ctx.fillStyle = hov ? 'rgba(90,15,10,0.85)' : 'rgba(60,10,10,0.7)';
      ctx.beginPath(); ctx.roundRect(btnX, btnY, btnW, btnH, 4); ctx.fill();
      ctx.strokeStyle = hov ? 'rgba(255,140,120,0.80)' : 'rgba(255,120,100,0.42)';
      ctx.lineWidth = hov ? 0.9 : 0.7;
      ctx.beginPath(); ctx.roundRect(btnX, btnY, btnW, btnH, 4); ctx.stroke();
      // ホバー時は内側グロー
      if(hov){
        const ig = ctx.createLinearGradient(btnX, btnY, btnX, btnY+btnH);
        ig.addColorStop(0, 'rgba(255,80,60,0.14)');
        ig.addColorStop(1, 'rgba(255,30,10,0.04)');
        ctx.fillStyle = ig;
        ctx.beginPath(); ctx.roundRect(btnX, btnY, btnW, btnH, 4); ctx.fill();
      }
      ctx.restore();

      // テキスト（ホバー時は明るく）
      ctx.fillStyle = hov ? 'rgba(255,180,165,1.0)' : 'rgba(255,150,130,0.88)';
      ctx.fillText(label, W - MARGIN - BTN_PAD_X, LABEL_Y);

      // ヒット領域
      _resetBtnRect = { x: btnX - 2, y: btnY - 2, w: btnW + 4, h: btnH + 4 };
    }

    ctx.restore();
  }

  // --- 流れ星パーティクル（UI専用、簡易） ---
  ctx.save();
  for(let i = 0; i < 4; i++){
    const phase = (T * 0.7 + i * 1.57) % (Math.PI * 2);
    const px = (W * 0.1 + i * W * 0.25 + Math.sin(phase * 0.3) * 20) % W;
    const py = (H * 0.05 + i * H * 0.07 + T * (14 + i * 5)) % (H * 0.55);
    const len = 18 + i * 8;
    const alpha = 0.3 + 0.4 * Math.abs(Math.sin(phase));
    const sg = ctx.createLinearGradient(px, py, px - len * 0.6, py - len);
    sg.addColorStop(0, `rgba(200,220,255,${alpha})`);
    sg.addColorStop(1, 'rgba(200,220,255,0)');
    ctx.strokeStyle = sg;
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px - len * 0.6, py - len); ctx.stroke();
  }
  ctx.restore();

  // --- 航路マップ ---
  drawProgressMap(completedCount, START_MAP_OFFSET);

  // --- クレジット＆免責（スタート画面のみ） ---
  ctx.save();

  // © クレジット：ボタン直下・中央揃え
  // bottom:33% → ボタン下端はおよそ H * 0.67 付近、余白を見てY座標を設定
  const creditY = H * 0.695;
  ctx.textAlign = 'center';
  ctx.font = "bold 7px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  ctx.fillStyle = 'rgba(160,200,255,0.60)';
  ctx.fillText('© 2026 ponde3110', W / 2, creditY);

  // 免責テキスト：航路マップ枠の下・左揃え・極小
  // 枠下端 = H - 4 - START_MAP_OFFSET = 520 - 4 - 30 = 486
  const mapBottom = H - 4 - START_MAP_OFFSET;  // 枠の下端
  const disclaimerTopMargin = 7;               // 枠との間隔
  const disclaimer =
    '心音の解釈は必ずしも一義的ではないため，本アプリに掲載された情報に基づいて生じた' +
    'いかなる損害について一切の責任を負いかねます．音声は全て実際の心音です．' +
    '本アプリに含まれるすべてのコンテンツは，著作権法により保護されています．';
  ctx.font = "5.5px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  ctx.fillStyle = 'rgba(120,160,210,0.40)';
  ctx.textAlign = 'left';
  const leftX = 8;
  const maxLineW = W - 16;
  const lineH = 7;
  // 手動折り返し
  const dLines = [];
  let cur = '';
  for(const ch of disclaimer){
    const test = cur + ch;
    if(ctx.measureText(test).width > maxLineW){ dLines.push(cur); cur = ch; }
    else { cur = test; }
  }
  if(cur) dLines.push(cur);
  // 枠下端＋余白から下向きに描画
  dLines.forEach((l, idx) => {
    ctx.fillText(l, leftX, mapBottom + disclaimerTopMargin + (idx + 1) * lineH);
  });

  ctx.restore();
}

// =============================================
// ゴージャス ステージクリア画面
// =============================================
function drawStageClearScreen(stageIndex) {
  const T = _uiTime;
  const s = STAGES[stageIndex];
  const missionTitle = s.label.split('：')[0];
  const nextS = STAGES[stageIndex + 1];

  // オーバーレイ
  ctx.fillStyle = 'rgba(0,8,20,0.93)';
  ctx.fillRect(0, 0, W, H);

  // SUCCESS バナー背景
  const bannerY = H * 0.13;
  const bannerH = 70;
  ctx.save();
  ctx.fillStyle = `rgba(0,80,30,${0.38 + 0.08*Math.sin(T*2)})`;
  ctx.fillRect(0, bannerY, W, bannerH);

  // 左右の光線（単色）
  for(let side = -1; side <= 1; side += 2){
    const rx = W/2 + side * (30 + 40 * Math.abs(Math.sin(T * 0.9)));
    ctx.fillStyle = `rgba(80,255,140,${0.10 + 0.05*Math.sin(T*1.8)})`;
    ctx.fillRect(Math.min(W/2, rx), bannerY, Math.abs(rx - W/2), bannerH);
  }

  ctx.textAlign = 'center';

  // ラベル
  ctx.font = "bold 8px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  ctx.fillStyle = `rgba(80,255,140,${0.7 + 0.25*Math.sin(T*2.5)})`;
  ctx.fillText('✦  MISSION COMPLETE  ✦', W/2, bannerY + 18);

  // ミッション名
  ctx.font = "bold 22px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  ctx.shadowColor = `rgba(60,255,120,${0.9 + 0.1*Math.sin(T*1.8)})`;
  ctx.shadowBlur = 14 + 6 * Math.sin(T * 2.2);
  const mg = ctx.createLinearGradient(W/2-80, 0, W/2+80, 0);
  mg.addColorStop(0,   '#88ffcc');
  mg.addColorStop(0.4, '#ffffff');
  mg.addColorStop(0.6, '#ffffff');
  mg.addColorStop(1,   '#aaffdd');
  ctx.fillStyle = mg;
  ctx.fillText(missionTitle + '  成功！', W/2, bannerY + 50);
  ctx.shadowBlur = 0;

  // --- 到着した星のアイコン（大きく） ---
  const iconY = H * 0.30;
  const iconR2 = 36;
  const toImg = PLANET_IMGS[stageIndex + 1]();
  const pulse = 1 + 0.06 * Math.sin(T * 2.4);

  ctx.save();
  ctx.shadowColor = PLANET_COLORS[stageIndex + 1];
  ctx.shadowBlur = 20 + 10 * Math.sin(T * 2.0);

  // リング
  for(let ri = 0; ri < 3; ri++){
    const rr = iconR2 + 10 + ri * 12 + ri * 4 * Math.sin(T * 1.5 + ri);
    const ra = (0.4 - ri * 0.1) * (0.6 + 0.4 * Math.abs(Math.sin(T * 1.2 + ri * 0.8)));
    ctx.strokeStyle = `rgba(255,255,255,${ra})`;
    ctx.lineWidth = 1.0 - ri * 0.2;
    ctx.beginPath(); ctx.arc(W/2, iconY, rr, 0, Math.PI * 2); ctx.stroke();
  }

  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'medium';
  if(toImg && toImg.complete && toImg.naturalWidth){
    const isSaturn = (stageIndex + 1 === 4); // 土星はindex4
    if(isSaturn){
      const asp = toImg.naturalWidth / Math.max(toImg.naturalHeight, 1);
      const dh = iconR2 * pulse * 2.6; // リングごと表示
      const dw = dh * asp;
      ctx.drawImage(toImg, W/2 - dw/2, iconY - dh/2, dw, dh);
    } else {
      const r2d = iconR2 * pulse;
      ctx.beginPath(); ctx.arc(W/2, iconY, r2d, 0, Math.PI * 2); ctx.clip();
      const iw = toImg.naturalWidth, ih = toImg.naturalHeight;
      const sq = Math.min(iw, ih);
      ctx.drawImage(toImg, (iw-sq)/2, (ih-sq)/2, sq, sq, W/2-r2d, iconY-r2d, r2d*2, r2d*2);
    }
  } else {
    ctx.fillStyle = PLANET_COLORS[stageIndex + 1];
    ctx.beginPath(); ctx.arc(W/2, iconY, iconR2 * pulse, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  // 到着テキスト
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = "bold 11px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  ctx.fillStyle = `rgba(200,240,255,${0.85 + 0.15*Math.sin(T*1.6)})`;
  ctx.fillText(s.arriveText, W/2, iconY + iconR2 + 18);

  // 次のミッション予告
  if(nextS){
    ctx.font = "9px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
    ctx.fillStyle = `rgba(120,180,255,${0.55 + 0.2*Math.sin(T*1.3)})`;
    ctx.fillText('NEXT ▶  ' + nextS.label.split('：')[0], W/2, iconY + iconR2 + 33);
  }
  ctx.restore();

  // 航路マップ（ローカル保存済みのクリア数と現在の大きい方）
  drawProgressMap(Math.max(completedCount, stageIndex + 1));
}

// =============================================
// ゴージャス ゲームオーバー画面
// =============================================
function drawGameOverScreen() {
  const T = _uiTime;

  // ── 背景：深宇宙ブラック＋青紫ネビュラ ──
  ctx.fillStyle = 'rgba(3,0,14,0.96)';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.textAlign = 'center';

  // ══════════════════════════════════════════
  // ブロック①：GAME OVER（サイバーネオン）
  // ══════════════════════════════════════════
  const goY = H * 0.22;

  // 背景スキャンライン（ホログラム感）
  for(let ly = goY - 36; ly < goY + 14; ly += 3){
    const la = 0.04 + 0.03 * Math.sin(T * 4 + ly * 0.3);
    ctx.fillStyle = `rgba(80,180,255,${la})`;
    ctx.fillRect(W*0.06, ly, W*0.88, 1);
  }

  // 外枠パネル（サイバー風）
  const panelAlpha = 0.55 + 0.15 * Math.sin(T * 1.6);
  ctx.strokeStyle = `rgba(0,220,255,${panelAlpha})`;
  ctx.lineWidth = 1.2;
  // 上辺
  ctx.beginPath();
  ctx.moveTo(W*0.06, goY - 38); ctx.lineTo(W*0.94, goY - 38);
  ctx.stroke();
  // 下辺
  ctx.beginPath();
  ctx.moveTo(W*0.06, goY + 16); ctx.lineTo(W*0.94, goY + 16);
  ctx.stroke();
  // 左上コーナーマーク
  ctx.lineWidth = 2;
  ctx.strokeStyle = `rgba(0,255,220,${panelAlpha})`;
  ctx.beginPath(); ctx.moveTo(W*0.06, goY - 38); ctx.lineTo(W*0.06, goY - 28); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W*0.06, goY - 38); ctx.lineTo(W*0.14, goY - 38); ctx.stroke();
  // 右上コーナーマーク
  ctx.beginPath(); ctx.moveTo(W*0.94, goY - 38); ctx.lineTo(W*0.94, goY - 28); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W*0.94, goY - 38); ctx.lineTo(W*0.86, goY - 38); ctx.stroke();
  // 左下コーナーマーク
  ctx.beginPath(); ctx.moveTo(W*0.06, goY + 16); ctx.lineTo(W*0.06, goY + 6);  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W*0.06, goY + 16); ctx.lineTo(W*0.14, goY + 16); ctx.stroke();
  // 右下コーナーマーク
  ctx.beginPath(); ctx.moveTo(W*0.94, goY + 16); ctx.lineTo(W*0.94, goY + 6);  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W*0.94, goY + 16); ctx.lineTo(W*0.86, goY + 16); ctx.stroke();
  ctx.lineWidth = 1;

  // グリッチ：時々ランダムにXズレ
  const glitchActive = Math.sin(T * 7.3) > 0.82;
  const gx1 = glitchActive ? (Math.random() - 0.5) * 7 : 0;
  const gx2 = glitchActive ? (Math.random() - 0.5) * 5 : 0;

  // 広域シアンネオングロー
  ctx.shadowColor = 'rgba(0,230,255,0.9)';
  ctx.shadowBlur = 28;
  ctx.font = 'bold 30px monospace';

  // グリッチ層①（マゼンタ・微ズレ）
  ctx.globalAlpha = 0.45;
  ctx.fillStyle = '#ff44cc';
  ctx.fillText('GAME OVER', W/2 + gx1 + 3, goY);

  // グリッチ層②（シアン・微ズレ）
  ctx.fillStyle = '#00ffee';
  ctx.fillText('GAME OVER', W/2 + gx2 - 3, goY);

  // メイン文字（白→シアングラデーション）
  ctx.globalAlpha = 1.0;
  ctx.shadowColor = 'rgba(0,200,255,1)';
  ctx.shadowBlur = 18;
  const neonGrad = ctx.createLinearGradient(W/2 - 105, 0, W/2 + 105, 0);
  neonGrad.addColorStop(0,   '#00eeff');
  neonGrad.addColorStop(0.3, '#aaffff');
  neonGrad.addColorStop(0.5, '#ffffff');
  neonGrad.addColorStop(0.7, '#aaffff');
  neonGrad.addColorStop(1,   '#00eeff');
  ctx.fillStyle = neonGrad;
  ctx.fillText('GAME OVER', W/2, goY);
  ctx.shadowBlur = 0;

  // パネル下の小テキスト（緑モノスペース）
  ctx.font = '8px monospace';
  ctx.globalAlpha = 0.55 + 0.2 * Math.sin(T * 4.5);
  ctx.fillStyle = '#44ffaa';
  ctx.fillText('[ SYS:CRITICAL  ENERGY:000  STATUS:DESTROYED ]', W/2, goY + 30);
  ctx.globalAlpha = 1.0;

  // ══════════════════════════════════════════
  // ブロック②：ロケット 大破（オレンジ炎系・別レイヤー感）
  // ══════════════════════════════════════════
  const fireY = H * 0.40;
  const dangerPulse = 0.6 + 0.4 * Math.abs(Math.sin(T * 2.5));

  // 炎のオーラ
  const fireGlow = ctx.createRadialGradient(W/2, fireY, 0, W/2, fireY, 80);
  fireGlow.addColorStop(0,   `rgba(255,120,0,${0.22 * dangerPulse})`);
  fireGlow.addColorStop(0.6, `rgba(255,40,0,${0.10 * dangerPulse})`);
  fireGlow.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = fireGlow;
  ctx.fillRect(W/2 - 90, fireY - 50, 180, 100);

  // 区切り破線
  ctx.setLineDash([4, 5]);
  ctx.lineWidth = 0.8;
  ctx.strokeStyle = `rgba(255,120,40,${0.3 + 0.15 * Math.sin(T * 1.8)})`;
  ctx.beginPath(); ctx.moveTo(W*0.15, fireY - 22); ctx.lineTo(W*0.85, fireY - 22); ctx.stroke();
  ctx.setLineDash([]);

  // 「ロケット 大破」本体
  ctx.font = "bold 26px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  ctx.shadowColor = `rgba(255,80,0,${dangerPulse})`;
  ctx.shadowBlur = 22 * dangerPulse;
  const fireGrad = ctx.createLinearGradient(W/2 - 80, 0, W/2 + 80, 0);
  fireGrad.addColorStop(0,   '#ff6600');
  fireGrad.addColorStop(0.35,'#ffcc44');
  fireGrad.addColorStop(0.5, '#ffffff');
  fireGrad.addColorStop(0.65,'#ffcc44');
  fireGrad.addColorStop(1,   '#ff6600');
  ctx.fillStyle = fireGrad;
  ctx.fillText('ロケット 大破', W/2, fireY);
  ctx.shadowBlur = 0;

  // 「エネルギーが尽きた…」
  ctx.font = "10px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
  ctx.fillStyle = `rgba(210,160,100,${0.55 + 0.2 * Math.sin(T * 1.4)})`;
  ctx.fillText('エネルギーが尽きた…', W/2, fireY + 20);

  // 浮遊破片（炎色2種）
  for(let i = 0; i < 8; i++){
    const angle = (i / 8) * Math.PI * 2 + T * 0.35;
    const r2 = 48 + 8 * Math.sin(T * 1.6 + i * 1.3);
    const px = W/2 + Math.cos(angle) * r2;
    const py = fireY - 4  + Math.sin(angle) * r2 * 0.32;
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(T * 1.1 + i);
    ctx.globalAlpha = 0.28 + 0.22 * Math.sin(T * 2.2 + i);
    ctx.fillStyle = i % 2 === 0 ? '#ff8822' : '#ffdd44';
    const sz = 3 + (i % 3);
    ctx.fillRect(-sz/2, -sz/2, sz, sz * 0.7);
    ctx.restore();
  }

  ctx.restore();

  // 航路マップ（ローカル保存済みのクリア数を使用）
  drawProgressMap(completedCount);
}

// --- 出発アニメーション（修正版） ---
function drawLaunchAnim(){
  ensureCanvas();
  const s=st(),t=launchT;
  // 惑星を大きく・画面下部に上1/3だけ見えるように表示
  const fromR=Math.round(W * 0.85); // 画面幅の約85%の半径＝大きな惑星
  // 中心Y: 惑星の上1/3が画面に見えるよう、中心をH + fromR*(2/3) あたりに固定
  const baseY = H + fromR * (2/3);
  // アニメ開始時は少し下から登場し、終わりに向けてゆっくり沈んでいく（出発感）
  let fromY = baseY + fromR * 0.55 * easeIn(t); // 惑星がしっかり消えるまで沈む

  // ミッション8（裏ミッション）：心臓星を拍動させる
  if(s.isSecret){
    // 拍動周期893ms に合わせた scale アニメーション
    const beatPhase = (performance.now() % 893) / 893; // 0→1 周期
    let heartScale;
    if(beatPhase < 0.367){
      // S1→S2 収縮
      const p = beatPhase / 0.367;
      heartScale = 1.0 - 0.18 * p;
    } else if(beatPhase < 0.66){
      // S2→静止 拡張
      const p = (beatPhase - 0.367) / (0.66 - 0.367);
      heartScale = 0.82 + 0.18 * p;
    } else {
      heartScale = 1.0;
    }
    // グロー強度も拍動に連動
    const glowA = 0.55 + 0.35 * (1.0 - heartScale / 1.0);
    const drawR = fromR * heartScale;
    ctx.save();
    ctx.globalAlpha = 0.6 + 0.4 * (1.0 - heartScale);
    drawPlanet(W/2, fromY, drawR, 1, s.getFrom(), s.fromColor);
    ctx.restore();
  } else {
    // 土星はリング込みの横長画像なので、画像上部（リング含む）が画面に見えるよう中心Yを調整
    const fromCanvas = s.getFrom();
    if(fromCanvas && fromCanvas._isSaturn){
      const aspect = fromCanvas.width / Math.max(fromCanvas.height, 1);
      const drawH = fromR * 2;
      fromY = H + drawH / 2 - drawH * 0.22 + drawH * 0.55 * easeIn(t);

      // 反時計回りに少し傾けてリングを見せる
      ctx.save();
      ctx.translate(W/2, fromY);
      ctx.rotate(-0.28); // 約16度反時計回り
      const drawW = drawH * aspect;
      ctx.globalAlpha = 1;
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'medium';
      ctx.drawImage(fromCanvas, 0, 0, fromCanvas.width, fromCanvas.height,
                    -drawW/2, -drawH/2, drawW, drawH);
      ctx.restore();
    } else {
      drawPlanet(W/2, fromY, fromR, 1, s.getFrom(), s.fromColor);
    }
  }

  const ry=(H-fromR*0.15-70)+(H-90-(H-fromR*0.15-70))*easeOut(t);
  addLaunchFlame(W/2,ry+18); drawRocketAt(W/2+(Math.random()-0.5)*t*4,ry,true,0);
  if(t<0.6){
    const a=Math.min(1,t*5);
    ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.font = "bold 18px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";ctx.textAlign='center';
    ctx.fillText(s.launchText,W/2,H*0.38);ctx.textAlign='left';
  }
}

// --- 到着アニメーションの修正（小さくなりながら上へ移動） ---
function drawArriveAnim(){
  const s = st(), t = arriveT;
  
  // 1. 星の描画：bgDestLastR/bgDestLastYから徐々に拡大して中央へ
  const r = bgDestLastR + (450 - bgDestLastR) * easeIn(t);
  const dy = bgDestLastY + (H / 2 - bgDestLastY) * easeIn(t);
  drawPlanet(W/2, dy, r, 1, s.getTo(), s.toColor);

  // 2. ロケットの描画：playing終了時の大きさ(scale=1)から縮小
  const rocketScale = Math.max(0, 1.0 * (1 - t));
  const alpha = 1.0; // 不透過（半透明にしない）
  // Y座標：ロケットの通常位置(H-90)から上へ移動
  const rocketY = (H - 90) - (t * H * 0.65);

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(W/2, rocketY);
  ctx.scale(rocketScale, rocketScale);
  
  // 揺れながら進む
  const shake = (Math.random() - 0.5) * 3;
  drawRocketAt(shake, 0, true, 0);
  ctx.restore();

  // 3. テキスト表示
  if(t > 0.3){
    const a = Math.min(1, (t - 0.3) * 3);
    // 最終ミッション（心臓星）も含めて白で統一
    ctx.fillStyle = `rgba(255,255,255,${a})`;
    ctx.font = "bold 20px -apple-system, 'Hiragino Sans', 'Yu Gothic UI', sans-serif";
    ctx.textAlign = 'center';
    ctx.fillText(s.arriveText, W/2, H * 0.45);
    ctx.textAlign = 'left';
  }
}

function drawUfo(u){
  if(u.exploding) {
    for(const p of u.explodeParticles){
      ctx.save(); ctx.globalAlpha = p.life * 0.9; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    return;
  }

  ctx.save();
  ctx.translate(u.x, u.y);

  // --- シンプルなサーチライト（hoverモード中のみ） ---
  if(u.mode === 'hover' && !u.isCapture){
    const pulse = 0.75 + Math.sin(Date.now() * 0.007) * 0.25;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const beam = ctx.createLinearGradient(0, 5, 0, 120);
    beam.addColorStop(0, `rgba(100, 220, 255, ${0.22 * pulse})`);
    beam.addColorStop(1, 'rgba(0, 120, 255, 0)');
    ctx.fillStyle = beam;
    ctx.beginPath();
    ctx.moveTo(-10, 5); ctx.lineTo(10, 5);
    ctx.lineTo(38, 120); ctx.lineTo(-38, 120);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // --- 捕獲ビーム（捕獲UFO用・同じ円錐スタイル） ---
  if(u.isCapture && u.beamActive){
    const target = u.captureTarget;
    const beamLen = target ? Math.max(30, target.y - u.y + 20) : 100;
    const spread = beamLen * 0.32;
    const pulse = 0.75 + Math.sin(Date.now() * 0.007) * 0.25;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const beam = ctx.createLinearGradient(0, 5, 0, beamLen);
    beam.addColorStop(0, `rgba(100, 220, 255, ${0.28 * pulse})`);
    beam.addColorStop(1, 'rgba(0, 120, 255, 0)');
    ctx.fillStyle = beam;
    ctx.beginPath();
    ctx.moveTo(-10, 5); ctx.lineTo(10, 5);
    ctx.lineTo(spread, beamLen); ctx.lineTo(-spread, beamLen);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // UFO本体の描画
  if(ufoImg.complete && ufoImg.naturalWidth > 0){
    ctx.drawImage(ufoImg, -39, -25, 78, 50);
  } else {
    // 画像がない場合のフォールバック
    ctx.fillStyle = '#88ddff';
    ctx.beginPath(); ctx.ellipse(0, 0, 26, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#aaeeff';
    ctx.beginPath(); ctx.ellipse(0, -4, 12, 6, 0, 0, Math.PI * 2); ctx.fill();
  }

  ctx.restore();
}

function updateUfos(dt){

  for(const u of ufos){
    if(u.mode === 'approach'){
      // 捕獲UFOは対象が死んでいたら退場
      if(u.isCapture && u.captureTarget && !u.captureTarget.alive){
        u.mode = 'depart'; continue;
      }
      // 捕獲UFOは対象の上に移動
      if(u.isCapture && u.captureTarget){
        u.targetX = u.captureTarget.x;
        u.targetY = u.captureTarget.y - 60;
      }
      u.x += (u.targetX - u.x) * dt * 2.5;
      u.y += (u.targetY - u.y) * dt * 2.5;
      if(Math.abs(u.x - u.targetX) < 5 && Math.abs(u.y - u.targetY) < 5){
        u.mode = 'hover';
        if(u.isCapture) u.beamActive = true;
      }
    }
    else if(u.mode === 'hover'){
      u.timer += dt;
      u.x += Math.sin(u.timer * 3) * 0.7;
      u.y += Math.cos(u.timer * 5) * 0.4;

      if(u.isCapture && u.beamActive){
        u.beamTimer += dt;
        const tgt = u.captureTarget;
        // 対象が既に消えていたら退場
        if(!tgt || !tgt.alive){ u.mode = 'depart'; continue; }
        // 対象の上に追従
        u.targetX = tgt.x;
        u.targetY = tgt.y - 60;
        // ビーム展開後2秒で宇宙飛行士を引き込み開始
        if(u.beamTimer > 2.0 && tgt.mode !== 'being_pulled'){
          tgt.mode = 'being_pulled';
          tgt.captureAlpha = 1;
          tgt.captureScale = 1;
          tgt.captureUfoRef = u;
        }
        // 宇宙飛行士が消えたら退場（being_pulledで処理済みの場合もある）
        if(!tgt.alive){ u.mode = 'depart'; continue; }
      } else if(!u.isCapture && u.timer > 4.0){
        u.mode = 'depart';
      }
    }
    else if(u.mode === 'depart'){
      u.vy -= dt * 700;
      u.y += u.vy * dt;
    }

    // UFOは隕石などほかの物から影響を受けない（衝突判定なし）
  }

  ufos = ufos.filter(u => u.y > -200 && u.x > -150 && u.x < W + 150);

  // UFOが1機以上画面内にいて、かつplaying中のみループ音ON
  if (ufos.length > 0 && state === 'playing') {
    startUfoLoopSound();
  } else {
    stopUfoLoopSound();
  }
}

function drawAstronaut(a){

function updateAstronauts(dt){
  if(!dt) return;
  // 宇宙飛行士はミッション３から出現、かつ画面に0人のときだけスポーン
  if(st().id >= 3 && astronauts.length === 0){
    astronautSpawnTimer -= dt;
    if(astronautSpawnTimer <= 0){
      spawnAstronaut();
      astronautSpawnTimer = 9999; // 1ミッション中に1人だけ（startStageでリセット）
    }
  }

  for(const a of astronauts){
    if(!a.alive) continue;

    a.timer += dt;
    a.rot += a.rotV;

    // 衝突速度を位置に反映・減衰（blownモードは後で独自処理するのでスキップ）
    if((a.vx || a.vy) && a.mode !== 'blown'){
      a.x += a.vx * dt * 60;
      a.y += a.vy * dt * 60;
      a.vx *= Math.pow(0.85, dt * 60);
      a.vy *= Math.pow(0.85, dt * 60);
      if(Math.abs(a.vx) < 0.01) a.vx = 0;
      if(Math.abs(a.vy) < 0.01) a.vy = 0;
      // 勢いで画面外に出た場合は速度を反転して押し返す
      if(a.x < -20){ a.x = -20; a.vx = Math.abs(a.vx) * 0.5; }
      if(a.x > W + 20){ a.x = W + 20; a.vx = -Math.abs(a.vx) * 0.5; }
      if(a.y < -20){ a.y = -20; a.vy = Math.abs(a.vy) * 0.5; }
      if(a.y > H + 20){ a.y = H + 20; a.vy = -Math.abs(a.vy) * 0.5; }
    }

    // blown: 隕石・彗星に吹き飛ばされた（回転しながら減速→画面内に戻る）
    if(a.mode === 'blown'){
      a.x += a.vx * dt * 60;
      a.y += a.vy * dt * 60;
      a.vy += 0.02; // 弱い重力
      a.vx *= 0.97;
      a.vy *= 0.97;
      a.rot += a.rotV * 3.0;
      // 速度が十分小さくなったら drift に戻す（画面内に復帰）
      const spd2 = a.vx*a.vx + a.vy*a.vy;
      if(spd2 < 0.05){
        a.vx = 0; a.vy = 0;
        a.targetX = W * 0.2 + Math.random() * (W * 0.6);
        a.targetY = H * 0.25 + Math.random() * (H * 0.35);
        a.mode = 'enter';
        a.captureAlpha = 1.0;
        a.captureScale = 1.0;
        a.beingCaptured = false;
        a.captureTimer = 8 + Math.random() * 8;
        a.sosTimer = 1.0 + Math.random();
      }
      // 画面外に大きく出すぎた場合も引き戻す
      if(a.x < -100){ a.x = -100; a.vx = Math.abs(a.vx) * 0.5; }
      if(a.x > W+100){ a.x = W+100; a.vx = -Math.abs(a.vx) * 0.5; }
      if(a.y < -100){ a.y = -100; a.vy = Math.abs(a.vy) * 0.5; }
      if(a.y > H+100){ a.y = H+100; a.vy = -Math.abs(a.vy) * 0.5; }
      continue;
    }

    if(a.mode === 'enter'){
      a.x += (a.targetX - a.x) * dt * 0.5;
      a.y += (a.targetY - a.y) * dt * 0.5;
      if(Math.abs(a.x - a.targetX) < 5) a.mode = 'drift';
    }
    else if(a.mode === 'drift'){
      a.x += Math.sin(a.timer * 0.5 + a.driftOffset) * 0.3;
      a.y += Math.cos(a.timer * 0.8 + a.driftOffset) * 0.2;

      // 画面外に押し出された場合は画面内の安全な位置へ引き戻す
      const outMargin = 60;
      if(a.x < -outMargin || a.x > W + outMargin || a.y < -outMargin || a.y > H + outMargin){
        a.targetX = W * 0.2 + Math.random() * (W * 0.6);
        a.targetY = H * 0.3 + Math.random() * (H * 0.3);
        a.mode = 'enter';
        a.vx = 0;
        a.vy = 0;
      }

      // SOS音：約2.5秒ごとに1回鳴らす
      if(!a.sosTimer) a.sosTimer = 1.0 + Math.random(); // 初回は少しずらす
      a.sosTimer -= dt;
      if(a.sosTimer <= 0){
        playSosSE();
        a.sosTimer = 2.5 + Math.random() * 0.5;
      }

      // 捕獲タイマーが来たらUFO召喚（宇宙飛行士が画面内にいるときだけ）
      const onScreen = a.x >= 0 && a.x <= W && a.y >= 0 && a.y <= H;
      if(!a.beingCaptured && a.timer > a.captureTimer && onScreen){
        a.beingCaptured = true;
        spawnCaptureUfo(a);
      }
    }
    // being_pulled: UFOに向かって縮みながら吸い込まれる
    else if(a.mode === 'being_pulled'){
      const ufo = a.captureUfoRef;
      const targetX = ufo ? ufo.x : a.x;
      const targetY = ufo ? ufo.y + 10 : a.y - 60;
      // UFOの位置に向かって引き寄せる
      a.x += (targetX - a.x) * dt * 1.5;
      a.y += (targetY - a.y) * dt * 1.5;
      a.captureAlpha = Math.max(0, a.captureAlpha - dt * 0.4);
      a.captureScale = Math.max(0, (a.captureScale || 1) - dt * 0.55);
      a.rot += 0.06;
      if(a.captureScale <= 0.05) {
        a.alive = false;
        // UFO回収によるエネルギー消費 -20
        energy = Math.max(0, energy - 20);
        life = Math.round(energy / ENERGY_MAX * LIFE_MAX);
        hitFlash = 0.3;
        // UFOにビームを消させて立ち去らせる
        if(ufo){ ufo.beamActive = false; ufo.mode = 'depart'; }
      }
    }
  }

  astronauts = astronauts.filter(a => a.alive);
}

function checkAstronautRescue(){
  const rx = rocketX;
  const ry = H - 90;
  const hitPoints = getRocketHitPoints(rx, ry, rocketTilt);
  for(const a of astronauts){
    if(!a.alive) continue;
    // ロケットのhitPointsいずれかが宇宙飛行士の半径内に入ったら救助
    const rescueR = 32; // 宇宙飛行士の当たり半径（drawSize=50の約2/3）
    const rescueR2 = rescueR * rescueR;
    let hit = false;
    for(const [px,py] of hitPoints){
      const dx = a.x - px, dy = a.y - py;
      if(dx*dx + dy*dy < rescueR2){ hit = true; break; }
    }
    if(hit){
      a.alive = false;
      energy = Math.min(ENERGY_MAX, energy + ENERGY_RESCUE_GAIN);
      life = Math.round(energy/ENERGY_MAX*LIFE_MAX);
      pickupFlash = 0.5;
      playRescueSE();
    }
  }
}

  // HUD高解像度キャッシュ（航路マップ用）

    ()=>hudEarthCanvas, ()=>hudMoonCanvas, ()=>hudMarsCanvas, ()=>hudJupiterCanvas,
    ()=>hudSaturnCanvas, ()=>hudUranusCanvas, ()=>hudNeptuneCanvas, ()=>hudGoalCanvas
  ];

  // Draw planets
  for(let i = 0; i < N; i++){
    const x = 6 + PAD + i * slotW;
    const isGoal = (i === N - 1);

    // isDone: i==0(地球)は常にtrue、それ以外は i <= completedMissions
    const isDone = (i === 0) || (i <= completedMissions);
    // isVisible: 明瞭に表示するか（クリック可能かにも連動）
    const isVisible = isDone;
    // 高解像度キャッシュCanvasを優先使用、なければ元画像にフォールバック
    const hudC = HUD_MAP_CACHES[i]();
    const img = PLANET_IMGS[i]();
    const isSaturn = (i === 4); // 土星はリング付き横長（index=4）

    ctx.save();
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'medium';
    if(!isVisible){
      ctx.globalAlpha = 0.18;
    }

    if(hudC){
      // HUD高解像度キャッシュから描画（シャープな縮小）
      if(isSaturn){
        const asp = hudC.width / Math.max(hudC.height, 1);
        const dh = iconR * 2;
        const dw = dh * asp;
        ctx.drawImage(hudC, 0, 0, hudC.width, hudC.height, x - dw/2, lineY - dh/2, dw, dh);
      } else {
        ctx.beginPath(); ctx.arc(x, lineY, iconR, 0, Math.PI * 2); ctx.clip();
        ctx.drawImage(hudC, 0, 0, hudC.width, hudC.height, x - iconR, lineY - iconR, iconR * 2, iconR * 2);
      }
    } else if(img && img.complete && img.naturalWidth){
      if(isSaturn){
        const asp = img.naturalWidth / Math.max(img.naturalHeight, 1);
        const dh = iconR * 2;
        const dw = dh * asp;
        ctx.drawImage(img, x - dw/2, lineY - dh/2, dw, dh);
      } else {
        const iw = img.naturalWidth, ih = img.naturalHeight;
        const sq = Math.min(iw, ih);
        const sx = (iw - sq) / 2, sy = (ih - sq) / 2;
        ctx.beginPath(); ctx.arc(x, lineY, iconR, 0, Math.PI * 2); ctx.clip();
        ctx.drawImage(img, sx, sy, sq, sq, x - iconR, lineY - iconR, iconR * 2, iconR * 2);
      }
    } else {
      ctx.fillStyle = PLANET_COLORS[i];
      ctx.beginPath(); ctx.arc(x, lineY, iconR, 0, Math.PI * 2); ctx.fill();

    // Completed checkmark ring
    if(isDone && !isGoal){

      ctx.strokeStyle = 'rgba(100,255,180,0.85)';

      ctx.beginPath(); ctx.arc(x, lineY, iconR + 2, 0, Math.PI * 2); ctx.stroke();

    // 心臓星：全クリア時に緑リング（脈打つグロー付き）
    if(isGoal && completedMissions >= N - 1){
      const pulse = 0.7 + 0.3 * Math.abs(Math.sin(_uiTime * 2.2));

      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, lineY, iconR + 2, 0, Math.PI * 2); ctx.stroke();

    // Hover highlight ring
    if(i === mapHoveredStar && (state==='start'||state==='stage_clear'||state==='all_clear'||state==='over')){
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,180,0.95)';

    ctx.font = `${isGoal ? 'bold ' : ''}7px sans-serif`;
    ctx.textAlign = 'center';
    ctx.globalAlpha = 1;
    ctx.fillText(PLANET_LABELS[i], x, lineY + iconR + 10);
    ctx.restore();
  }

  ctx.textAlign = 'left';
  ctx.restore();
}
// ロケットの当たり判定用ポイント（ローカル座標、rocketTilt込みで変換して使う）
// 機体形状：先端・胴体上部・胴体下・左翼・右翼
function getRocketHitPoints(cx, cy, tilt){
  const cos = Math.cos(tilt), sin = Math.sin(tilt);
  const local = [
    [0, -60],   // 先端
    [-10, -30], // 胴体左上
    [ 10, -30], // 胴体右上
    [-13,  10], // 胴体左中
    [ 13,  10], // 胴体右中
    [-22,  28], // 左翼先端
    [ 22,  28], // 右翼先端
    [  0,  30], // 底中央
  ];
  return local.map(([lx,ly])=>[
    cx + lx*cos - ly*sin,
    cy + lx*sin + ly*cos
  ]);
}

function checkCollisions(){
  const rx=rocketX, ry=H-90;
  const hitPoints = getRocketHitPoints(rx, ry, rocketTilt);
  for(const d of debris){
    if(!d.alive) continue;
    // いずれかの判定点が隕石円内に入ったら衝突
    const r2 = (d.r + 2) * (d.r + 2);
    let hit = false;
    for(const [px,py] of hitPoints){
      const dx=d.x-px, dy=d.y-py;
      if(dx*dx+dy*dy < r2){ hit=true; break; }
    }
    // 補助判定：ロケット胴体の中心軸に沿った線分と隕石の距離チェック
    // 小さい隕石が横からすり抜けるのを防ぐ（ロケット1のみ爆発）
    if(!hit){
      // ロケット胴体を先端(0,-55)→底(0,25)の線分として判定
      const cos=Math.cos(rocketTilt), sin=Math.sin(rocketTilt);
      // 胴体左端・右端の4点（横幅13px）でも補完
      const bodyPoints=[
        [rx-13*cos, ry-13*sin], // 胴体左
        [rx+13*cos, ry+13*sin], // 胴体右
      ];
      // 先端〜底の中間点を追加
      for(let t=0;t<=1;t+=0.25){
        const lx=0, ly=-55+80*t;
        bodyPoints.push([rx+lx*cos-ly*sin, ry+lx*sin+ly*cos]);
      }
      const rHit2=(d.r+12)*(d.r+12);
      for(const [px,py] of bodyPoints){
        const dx=d.x-px, dy=d.y-py;
        if(dx*dx+dy*dy < rHit2){ hit=true; break; }
      }
    }
    if(hit){
      // 裏ミッション(isSecret)またはsecretCleared（rocket3使用）：隕石を跳ね返す・エネルギー消費なし・爆発しない
      if(st().isSecret || secretCleared){
        // 跳ね返し：隕石同士の衝突と同様に軌跡を少し変えるだけ
        const rx2 = rocketX, ry2 = H - 90;
        const dx2 = d.x - rx2, dy2 = d.y - ry2;
        const dist2 = Math.sqrt(dx2*dx2 + dy2*dy2) || 1;
        const nx2 = dx2/dist2, ny2 = dy2/dist2;
        const impulse = 0.6 + Math.random()*0.3;
        d.vx += nx2 * impulse;
        d.vy += ny2 * impulse;
        d.rotV = (Math.random()-0.5) * 0.06;
        // rocket2(isSecret)・rocket3（secretCleared）は隕石ヒットでもエネルギー消費なし・画面反転なし
        playBounceHitSE();
        shakeX=(Math.random()-0.5)*4; shakeY=(Math.random()-0.5)*3;
        setTimeout(()=>{shakeX=0;shakeY=0;},80);
      } else {
        d.alive=false; energy=Math.max(0,energy-ENERGY_HIT_COST); life=Math.round(energy/ENERGY_MAX*LIFE_MAX); hitFlash=0.5;
        addMeteorDebris(d.x, d.y, d.r);
        playMeteorHitSE();
        shakeX=(Math.random()-0.5)*12; shakeY=(Math.random()-0.5)*8;
        setTimeout(()=>{shakeX=0;shakeY=0;},200);
      }
    }
  }
  for(const it of items){
    if(!it.alive) continue;
    // ハートの実描画半径（base=38の約半分）に合わせた厳密な判定
    const heartR = 16;
    const heartR2 = heartR * heartR;
    // ロケットのhitPointsのいずれかがハート円内に入ったら接触
    let hit = false;
    for(const [px,py] of hitPoints){
      const dx=it.x-px, dy=it.y-py;
      if(dx*dx+dy*dy < heartR2){ hit=true; break; }
    }
    if(hit){
      it.alive=false;
      if(it.isHeart){
        stopBgm(); // ハート取得時にBGM即停止
        if(it.isCorrect){ energy=Math.min(ENERGY_MAX,energy+ENERGY_HEART_GAIN); life=Math.round(energy/ENERGY_MAX*LIFE_MAX); pickupFlash=0.5; playCorrectSE(); hintDismissed=true; }
        else            { energy=Math.max(0,energy-ENERGY_WRONG_COST); life=Math.round(energy/ENERGY_MAX*LIFE_MAX); hitFlash=0.4; playWrongSE(); }
      } else {
        pickupFlash=0.3;
      }
    }
  }
}

// 隕石がハート・宇宙飛行士に当たると弾く（隕石はそのまま）
function checkDebrisHitsObjects(){
  for(const d of debris){
    if(!d.alive) continue;

    // ハートは隕石と干渉しない（軌跡変化なし）

    for(const a of astronauts){
      if(!a.alive) continue;
      const dx=a.x-d.x, dy=a.y-d.y;
      const distSq=dx*dx+dy*dy;
      const minD=d.r+a.r;
      if(distSq<minD*minD){
        const dist=Math.sqrt(distSq)||1;
        const nx=dx/dist, ny=dy/dist;
        const force=3.5+d.r*0.12;
        // 速度として加える（スムーズな移動）
        a.vx += nx * force;
        a.vy += ny * force;
        // 浮遊パターンと目標もずらす
        a.driftOffset+=(Math.random()-0.5)*1.5;
        if(a.mode!=='being_pulled'){
          a.targetX = Math.max(20, Math.min(W-20, a.x + nx * 25));
          a.targetY = Math.max(50, Math.min(H-120, a.y + ny * 20));
        }
      }
    }
  }
}

// ハレー彗星が隕石・UFO・宇宙飛行士を押しのける＋ロケットに即爆発
function checkHalleyCollisions(){
  const rx = rocketX, ry = H - 90;
  const hitPoints = getRocketHitPoints(rx, ry, rocketTilt);

  for (const h of halleys) {
    if (!h.alive) continue;

    // 隕石を押しのける
    for (const d of debris) {
      if (!d.alive) continue;
      const dx = d.x - h.x, dy = d.y - h.y;
      const dist2 = dx*dx + dy*dy;
      const minD = h.r + d.r;
      if (dist2 < minD*minD && dist2 > 0) {
        const dist = Math.sqrt(dist2);
        const nx = dx/dist, ny = dy/dist;
        const force = 4 + h.r * 0.1;  // ← 半分くらいに
        d.vx += nx * force;
        d.vy += ny * force;
      }
    }

    // UFOを押しのける
    for (const u of ufos) {
      if (!u.alive) continue;
      const dx = u.x - h.x, dy = u.y - h.y;
      const dist2 = dx*dx + dy*dy;
      const minD = h.r + (u.r || 24);
      if (dist2 < minD*minD && dist2 > 0) {
        const dist = Math.sqrt(dist2);
        const nx = dx/dist, ny = dy/dist;
        const force = 10;
        u.x += nx * force;
        u.y += ny * force;
        if (u.vx !== undefined) { u.vx += nx * 3; u.vy += ny * 3; }
      }
    }

    // 宇宙飛行士を吹き飛ばす（blownモードへ移行）
    for (const a of astronauts) {
      if (!a.alive || a.mode === 'blown') continue;
      const dx = a.x - h.x, dy = a.y - h.y;
      const dist2 = dx*dx + dy*dy;
      const minD = h.r + a.r;
      if (dist2 < minD*minD && dist2 > 0) {
        const dist = Math.sqrt(dist2);
        const nx = dx/dist, ny = dy/dist;
        // 吹き飛ばし速度（ロケット爆発時の宇宙飛行士と同程度）
        const force = 1.8 + Math.random() * 1.0;
        a.vx = nx * force + (Math.random()-0.5) * 0.5;
        a.vy = ny * force - 0.8 - Math.random() * 0.5;
        a.mode = 'blown';
        a.captureAlpha = 1.0;
        a.rotV = (Math.random() < 0.5 ? 1 : -1) * (0.02 + Math.random() * 0.03);
      }
    }

    // ロケットに当たると即爆発
    let hitRocket = false;
    for (const [px, py] of hitPoints) {
      const dx = h.x - px, dy = h.y - py;
      if (dx*dx + dy*dy < (h.r + 4) * (h.r + 4)) { hitRocket = true; break; }
    }
    if (hitRocket && state === 'playing') {
      h.alive = false;
      if(st().isSecret || secretCleared){
        // 裏ミッション or secretCleared：すい星ヒットはエネルギー20消費（爆発なし）
        energy = Math.max(0, energy - 20);
        life = Math.round(energy/ENERGY_MAX*LIFE_MAX);
        hitFlash = 0.6;
        playMeteorHitSE();
        shakeX=(Math.random()-0.5)*14; shakeY=(Math.random()-0.5)*10;
        setTimeout(()=>{shakeX=0;shakeY=0;},250);
      } else {
        energy = 0;
        life = 0;
        state = 'exploding';
        _uiTime = 0;
        explosionT = 0;
        explosionX = rocketX;
        explosionY = H - 90;
        explosionPlayed = false;
        stopBgm();
        stopUfoLoopSound();
        stopBlackholeLoopSound();
        spawnExplosionParticles(explosionX, explosionY);
      }
    }
  }
}

// バックグラウンド一時停止フラグ
let _pausedByVisibility = false;

const FPS_INTERVAL = 1000 / 60; // 60fps キャップ

function loop(ts){
  const elapsed = ts - lastTime;
  if (elapsed < FPS_INTERVAL) { requestAnimationFrame(loop); return; }
  const dt=Math.min(elapsed/1000,0.05);
  lastTime = ts - (elapsed % FPS_INTERVAL);

  // バックグラウンド中はゲームを進行しない（描画もスキップ）
  if (_pausedByVisibility) {
    requestAnimationFrame(loop);
    return;
  }

  // 金色変換アニメ中はゲームループを止める（オーバーレイが全画面を占有）
  if(state === 'golden_transform'){
    requestAnimationFrame(loop);
    return;
  }

if(state==='launch_anim'){

  // アニメーション進行
  launchT = Math.min(1, launchT + dt / LAUNCH_DUR);
  starScroll += dt * 30;

  for(const p of particles){
    p.x += p.vx;
    p.y += p.vy;
    p.life -= dt / p.maxLife;
  }
  particles = particles.filter(p => p.life > 0);

  drawStars();
  updateAndDrawShootingStars(dt);
  drawLaunchAnim();
  drawParticles();

  // 状態遷移
  if(launchT >= 1){
    state = 'playing';
  }

  requestAnimationFrame(loop);
  return;
}

  // ===== 大破アニメーション =====
  if(state === 'exploding'){
    explosionT += dt;
    _uiTime += dt;

    // 効果音は最初の1フレームで再生
    if(!explosionPlayed && explosionT > 0){
      playExplosionSE();
      explosionPlayed = true;
    }

    // 背景を描画
    drawStars();
    updateAndDrawShootingStars(dt);
    for(const p of explosionParticles){
      if(p.delay && explosionT < p.delay) continue;
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.grav || 0;
      p.vx *= p.drag || 1;
      p.vy *= p.drag || 1;
      p.life -= dt / p.maxLife;
      if(p.rot !== undefined) p.rot += p.rotV;
      // 破片・火の粉のトレイル蓄積
      if((p.isDebris || p.isEmber) && p.trail !== undefined){
        p.trail.push({x: p.x, y: p.y});
        if(p.trail.length > 6) p.trail.shift();
      }
    }

    // ── 爆発コア光球（白→橙→消滅） ──
    if(explosionT < 0.55){
      const ct = explosionT / 0.55;
      const coreR = (1 - ct) * 62 + ct * 12;
      const coreA = Math.max(0, 1 - ct * 1.1);
      ctx.save();
      const cg = ctx.createRadialGradient(explosionX, explosionY, 0, explosionX, explosionY, coreR);
      cg.addColorStop(0,   `rgba(255,255,240,${coreA})`);
      cg.addColorStop(0.2, `rgba(255,240,140,${coreA * 0.9})`);
      cg.addColorStop(0.5, `rgba(255,120,20,${coreA * 0.7})`);
      cg.addColorStop(1,   `rgba(180,30,0,0)`);
      ctx.fillStyle = cg;
      ctx.beginPath(); ctx.arc(explosionX, explosionY, coreR, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }

    // ── 衝撃波リング（2重・速度差あり） ──
    for(const [delay, maxR, col] of [[0, W*0.7, 'rgba(255,200,100,'], [0.06, W*0.5, 'rgba(255,255,220,']]) {
      const rt = Math.min(1, Math.max(0, (explosionT - delay) / 0.45));
      if(rt > 0 && rt < 1){
        const rr = rt * maxR;
        const ra = (1 - rt) * 0.75;
        ctx.save();
        ctx.beginPath(); ctx.arc(explosionX, explosionY, rr, 0, Math.PI*2);
        ctx.strokeStyle = `${col}${ra})`;
        ctx.lineWidth = Math.max(1, (1 - rt) * 10);
        ctx.stroke();
        ctx.restore();
      }
    }

    // ── パーティクル描画 ──
    for(const p of explosionParticles){
      if(p.delay && explosionT < p.delay) continue;
      if(p.life <= 0) continue;
      const alpha = Math.max(0, p.life);
      ctx.save();
      ctx.globalAlpha = alpha;

      if(p.isSmokePuff){
        // 膨張する煙雲
        const growR = p.r * (1 + (1 - p.life) * 1.8);
        const sg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, growR);
        sg.addColorStop(0,   p.color);
        sg.addColorStop(0.5, p.color.replace('0.55', `${0.35 * p.life}`));
        sg.addColorStop(1,   'rgba(0,0,0,0)');
        ctx.fillStyle = sg;
        ctx.beginPath(); ctx.arc(p.x, p.y, growR, 0, Math.PI*2); ctx.fill();
      } else if(p.isSmoke){
        // 中速煙
        const growR = p.r * (1 + (1 - p.life) * 0.9);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, growR, 0, Math.PI*2); ctx.fill();
      } else if(p.isFireball){
        // 炎球（シンプル2段円）
        const rad = p.r * 2.2 * p.life;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(p.x, p.y, rad * 0.35, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha = alpha * 0.55;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, Math.PI*2); ctx.fill();
      } else if(p.isDebris){
        // 金属破片（軌跡＋回転四角）
        if(p.trail && p.trail.length > 1){
          ctx.globalAlpha = alpha * 0.35;
          ctx.strokeStyle = p.color;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(p.trail[0].x, p.trail[0].y);
          for(const tp of p.trail) ctx.lineTo(tp.x, tp.y);
          ctx.stroke();
          ctx.globalAlpha = alpha;
        }
        ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.r*0.6, -p.r*0.35, p.r*1.2, p.r*0.7);
      } else if(p.isEmber){
        // 火の粉（軌跡＋先端）
        if(p.trail && p.trail.length > 1){
          ctx.globalAlpha = alpha * 0.5;
          ctx.strokeStyle = p.color;
          ctx.lineWidth = p.r * 1.2;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(p.trail[0].x, p.trail[0].y);
          for(const tp of p.trail) ctx.lineTo(tp.x, tp.y);
          ctx.stroke();
          ctx.globalAlpha = alpha;
        }
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }
    explosionParticles = explosionParticles.filter(p => p.life > 0);

    // ── ロケット残骸：3つに分解して飛散 ──
    if(explosionT < 5.0){
      const frags = [
        { ox:-18, oy:-30, rot: explosionT * 2.5,  vx:-1.0, vy:-1.5, sc: Math.max(0.15, 0.9 - explosionT*0.22) },
        { ox: 14, oy:-10, rot:-explosionT * 3.0,  vx: 1.4, vy:-0.9, sc: Math.max(0.15, 0.8 - explosionT*0.20) },
        { ox:  0, oy: 20, rot: explosionT * 2.0,  vx: 0.3, vy: 1.6, sc: Math.max(0.15, 0.7 - explosionT*0.17) },
      ];
      for(const f of frags){
        const alpha = Math.max(0, 1 - explosionT * 0.35);
        if(alpha <= 0) continue;
        ctx.save();
        ctx.globalAlpha = alpha;
        const fx = explosionX + f.ox + f.vx * explosionT * 60;
        const fy = explosionY + f.oy + f.vy * explosionT * 60 + 0.5 * 0.09 * (explosionT*60)**2 * 0.01;
        ctx.translate(fx, fy);
        ctx.rotate(f.rot);
        ctx.scale(f.sc, f.sc);
        if(astronautImg.complete && astronautImg.naturalWidth > 0){
          ctx.drawImage(astronautImg, -38, -38, 76, 76);
        }
        ctx.restore();
      }
    }

    // ── 画面全体フラッシュ（冒頭の白フラッシュ） ──
    if(explosionT < 0.12){
      const fa = (1 - explosionT / 0.12) * 0.92;
      ctx.fillStyle = `rgba(255,240,200,${fa})`;
      ctx.fillRect(0, 0, W, H);
    }

    // ── 赤みパルス（0.1〜1.2秒） ──
    if(explosionT > 0.1 && explosionT < 1.2){
      const pulse = Math.max(0, Math.sin(explosionT * 22) * 0.5);
      ctx.fillStyle = `rgba(255,40,0,${pulse * 0.22})`;
      ctx.fillRect(0, 0, W, H);
    }

    // ── 暗転ベール（後半・煙の余韻） ──
    if(explosionT > 1.2){
      const darkA = Math.min(0.55, (explosionT - 1.2) * 0.38);
      ctx.fillStyle = `rgba(8,4,2,${darkA})`;
      ctx.fillRect(0, 0, W, H);
    }

    // 大破演出終了 → game over 画面へ
    // パーティクルが全部消えたら即遷移（最低0.8秒確保）、上限はEXPLOSION_DUR
    const allParticlesDone = explosionT > 0.8 && explosionParticles.every(p => p.life <= 0);
    if(allParticlesDone || explosionT >= EXPLOSION_DUR){
      _uiTime = 0;
      launchT = 0;
      arriveT = 0;
      stopBlackholeLoopSound();
      stopUfoLoopSound();
      // ミッション8（裏ミッション）で爆発→お祝い画面（ファンファーレなし）を表示
      if(STAGES[stageIdx] && STAGES[stageIdx].isSecret){
        state = 'all_clear';
        showCelebrationNoFanfare();
      } else {
        state = 'over';
      }
    }

    requestAnimationFrame(loop); return;
  }

  if(state==='arrive_anim'){
    if(arriveT === 0 && dt > 0){
      stopAllSounds();
      // ミッション8（裏ミッション）クリア時は到着音を省いてfanfareに備える
      const isM8Arrive = st() && st().isSecret;
      if(!isM8Arrive) setTimeout(()=>playArriveSound(), 80);
      arriveT = 0.00001; // 次フレームで再発火しないよう微小値に
    }
    arriveT=Math.min(1,arriveT+dt/ARRIVE_DUR);
    starScroll+=dt*20;
    particles=particles.filter(p=>p.life>0);
    updateUfos(dt);
    drawStars(); updateAndDrawShootingStars(dt); drawArriveAnim(); drawParticles();
    if(arriveT>=1){
      // 通常ミッション7（id=7, stageIdx=6）クリアは all_clear。
      // 次のステージが裏ミッション(isSecret)の場合も all_clear 扱い
      const nextStage = STAGES[stageIdx + 1];
      const nextIsSecret = nextStage && nextStage.isSecret;
      const nextState = (stageIdx + 1 < STAGES.length && !nextIsSecret) ? 'stage_clear' : 'all_clear';
      state = nextState;
      _uiTime = 0;
      // クリア済みミッション数を更新・保存
      completedCount = Math.max(completedCount, stageIdx + 1);
      saveCompletedCount();
      // ミッション6クリアでライセンス付与＋お祝いオーバーレイ
      if(stageIdx === 5){
        if(!licensedCleared){
          licensedCleared = true;
          try { localStorage.setItem('shinon_licensedCleared', '1'); } catch(e) {}
        }
        // stage_clear のCanvas描画を止めるため状態を変更してからオーバーレイを表示
        state = 'licensed_clear';
        showLicensedCelebration();
      }
      // isAnim()がtrueを返し続けないようにリセット
      arriveT = 0;
      launchT = 0;
      // 全クリア時はここで直接お祝いを表示
      if(nextState === 'all_clear'){
        showCelebration();
      }
    }
    requestAnimationFrame(loop); return;
  }

  if(state==='playing'){
    const s=st();
    speed=FIXED_SPEED;
    dist+=speed*dt*60;
    starScroll+=speed*dt*120;



    // 進捗バー：ハート出現ごとに目標値を更新し、一定速度で近づく
    { const maxHearts = s.heartCount || 6;
      const done = heartSpawnCount >= maxHearts && !heartSetActive && heartSetClearTimer <= 0;
      if (done) hudTarget = 1.0;
      // 一定速度（1セット分を約4秒で移動）でtargetに近づく
      const step = (1.0 / maxHearts) / 4.0;
      if (hudProgress < hudTarget) {
        hudProgress = Math.min(hudTarget, hudProgress + step * dt);
      }
    }

    const isM8 = st().isSecret; // ミッション8（裏ミッション）フラグ
    const thrust= isM8 ? (520+speed*150) : (490+speed*145);
    const left=keys['ArrowLeft']||keys['a']||keys['A'];
    const right=keys['ArrowRight']||keys['d']||keys['D'];
    if(left)  rocketVX-=thrust*dt;
    if(right) rocketVX+=thrust*dt;
    // 左右移動時のエネルギー消費
    if(left||right) energy=Math.max(0, energy-ENERGY_MOVE_COST*dt);
    // スラスター音削除済み
    if(_thrusterSoundTimer > 0) _thrusterSoundTimer -= dt;

    // ブラックホールが近くにある場合は減衰を弱める（rocketVXへの寄与を残すため）
    let bhNearFactor = 0;
    for(const bh of blackholes){
      if(!bh.alive) continue;
      const _dx = bh.x - rocketX, _dy = bh.y - (H - 90);
      const _d2 = _dx*_dx + _dy*_dy;
      if(_d2 < bh.pullR * bh.pullR){
        const _d = Math.sqrt(_d2) || 1;
        const proximity = 1 - _d / bh.pullR;
        if(proximity > bhNearFactor) bhNearFactor = proximity;
      }
    }
    // ミッション8はより機敏に（減衰を弱める）
    const dampBase = isM8 ? ((left||right) ? 0.88 : 0.82) : ((left||right) ? 0.85 : 0.79);
    const dampBH   = (left||right) ? 0.92 : 0.94;
    const damp = dampBase + (dampBH - dampBase) * bhNearFactor;
    rocketVX *= damp;
    const maxVX = isM8 ? 340 : 310;
    rocketVX=Math.max(-maxVX,Math.min(maxVX,rocketVX));
    rocketX=Math.max(22,Math.min(W-22,rocketX+rocketVX*dt));

    // 傾き強化：最大±35度、追従速度アップ
    const targetTilt=(rocketVX/maxVX)*0.62;
    rocketTilt+=(targetTilt-rocketTilt)*Math.min(1,dt*9);

    // スラスター炎パーティクル削除済み

    if(hitFlash>0)    hitFlash-=dt;
    if(pickupFlash>0) pickupFlash-=dt;

    // 排気パーティクルは3フレームに1回に間引き
    if(!window._exhaustFrame) window._exhaustFrame = 0;
    if(++window._exhaustFrame >= 3){ window._exhaustFrame = 0; addExhaust(rocketX,H-90+8); }
    for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.life-=dt/p.maxLife;}
    particles=particles.filter(p=>p.life>0);

    const dtScale = dt * 60; // 60fps基準の係数（60fpsなら≒1、低fpsほど大きくなる）
    for(const d of debris){d.x+=d.vx*dtScale;d.y+=d.vy*dtScale;d.rot+=d.rotV*dtScale;}
    debris=debris.filter(d=>d.y<H+40&&d.x<W+40&&d.alive);

    // 隕石同士の衝突（最大8個まで判定でコスト抑制）
    const debrisCheck = debris.filter(d => d.alive).slice(0, 8);
    for(let i=0;i<debrisCheck.length;i++){
      const a=debrisCheck[i];
      for(let j=i+1;j<debrisCheck.length;j++){
        const b=debrisCheck[j];
        const dx=b.x-a.x, dy=b.y-a.y;
        const dist2=dx*dx+dy*dy;
        const minD=a.r+b.r;
        if(dist2<minD*minD&&dist2>0){
          const d=Math.sqrt(dist2);
          const nx=dx/d, ny=dy/d;
          // 重なり解消
          const overlap=(minD-d)*0.5;
          a.x-=nx*overlap; a.y-=ny*overlap;
          b.x+=nx*overlap; b.y+=ny*overlap;
          // 速度交換（弾性衝突）
          const dvx=a.vx-b.vx, dvy=a.vy-b.vy;
          const dot=dvx*nx+dvy*ny;
          if(dot>0){
            const impulse=dot*0.85;
            a.vx-=nx*impulse; a.vy-=ny*impulse;
            b.vx+=nx*impulse; b.vy+=ny*impulse;
          }
        }
      }
    }

    for(const it of items){
      it.x+=it.vx*dtScale; it.y+=it.vy*dtScale;
      // 弾かれた後、元の軌跡に徐々に戻す
      if(it.bumped){
        it.bumpT=(it.bumpT||0)+0.04*dtScale;
        const resume=Math.min(1,it.bumpT);
        it.vx+=(it.origVx-it.vx)*Math.min(1, 0.08*dtScale);
        it.vy+=(it.origVy-it.vy)*Math.min(1, 0.08*dtScale);
        if(resume>=1&&Math.abs(it.vx-it.origVx)<0.05&&Math.abs(it.vy-it.origVy)<0.05){
          it.vx=it.origVx; it.vy=it.origVy; it.bumped=false;
        }
      } else {
        it.vx*=Math.pow(0.96, dtScale);
      }
    }

    // ハート同士の衝突（軽く軌道変化）
    const HEART_R=19;
    for(let i=0;i<items.length;i++){
      const a=items[i]; if(!a.alive) continue;
      for(let j=i+1;j<items.length;j++){
        const b=items[j]; if(!b.alive) continue;
        const dx=b.x-a.x, dy=b.y-a.y;
        const dist2=dx*dx+dy*dy;
        const minD=HEART_R*2;
        if(dist2<minD*minD&&dist2>0){
          const d=Math.sqrt(dist2);
          const nx=dx/d, ny=dy/d;
          const overlap=(minD-d)*0.5;
          a.x-=nx*overlap; a.y-=ny*overlap;
          b.x+=nx*overlap; b.y+=ny*overlap;
          const dvx=a.vx-b.vx, dvy=a.vy-b.vy;
          const dot=dvx*nx+dvy*ny;
          if(dot>0){
            const impulse=dot*0.5;
            a.vx-=nx*impulse; a.vy-=ny*impulse;
            b.vx+=nx*impulse; b.vy+=ny*impulse;
          }
          a.bumped=true; a.bumpT=0;
          b.bumped=true; b.bumpT=0;
        }
      }
    }

    spawnTimer-=dt;
    if(spawnTimer<=0){
      const interval=Math.max(0.88,2.2-dist/3000);
      if(!heartSetActive && heartSetClearTimer <= 0){
        const maxHearts = st().heartCount || 6;
        if(heartSpawnCount < maxHearts){ spawnHeartSets(); }
      }
      else if(Math.random()<0.45) spawnDebris();
      spawnTimer=interval*(0.6+Math.random()*0.8);
    }
    checkCollisions();
    checkMissedHearts();
    updateHeartSet(dt);
    if(!heartSetActive && heartSetClearTimer>0) heartSetClearTimer-=dt;
    checkDebrisHitsObjects();
    checkAstronautHeartCollision();
    checkBlackholeCollisions(dt);
    checkHalleyCollisions();
    items=items.filter(it=>it.y<H+60&&it.alive);
    updateUfos(dt);
    updateAstronauts(dt);
    updateBlackholes(dt);
    checkAstronautRescue();
    updateEnergyOrbs(dt);
    checkEnergyOrbPickup();

    if(energy<=0){
      if(state === 'playing'){
        // 大破演出を先に再生してから 'over' へ遷移
        state = 'exploding';
        _uiTime = 0;
        explosionT = 0;
        explosionX = rocketX;
        explosionY = H - 90;
        explosionPlayed = false;
        stopBgm();
        stopUfoLoopSound();
        stopBlackholeLoopSound();
        spawnExplosionParticles(explosionX, explosionY);
      }
    }
    { const maxHearts = s.heartCount || 6;
      if(heartSpawnCount >= maxHearts && !heartSetActive && heartSetClearTimer <= 0){
        state='arrive_anim'; arriveT=0; stopAllSounds();
      }
    }
  }

  drawStars();
  updateAndDrawShootingStars(dt);
  if(state==='playing'){ drawBgDest(); }
  // ミッション8専用：惑星スクロール（星背景の直後・隕石より前）
  if(state==='playing') updateSecretScrollPlanets(dt);
  drawSecretScrollPlanets();
  if(state==='playing') for(const bh of blackholes) if(bh.alive) drawBlackhole(bh);
  for(const d of debris) if(d.alive) drawMeteor(d);
  drawSuckingObjects();
  for(const a of astronauts) if(a.alive) drawAstronaut(a);
  for(const u of ufos) drawUfo(u);
  drawHalleys();
  for(const it of items) if(it.alive) drawHeartItem(it);
  drawEnergyOrbs();
  if(state==='playing'){
    // Rocket wobble during playing
    rocketShakeT += 0.18;
    const playShakeX = Math.sin(rocketShakeT * 2.3) * 0.7 + Math.sin(rocketShakeT * 5.1) * 0.3;
    const playShakeY = Math.sin(rocketShakeT * 3.7) * 0.4;
    drawRocketAt(rocketX + shakeX + playShakeX, H - 90 + shakeY + playShakeY, false, rocketTilt);
  }
  drawParticles();
  drawHitFlash();
  if(state==='playing') drawHUD();

  // --- オーバーレイ表示（状態に応じたメッセージ）の書き換え ---
  if (state === 'start') {
    _uiTime += dt;
    drawStartScreen();
  } 
  else if (state === 'over') {
    _uiTime += dt;
    drawGameOverScreen();
  } 
  else if (state === 'stage_clear') {
    _uiTime += dt;
    drawStageClearScreen(stageIdx);
  }
  else if (state === 'licensed_clear') {
    // licensedCelebOverlayが全面表示中 - Canvas描画なし（オーバーレイのみ表示）
    drawStars();
  }

  updateBtn();
  requestAnimationFrame(loop);
}

// ===== エネルギーオーブ（ミッション8専用）=====
let energyOrbs = [];
let energyOrbSpawnTimer = 9999;

// ===== ミッション8専用：惑星スクロール =====
// 海王星→月の順に距離（hudProgress）に連動して画面上から下へ流す
const SECRET_SCROLL_PLANETS = [
  // progress範囲: 0〜1（hudProgressに対応）
  // 各惑星は progress がそのtrackAt付近になると上から流れ落ちる
  // 地球は表示しない。月まで。
  { getImg: () => neptuneCanvas,  trackAt: 0.12 },
  { getImg: () => uranusCanvas,   trackAt: 0.25 },
  { getImg: () => saturnCanvas,   trackAt: 0.38 },
  { getImg: () => jupiterCanvas,  trackAt: 0.52 },
  { getImg: () => marsCanvas,     trackAt: 0.66 },
  { getImg: () => moonCanvas,     trackAt: 0.82 },
];

let secretScrollPlanets = []; // 現在スクロール中の惑星エフェクト
let _lastSecretProgress = -1; // 前回の進捗（重複スポーン防止）

function spawnSecretPlanet(img, isSaturn) {
  if (!img) return;
  const x = 20 + Math.random() * (W - 40); // 左～右ランダム
  secretScrollPlanets.push({
    img,
    isSaturn,
    x,
    y: -40,
    vy: 0.20 + Math.random() * 0.12, // 速度をさらに遅く
    size: 62 + Math.random() * 18,  // 現在の約2倍のサイズ
    alpha: 0,
    life: 1.0,
    phase: 'in', // 'in'→'scroll'→'out'
  });
}

function updateSecretScrollPlanets(dt) {
  if (!st() || !st().isSecret) {
    secretScrollPlanets = [];
    _lastSecretProgress = -1;
    return;
  }

  // hudProgressに応じて惑星をスポーン
  const prog = hudProgress;
  for (const def of SECRET_SCROLL_PLANETS) {
    if (_lastSecretProgress < def.trackAt && prog >= def.trackAt) {
      const img = def.getImg();
      const isSaturn = def === SECRET_SCROLL_PLANETS[2]; // 土星（index=2）のみisSaturn
      spawnSecretPlanet(img, isSaturn);
    }
  }
  _lastSecretProgress = prog;

  // 更新
  for (let i = secretScrollPlanets.length - 1; i >= 0; i--) {
    const p = secretScrollPlanets[i];
    p.y += p.vy * dt * 60;
    // フェードイン
    if (p.alpha < 1 && p.phase === 'in') {
      p.alpha = Math.min(1, p.alpha + dt * 2.5);
      if (p.alpha >= 1) p.phase = 'scroll';
    }
    // 画面下端を超えたらフェードアウト開始（完全に画面外まで待つ）
    const planetH = p.isSaturn ? p.size * 1.2 : p.size;
    if (p.y - planetH/2 > H && p.phase === 'scroll') {
      p.phase = 'out';
    }
    if (p.phase === 'out') {
      p.alpha = Math.max(0, p.alpha - dt * 4.0);
    }
    if (p.alpha <= 0 && p.phase === 'out') {
      secretScrollPlanets.splice(i, 1);
    }
  }
}

function drawSecretScrollPlanets() {
  if (!st() || !st().isSecret) return;
  for (const p of secretScrollPlanets) {
    if (!p.img) continue;
    ctx.save();
    ctx.globalAlpha = p.alpha; // 不透過（alpha=1で完全不透過）
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'medium';

    // グロー
    ctx.shadowColor = 'rgba(180,220,255,0.7)';
    ctx.shadowBlur = 14;

    if (p.isSaturn) {
      // 土星：横長のまま、リングの端まできっちり表示（クリップなし）
      const img = p.img;
      // オフスクリーンcanvasの場合はwidth/heightを使用、元画像なら naturalWidth/Height
      const imgW = img.width || img.naturalWidth || 1;
      const imgH = img.height || img.naturalHeight || 1;
      const asp = imgW / Math.max(imgH, 1);
      const dh = p.size * 1.2; // 高さはsizeより少し大きく（リング全体を含む）
      const dw = dh * asp;     // アスペクト比を保ってリングの端まで表示
      ctx.drawImage(img, 0, 0, imgW, imgH, p.x - dw/2, p.y - dh/2, dw, dh);
    } else {
      // 通常惑星：円形にクリップ
      const r = p.size / 2;
      const img = p.img;
      const imgW = img.width || img.naturalWidth || 1;
      const imgH = img.height || img.naturalHeight || 1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(img, 0, 0, imgW, imgH, p.x - r, p.y - r, p.size, p.size);
    }
    ctx.restore();
  }
}

function spawnEnergyOrb() {
  // 画面全体のランダムな位置から漂わせる（4辺から出現）
  let x, y, vx, vy;
  const side = Math.floor(Math.random() * 4);
  const r = 22;
  if (side === 0) { x = Math.random() * W; y = -r; vx = (Math.random()-0.5)*0.4; vy = 0.3+Math.random()*0.5; }
  else if (side === 1) { x = W+r; y = Math.random()*H; vx = -(0.3+Math.random()*0.5); vy = (Math.random()-0.5)*0.4; }
  else if (side === 2) { x = Math.random()*W; y = H+r; vx = (Math.random()-0.5)*0.4; vy = -(0.3+Math.random()*0.5); }
  else { x = -r; y = Math.random()*H; vx = 0.3+Math.random()*0.5; vy = (Math.random()-0.5)*0.4; }
  energyOrbs.push({
    x, y, vx, vy, r,
    driftAngle: Math.random()*Math.PI*2,
    driftSpeed: 0.3+Math.random()*0.5,
    driftAmplitude: 8+Math.random()*12,
    timer: 0,
    alive: true,
  });
}

function updateEnergyOrbs(dt) {
  if (!st() || !st().isSecret) return;
  energyOrbSpawnTimer -= dt;
  if (energyOrbSpawnTimer <= 0 && energyOrbs.length < 2) {
    spawnEnergyOrb();
    energyOrbSpawnTimer = 25 + Math.random()*20;
  }
  for (const o of energyOrbs) {
    if (!o.alive) continue;
    o.timer += dt;
    // 基本方向に漂いつつ、サイン波でふわふわ
    const perpX = -o.vy / (Math.sqrt(o.vx*o.vx+o.vy*o.vy)||1);
    const perpY =  o.vx / (Math.sqrt(o.vx*o.vx+o.vy*o.vy)||1);
    const wave = Math.sin(o.timer * o.driftSpeed + o.driftAngle) * o.driftAmplitude * 0.02;
    o.x += (o.vx + perpX*wave) * dt * 60;
    o.y += (o.vy + perpY*wave) * dt * 60;

    // ── 隕石との衝突：エネルギーが軌道を変える ──
    for (const d of debris) {
      if (!d.alive) continue;
      const dx = d.x - o.x, dy = d.y - o.y;
      const dist2 = dx*dx + dy*dy;
      const minD = o.r + d.r;
      if (dist2 < minD*minD && dist2 > 0) {
        const dist = Math.sqrt(dist2);
        const nx = dx/dist, ny = dy/dist;
        // エネルギーが隕石を弾き飛ばす
        d.vx += nx * (3 + d.r * 0.1);
        d.vy += ny * (3 + d.r * 0.1);
        d.rotV = (Math.random()-0.5) * 0.12;
        // エネルギーも少し反発
        o.vx -= nx * 0.5;
        o.vy -= ny * 0.5;
      }
    }

    // ── ハレー彗星との衝突：エネルギーが軌道を変える ──
    for (const h of halleys) {
      if (!h.alive) continue;
      const dx = h.x - o.x, dy = h.y - o.y;
      const dist2 = dx*dx + dy*dy;
      const minD = o.r + (h.r || 12);
      if (dist2 < minD*minD && dist2 > 0) {
        const dist = Math.sqrt(dist2);
        const nx = dx/dist, ny = dy/dist;
        h.vx += nx * 2.5;
        h.vy += ny * 2.5;
        o.vx -= nx * 0.6;
        o.vy -= ny * 0.6;
      }
    }

    // ── UFOとの衝突：エネルギーがUFOを弾く ──
    for (const u of ufos) {
      if (u.exploding) continue;
      const dx = u.x - o.x, dy = u.y - o.y;
      const dist2 = dx*dx + dy*dy;
      const minD = o.r + 26;
      if (dist2 < minD*minD && dist2 > 0) {
        const dist = Math.sqrt(dist2);
        const nx = dx/dist, ny = dy/dist;
        u.x += nx * 15;
        u.y += ny * 15;
        o.vx -= nx * 0.5;
        o.vy -= ny * 0.5;
      }
    }

    // ── ブラックホールとの衝突：エネルギーがブラックホールに吸い込まれる ──
    for (const bh of blackholes) {
      if (!bh.alive) continue;
      const dx = bh.x - o.x, dy = bh.y - o.y;
      const dist2 = dx*dx + dy*dy;
      if (dist2 < bh.pullR * bh.pullR && dist2 > 0) {
        const dist = Math.sqrt(dist2);
        const proximity = 1 - dist / bh.pullR;
        // 引力で引き寄せる
        o.vx += (dx/dist) * proximity * 1.2;
        o.vy += (dy/dist) * proximity * 1.2;
        // 核に近づいたら螺旋吸込みアニメに移行
        if (dist < (bh.r || 18) * 1.5) {
          o.alive = false;
          suckingObjects.push({
            x: o.x, y: o.y, bhX: bh.x, bhY: bh.y,
            rot: Math.random() * Math.PI * 2,
            origR: o.r,
            scale: 1.0, alpha: 1.0, type: 'energyOrb'
          });
        }
      }
    }
  }
  energyOrbs = energyOrbs.filter(o => o.alive && o.x > -60 && o.x < W+60 && o.y > -60 && o.y < H+60);
}

function drawEnergyOrbs() {
  for (const o of energyOrbs) {
    if (!o.alive) continue;
    ctx.save();
    const pulse = 0.85 + 0.15 * Math.sin(Date.now()*0.004 + o.driftAngle);
    const glowR = o.r * 1.6 * pulse;
    // 外側グロー
    const grd = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, glowR);
    grd.addColorStop(0,   'rgba(80,220,255,0.55)');
    grd.addColorStop(0.4, 'rgba(40,180,255,0.35)');
    grd.addColorStop(0.75,'rgba(20,120,255,0.12)');
    grd.addColorStop(1,   'rgba(0,80,200,0)');
    ctx.fillStyle = grd;
    ctx.beginPath(); ctx.arc(o.x, o.y, glowR, 0, Math.PI*2); ctx.fill();
    // 本体
    ctx.shadowColor = 'rgba(80,200,255,0.9)';
    ctx.shadowBlur  = 14;
    if (energyImg.complete && energyImg.naturalWidth > 0) {
      const s = o.r * 2 * pulse;
      ctx.drawImage(energyImg, o.x - s/2, o.y - s/2, s, s);
    } else {
      // フォールバック：青白い円
      const ig = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, o.r);
      ig.addColorStop(0,   '#ffffff');
      ig.addColorStop(0.3, '#80eeff');
      ig.addColorStop(0.7, '#0088ff');
      ig.addColorStop(1,   'rgba(0,60,200,0)');
      ctx.fillStyle = ig;
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r*pulse, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

function checkEnergyOrbPickup() {
  if (!st() || !st().isSecret) return;
  const rx = rocketX, ry = H - 90;
  const hitPoints = getRocketHitPoints(rx, ry, rocketTilt);
  for (const o of energyOrbs) {
    if (!o.alive) continue;
    // ロケットのhitPointsいずれかがオーブ半径内に入ったら取得
    const pickupR = o.r + 8; // 少し余裕を持たせる
    const pickupR2 = pickupR * pickupR;
    let hit = false;
    for (const [px, py] of hitPoints) {
      const dx = o.x - px, dy = o.y - py;
      if (dx*dx + dy*dy < pickupR2) { hit = true; break; }
    }
    if (hit) {
      o.alive = false;
      energy = ENERGY_MAX;
      life   = LIFE_MAX;
      pickupFlash = 0.7;
      _playSE('seEnergyPickupEl', 0.35);
    }
  }
}

  stopUfoLoopSound();
  stopBlackholeLoopSound();
  currentBlock = null;
  _uiTime = 0;
  rocketX=W/2; rocketVX=0; rocketTilt=0; speed=FIXED_SPEED; dist=0;
  keys={}; // タッチ入力の残りをリセット
  debris=[]; items=[]; particles=[]; ufos=[]; astronauts=[]; blackholes=[]; suckingObjects=[];
  blackholeUsed=false;
  heartSetActive=false; heartSetClearTimer=0; lastMissedAnswer=null; hintDismissed=false; heartSpawnCount=0; hudProgress=0; hudTarget=0; playingTime=0;
  spawnTimer=1.5; hitFlash=0; pickupFlash=0; shakeX=0; shakeY=0;
  launchT=0; arriveT=0; bgDestLastR=0; bgDestLastY=0;
  // starScrollはリセットしない（背景が瞬間ジャンプしないよう継続スクロール）
  state='launch_anim';
  shootingStars=[]; shootingStarTimer=1+Math.random()*3;
  { // ハレー彗星タイマー初期値（ミッション1は使わない、2以降はidに応じて短縮）
    const sid = STAGES[idx] ? STAGES[idx].id : 1;
    if (sid < 2) {
      halleyTimer = 9999; // ミッション1では出現しない
    } else {
      const base = Math.max(6,  28 - (sid - 2) * 4.0);

      halleyTimer = base + Math.random() * rng;
    }
  }
  halleys=[];
  ufoSpawnTimer=8+Math.random()*10;
  astronautSpawnTimer=30+Math.random()*25;
  energyOrbSpawnTimer = 25 + Math.random()*20; // ミッション8専用エネルギーオーブ
  energyOrbs = [];
  secretScrollPlanets = []; // ミッション8専用惑星スクロールリセット
  _lastSecretProgress = -1;
  // ブラックホール初回出現タイマー：ミッションが進むほど早く出現
  { const sid = STAGES[idx] ? STAGES[idx].id : 5;
    const baseMin = Math.max(20, 35 - (sid - 5) * 7);
    const baseRng = Math.max(10, 20 - (sid - 5) * 4);
    blackholeSpawnTimer = baseMin + Math.random() * baseRng;
  }
  rocketShakeT=0;
  // 大破アニメーションリセット
  explosionT=0; explosionParticles=[]; explosionPlayed=false;
  // ステージ開始時はエネルギーを全回復
  energy=ENERGY_MAX;
  life=LIFE_MAX;

}

function startGame(){
  life=LIFE_MAX;
  energy=ENERGY_MAX;
  startStage(0);
}

function isAnim() {
  // 演出用タイマー変数が存在し、かつ0より大きい（動いている）場合は「真(true)」を返す
  if (typeof launchT !== 'undefined' && launchT > 0) return true;
  if (typeof arriveT !== 'undefined' && arriveT > 0) return true;
  if (state === 'exploding') return true;
  return false;
}

function handleStart() {
  if(isAnim()) return;
  // startStage に一本化（stageIdx はそのまま使う）
  startStage(stageIdx);
  updateBtn();
}

// =========================
// 共通：星クリック判定関数
// =========================
function getClickedStage(mx, my){
  const mapH = 82;
  const _off = (state === 'start') ? START_MAP_OFFSET : 0;
  const mapY = H - mapH - 4 - _off;
  const N = 8;
  const PAD = 18;
  const slotW = (W - 12 - PAD * 2) / (N - 1);
  const lineY = mapY + 38;
  const iconR = 16;

  for(let i = 0; i < N; i++){
    const sx = 6 + PAD + i * slotW;
    const dx = mx - sx;
    const dy = my - lineY;

    if(dx*dx + dy*dy < iconR*iconR){
      // 地球(i=0)は常にクリック可能、それ以外はクリア済みのみ
      const isUnlocked = (i === 0) || (i <= completedCount);
      if(!isUnlocked) return -1;
      // インデックス7（N-1）は心臓星（ゴール）なので、そのまま7を返す
      return i;
    }
  }

  return -1;
}

function startFromMap(stage){
  stageIdx = stage;

  // ★ launch.mp3 を最優先で再生（Android: JSが重い処理より前に play() を呼ぶ）
  _triggerLaunchAudio();

  // スタート画面の心音・拍動を停止
  startScreenBgmStop();

  // UI非表示
  startBtn.classList.add('hidden');
  document.getElementById('heartPlanetWrap').style.display = 'none';

  startStage(stage);
}

cv.addEventListener('mousemove', (e) => {
  if(isAnim() || state==='playing'){
    cv.style.cursor='default';
    mapHoveredStar=-1;
    _resetBtnHover = false;
    return;
  }

  const rect = cv.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  const my = (e.clientY - rect.top) * (H / rect.height);

  // リセットボタンのホバー判定（スタート画面のみ）
  if(state === 'start' && _resetBtnRect){
    const rb = _resetBtnRect;
    const onReset = mx >= rb.x && mx <= rb.x + rb.w && my >= rb.y && my <= rb.y + rb.h;
    _resetBtnHover = onReset;
    if(onReset){
      cv.style.cursor = 'pointer';
      mapHoveredStar = -1;
      _medalHoverIdx = -1;
      return;
    }
  } else {
    _resetBtnHover = false;
  }

  // 左上勲章のホバー判定（スタート画面のみ）
  if(state === 'start' && _medalRects.length > 0){
    let foundMedal = -1;
    for(const r of _medalRects){
      if(mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h){
        foundMedal = r.idx;
        break;
      }
    }
    if(foundMedal !== _medalHoverIdx){ _medalHoverIdx = foundMedal; }
    if(foundMedal >= 0){
      cv.style.cursor = 'pointer';
      mapHoveredStar = -1;
      return;
    }
  } else {
    _medalHoverIdx = -1;
  }

  const stage = getClickedStage(mx, my);

  mapHoveredStar = stage >= 0 ? stage : -1;
  cv.style.cursor = stage >= 0 ? 'pointer' : 'default';
});

document.addEventListener('keydown',e=>{
  if(state !== 'launch_anim') keys[e.key]=true;
  if((e.key===' '||e.key==='Enter')&&!isAnim()&&state!=='playing'){
    e.preventDefault();
    if(state === 'stage_clear'){
      // ミッションクリア後：ボタンと同じく次のステージへ進む
      stageIdx++;
      if(stageIdx < STAGES.length){
        document.getElementById('startBtn').classList.add('hidden');
        const hpw = document.getElementById('heartPlanetWrap');
        if(hpw) hpw.style.display = 'none';
        startFromMap(stageIdx);
      } else {
        state = 'all_clear';
        updateBtn();
      }
    } else {
      handleStart();
    }
  }
  if([' ','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
});

document.addEventListener('keyup',e=>{
  keys[e.key]=false;
});

// =========================
// タッチ開始（統一版）
// =========================
cv.addEventListener('touchstart', (e) => {
  e.preventDefault();
  // iOS: ジェスチャースコープを保持するため await せずに即座にアンロックし、
  //      アクションも同一イベント内で実行する
  unlockAudio();
  _ensureBgmPlaying(); // iOS: playing中に心音が止まっていたら即再開

  const t = e.touches[0];
  if(!t) return;

  const rect = cv.getBoundingClientRect();
  const mx = (t.clientX - rect.left) * (W / rect.width);
  const my = (t.clientY - rect.top) * (H / rect.height);

  // 出発アニメ中は一切の入力を遮断（音声が途切れる問題の対策）
  if(state === 'launch_anim') return;

  // ライセンスお祝いオーバーレイ表示中はCanvas入力を無視
  if(state === 'licensed_clear') return;

  // playing中はタッチ位置で左右移動を即開始
  if(state === 'playing'){
    keys['ArrowLeft']  = mx < W / 2;
    keys['ArrowRight'] = mx >= W / 2;
    return;
  }

  const stage = getClickedStage(mx, my);

  // ── リセットボタン判定（スタート画面のみ）──
  if(state === 'start' && _resetBtnRect && stage < 0){
    const rb = _resetBtnRect;
    if(mx >= rb.x && mx <= rb.x + rb.w && my >= rb.y && my <= rb.y + rb.h){
      // タッチ中はホバー状態をON（一瞬光らせる）
      _resetBtnHover = true;
      setTimeout(() => { _resetBtnHover = false; }, 300);
      if(confirm('すべての記録（クリア済みミッション・マイスター勲章）をリセットしますか？')){
        try{ localStorage.removeItem('shinon_completedCount'); localStorage.removeItem('shinon_secretCleared'); localStorage.removeItem('shinon_licensedCleared'); }catch(e2){}
        completedCount = 0; secretCleared = false; licensedCleared = false; stageIdx = 0; updateBtn();
      }
      return;
    }
  }

  if(stage >= 0){
    // 心臓星（index=7）→ ミッション8を直接開始
    if(stage === 7){
      startFromMap(7);
      return;
    }
    // 海王星（index=6）→ ミッション7を直接開始（ライセンス取得済みの場合のみ）
    if(stage === 6 && licensedCleared){
      startFromMap(6);
      return;
    }
    // 地球（index=0）→ ミッション1を直接開始（マイスター取得済みの場合のみ）
    if(stage === 0 && secretCleared){
      startFromMap(0);
      return;
    }
    startFromMap(stage);
    return;
  }

  // スタート画面・ミッションクリア画面・全クリア画面・ゲームオーバー画面では星以外のタッチを無視

  const stage = getClickedStage(mx, my);

  // ただし左上の勲章クリックはお祝いページへ

// ===== iPad黒帯タップ対応 =====
// Canvasの外側（両端の黒帯）をタップしてもロケット操作できるようにする
// document レベルで touchstart/touchmove/touchend を受け取り、
// playing中はCanvas外のタッチでも左右移動を有効にする
function _getCanvasTouchSide(clientX) {
  const rect = cv.getBoundingClientRect();
  // キャンバス左端より左 → 左移動、右端より右 → 右移動
  // キャンバス内はCanvas側のハンドラに任せる（ここでは黒帯のみ処理）
  if (clientX < rect.left)  return 'left';
  if (clientX > rect.right) return 'right';
  return null; // キャンバス内
}

document.addEventListener('touchstart', (e) => {
  if (state !== 'playing') return;
  const t = e.touches[0]; if (!t) return;
  const side = _getCanvasTouchSide(t.clientX);
  if (side === 'left')  { keys['ArrowLeft'] = true;  keys['ArrowRight'] = false; }
  if (side === 'right') { keys['ArrowRight'] = true; keys['ArrowLeft']  = false; }
}, { passive: true });

document.addEventListener('touchmove', (e) => {
  if (state !== 'playing') return;
  const t = e.touches[0]; if (!t) return;
  const side = _getCanvasTouchSide(t.clientX);
  if (side === 'left')  { keys['ArrowLeft'] = true;  keys['ArrowRight'] = false; }
  if (side === 'right') { keys['ArrowRight'] = true; keys['ArrowLeft']  = false; }
}, { passive: true });

document.addEventListener('touchend', (e) => {
  if (state !== 'playing') return;
  // まだ触れているタッチがキャンバス外なければキーを解除
  let hasLeft = false, hasRight = false;
  for (const t of e.touches) {
    const side = _getCanvasTouchSide(t.clientX);
    if (side === 'left')  hasLeft  = true;
    if (side === 'right') hasRight = true;
  }
  // 黒帯のタッチが離れた側をリセット（キャンバス内のタッチはCanvas側ハンドラで管理）
  if (!hasLeft  && keys['ArrowLeft']  && _getCanvasTouchSide(0) === 'left')  keys['ArrowLeft']  = false;
  if (!hasRight && keys['ArrowRight'] && _getCanvasTouchSide(window.innerWidth) === 'right') keys['ArrowRight'] = false;
}, { passive: true });

// 旅の回想ベルトを構築
function buildJourneyTrail() {
  const trail = document.getElementById('journeyTrail');
  trail.innerHTML = '';

  JOURNEY_DATA.forEach((d, i) => {
    // 惑星アイコン（canvas経由で円形に）
    const oc = document.createElement('canvas');
    if(d.isSaturn){
      oc.width = 46; oc.height = 28;
      oc.className = 'journey-saturn';
      oc.style.cssText = 'width:46px;height:28px;flex-shrink:0;';
      const c = oc.getContext('2d');
      c.imageSmoothingEnabled = true;
      c.imageSmoothingQuality = 'medium';
      if(d.img.complete && d.img.naturalWidth){
        c.drawImage(d.img, 0, 0, 46, 28);
      }
    } else {
      oc.width = 28; oc.height = 28;
      oc.style.cssText = `width:28px;height:28px;flex-shrink:0;border-radius:50%;${i===7?'box-shadow:0 0 8px rgba(255,200,100,0.9);':''}`;
      const c = oc.getContext('2d');
      c.imageSmoothingEnabled = true;
      c.imageSmoothingQuality = 'medium';
      c.beginPath(); c.arc(14,14,14,0,Math.PI*2); c.clip();
      if(d.img.complete && d.img.naturalWidth){
        const iw=d.img.naturalWidth,ih=d.img.naturalHeight;
        const sq=Math.min(iw,ih);
        c.drawImage(d.img,(iw-sq)/2,(ih-sq)/2,sq,sq,0,0,28,28);
      } else {
        c.fillStyle = d.color;
        c.fillRect(0,0,28,28);
      }
    }
    trail.appendChild(oc);

    // 最後の惑星の後はラインなし
    if(i < JOURNEY_DATA.length - 1){
      const line = document.createElement('div');
      line.className = 'journey-line';
      line.style.cssText = `width:14px;height:2px;flex-shrink:0;background:linear-gradient(90deg,${d.color},${JOURNEY_DATA[i+1].color});opacity:0.55;`;
      trail.appendChild(line);
      // ロケットを途中に1つ挿入（地球→月の間）
      if(i === 0){
        const rkt = document.createElement('span');
        rkt.className = 'journey-rocket';
        rkt.textContent = '🚀';
        trail.appendChild(rkt);
        const line2 = document.createElement('div');

        line2.style.cssText = `width:14px;height:2px;flex-shrink:0;background:linear-gradient(90deg,${d.color},${JOURNEY_DATA[i+1].color});opacity:0.55;`;
        trail.appendChild(line2);
      }
    }
  });
}

// 背景：流れ星＋星空をcanvasに描画
let celebAnimId = null;
function startCelebBgCanvas() {
  const canvas = document.getElementById('celebBgCanvas');
  const c = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W2 = canvas.offsetWidth || 320;
  const H2 = canvas.offsetHeight || 520;
  canvas.width = W2 * dpr; canvas.height = H2 * dpr;
  canvas.style.width = W2 + 'px'; canvas.style.height = H2 + 'px';
  c.scale(dpr, dpr);

  // 背景星
  const stars = Array.from({length:160},()=>({
    x:Math.random()*W2, y:Math.random()*H2,
    r:Math.random()*1.3+0.2,
    a:Math.random(), speed:0.3+Math.random()*0.7,
  }));
  // 流れ星
  const meteors = [];
  function addMeteor(){
    meteors.push({
      x:Math.random()*W2, y:-10,
      vx:1.5+Math.random()*2, vy:3+Math.random()*4,
      len:40+Math.random()*60, life:1, alpha:0.9
    });
  }
  let meteorTimer=0;

  function drawBg(ts){
    c.clearRect(0,0,W2,H2);
    // 星
    stars.forEach(s=>{
      s.a = 0.4+0.6*Math.abs(Math.sin(ts*0.001*s.speed+s.x));
      c.beginPath();
      c.arc(s.x,s.y,s.r,0,Math.PI*2);
      c.fillStyle=`rgba(255,255,255,${s.a})`;
      c.fill();
    });
    // 流れ星
    meteorTimer+=16;
    if(meteorTimer>700){ meteorTimer=0; addMeteor(); }
    for(let i=meteors.length-1;i>=0;i--){
      const m=meteors[i];
      m.x+=m.vx; m.y+=m.vy; m.life-=0.018;
      if(m.life<=0){ meteors.splice(i,1); continue; }
      const grd=c.createLinearGradient(m.x,m.y,m.x-m.vx/m.vy*m.len,m.y-m.len);
      grd.addColorStop(0,`rgba(255,255,220,${m.life*0.9})`);
      grd.addColorStop(1,'rgba(255,255,200,0)');
      c.strokeStyle=grd; c.lineWidth=1.5;
      c.beginPath(); c.moveTo(m.x,m.y);
      c.lineTo(m.x-m.vx/m.vy*m.len, m.y-m.len);
      c.stroke();
    }
    celebAnimId = requestAnimationFrame(drawBg);
  }
  if(celebAnimId) cancelAnimationFrame(celebAnimId);
  celebAnimId = requestAnimationFrame(drawBg);
}

function stopCelebBgCanvas(){
  if(celebAnimId){ cancelAnimationFrame(celebAnimId); celebAnimId=null; }
}
